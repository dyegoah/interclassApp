<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Interclass Arena</title>

    <!-- INJEÇÃO DO CSS E JS GLOBAIS DE ALTA PERFORMANCE -->
    <link rel="stylesheet" href="/estilo-global.css">
    <script src="/seguranca.js"></script>

	<link rel="manifest" href="/manifest.json">
	<meta name="theme-color" content="#05050f">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<link rel="apple-touch-icon" href="/img/icon-192x192.png">
    
    <style>
        /* CSS EXCLUSIVO DO CADASTRO DE PROFESSORES */
        .char-counter { font-size: 0.75rem; color: #888; float: right; margin-top: 5px; }

        .links-rodape { margin-top: 20px; font-size: 0.9rem; text-align: center;}
        .links-rodape a { color: #00f2fe; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .links-rodape a:hover { text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); text-decoration: underline; }
    </style>
</head>
<body class="bg-arena-login">

    <div class="glass-form">
        <h1 class="form-title">Criar Conta</h1>
        <p class="subtitle">Faça a gestão dos torneios da sua escola.</p>

        <!-- CAIXA DE MENSAGENS -->
        <div id="mensagem-alerta" class="alert"></div>

        <form id="form-cadastro" onsubmit="criarConta(event)">
            <div class="form-group">
                <label>Nome do Professor / Gestor</label>
                <!-- Trava HTML: Min 3, Max 50 caracteres -->
                <input type="text" id="nome" required minlength="3" maxlength="50" placeholder="Seu nome completo">
                <div class="char-counter">Máx. 50 caracteres</div>
            </div>

            <div class="form-group">
                <label>Nome da Escola / Instituição</label>
                <!-- Trava HTML: Min 3, Max 60 caracteres -->
                <input type="text" id="escola" required minlength="3" maxlength="60" placeholder="Ex: Colégio Estadual Modelo">
                <div class="char-counter">Máx. 60 caracteres</div>
            </div>

            <div class="form-group">
                <label>E-mail Institucional ou Pessoal</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label>Criar Senha</label>
                <!-- Trava HTML: Min 6, Max 20 caracteres -->
                <input type="password" id="senha" required minlength="6" maxlength="20" placeholder="Entre 6 e 20 caracteres">
                <div class="char-counter">Máx. 20 caracteres</div>
            </div>

            <button type="submit" class="btn-submit">Criar Minha Conta</button>
        </form>

        <div class="links-rodape">
            <span style="color: rgba(255,255,255,0.5);">Já possui uma conta? <a href="/index.html">Faça Login</a></span>
        </div>
    </div>

    <script>
        function mostrarAlerta(mensagem, tipo) {
            const alerta = document.getElementById('mensagem-alerta');
            alerta.textContent = mensagem;
            alerta.className = `alert alert-${tipo} d-block`;
            // Scroll suave para o alerta para chamar a atenção
            alerta.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        function validarEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        async function criarConta(event) {
            event.preventDefault();
            
            const nome = document.getElementById('nome').value.trim();
            const escola = document.getElementById('escola').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();
            
            // 🛡️ VALIDAÇÃO JAVASCRIPT EXTRAS ANTES DE ENVIAR
            if (!validarEmail(email)) {
                mostrarAlerta("Formato de e-mail inválido. Verifique o seu e-mail.", "danger");
                document.getElementById('email').focus();
                return;
            }

            if (senha.length < 6 || senha.length > 20) {
                mostrarAlerta("A senha deve ter entre 6 e 20 caracteres por segurança.", "danger");
                return;
            }

            const btnSubmit = document.querySelector('.btn-submit');
            const textoOriginal = btnSubmit.innerHTML;
            btnSubmit.innerHTML = "⏳ Forjando Cofre...";
            btnSubmit.disabled = true;
            document.getElementById('mensagem-alerta').className = 'alert'; // Esconde alertas anteriores

            try {
                const response = await fetch('/api/professores/cadastrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome: nome, escola: escola, email: email, senha: senha })
                });

                if (response.ok) {
                    mostrarAlerta("✅ Conta criada com sucesso! Redirecionando para o login...", "success");
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 2500);
                } else {
                    const msgErro = await response.text();
                    mostrarAlerta("❌ " + msgErro, "danger");
                }
            } catch (error) {
                console.error("Erro de comunicação:", error);
                mostrarAlerta("⚠️ Servidor indisponível no momento. Tente novamente mais tarde.", "danger");
            } finally {
                if(btnSubmit.innerHTML !== "✅ Conta criada com sucesso! Redirecionando para o login...") {
                    btnSubmit.innerHTML = textoOriginal;
                    btnSubmit.disabled = false;
                }
            }
        }
    </script>
</body>
</html>
