<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Interclass Arena</title>
	<link rel="manifest" href="/manifest.json">
	<meta name="theme-color" content="#05050f">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<link rel="apple-touch-icon" href="/img/icon-192x192.png">
    <style>

        :root { --theme-primary: #ff00de; --theme-glow: rgba(255, 0, 222, 0.5); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        body { 
            background-color: #05050f;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 242, 254, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            animation: moveGrid 20s linear infinite;
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 2rem; 
        }

        @keyframes moveGrid {
            0% { background-position: center center, 0 0, 0 0; }
            100% { background-position: center center, 40px 40px, 40px 40px; }
        }
        
        .glass-form { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 500px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border-top: 4px solid var(--theme-primary); }
        
        h1 { font-family: 'Orbitron', sans-serif; color: var(--theme-primary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; text-shadow: 0 0 15px var(--theme-glow); text-align: center;}
        p.subtitle { color: rgba(255,255,255,0.6); margin-bottom: 20px; font-size: 0.95rem; text-align: center; }

        /* 🔥 ESTILO DOS AVISOS (TIPO BOOTSTRAP) 🔥 */
        .alert { padding: 15px; margin-bottom: 20px; border: 1px solid transparent; border-radius: 8px; font-size: 0.9rem; text-align: center; display: none; font-weight: bold; font-family: 'Segoe UI'; }
        .alert-danger { color: #ffccdd; background-color: rgba(255, 0, 85, 0.1); border-color: #ff0055; box-shadow: 0 0 15px rgba(255,0,85,0.3); }
        .alert-success { color: #ccffcc; background-color: rgba(0, 255, 0, 0.1); border-color: #00ff00; box-shadow: 0 0 15px rgba(0,255,0,0.3); }
        .d-block { display: block !important; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 1px; font-weight: bold;}
        
        /* Travas de limite e dicas visuais */
        .form-group input { width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: white; outline: none; transition: 0.3s; font-size: 1rem; }
        .form-group input:focus { border-color: var(--theme-primary); box-shadow: 0 0 15px var(--theme-glow); }
        .char-counter { font-size: 0.75rem; color: #888; float: right; margin-top: 5px; }

        .btn-submit { width: 100%; padding: 15px; background: linear-gradient(90deg, #ff00de, #b200ff); border: none; border-radius: 30px; color: #fff; font-weight: bold; font-family: 'Orbitron', sans-serif; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; margin-top: 15px; transition: 0.3s; box-shadow: 0 0 15px var(--theme-glow); }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 0 25px rgba(255, 0, 222, 0.8); }

        .links-rodape { margin-top: 20px; font-size: 0.9rem; text-align: center;}
        .links-rodape a { color: #00f2fe; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .links-rodape a:hover { text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); text-decoration: underline; }
        
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    </style>
</head>
<body>

    <div class="glass-form">
        <h1>Criar Conta</h1>
        <p class="subtitle">Faça a gestão dos torneios da sua escola.</p>

        <!-- CAIXA DE MENSAGENS -->
        <div id="mensagem-alerta" class="alert"></div>

        <form id="form-cadastro" onsubmit="criarConta(event)">
            <div class="form-group">
                <label>Nome do Professor / Gestor</label>
                <!-- Trava HTML: Min 3, Max 50 caracteres -->
                <input type="text" id="nome" required minlength="3" maxlength="50" placeholder="Seu nome completo">
                <div class="char-counter">Máx. 50 caracteres</div>
            </div>

            <div class="form-group">
                <label>Nome da Escola / Instituição</label>
                <!-- Trava HTML: Min 3, Max 60 caracteres -->
                <input type="text" id="escola" required minlength="3" maxlength="60" placeholder="Ex: Colégio Estadual Modelo">
                <div class="char-counter">Máx. 60 caracteres</div>
            </div>

            <div class="form-group">
                <label>E-mail Institucional ou Pessoal</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label>Criar Senha</label>
                <!-- Trava HTML: Min 6, Max 20 caracteres -->
                <input type="password" id="senha" required minlength="6" maxlength="20" placeholder="Entre 6 e 20 caracteres">
                <div class="char-counter">Máx. 20 caracteres</div>
            </div>

            <button type="submit" class="btn-submit">Criar Minha Conta</button>
        </form>

        <div class="links-rodape">
            <span style="color: rgba(255,255,255,0.5);">Já possui uma conta? <a href="/index.html">Faça Login</a></span>
        </div>
    </div>

    <script>
        function mostrarAlerta(mensagem, tipo) {
            const alerta = document.getElementById('mensagem-alerta');
            alerta.textContent = mensagem;
            alerta.className = `alert alert-${tipo} d-block`;
            // Scroll suave para o alerta para chamar a atenção
            alerta.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        function validarEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        async function criarConta(event) {
            event.preventDefault();
            
            const nome = document.getElementById('nome').value.trim();
            const escola = document.getElementById('escola').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();
            
            // 🛡️ VALIDAÇÃO JAVASCRIPT EXTRAS ANTES DE ENVIAR
            if (!validarEmail(email)) {
                mostrarAlerta("Formato de e-mail inválido. Verifique o seu e-mail.", "danger");
                document.getElementById('email').focus();
                return;
            }

            if (senha.length < 6 || senha.length > 20) {
                mostrarAlerta("A senha deve ter entre 6 e 20 caracteres por segurança.", "danger");
                return;
            }

            const btnSubmit = document.querySelector('.btn-submit');
            const textoOriginal = btnSubmit.innerHTML;
            btnSubmit.innerHTML = "⏳ Forjando Cofre...";
            btnSubmit.disabled = true;
            document.getElementById('mensagem-alerta').className = 'alert'; // Esconde alertas anteriores

            try {
                const response = await fetch('/api/auth/registrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome: nome, escola: escola, email: email, senha: senha })
                });

                if (response.ok) {
                    mostrarAlerta("✅ Conta criada com sucesso! Redirecionando para o login...", "success");
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 2500);
                } else {
                    const msgErro = await response.text();
                    mostrarAlerta("❌ " + msgErro, "danger");
                }
            } catch (error) {
                console.error("Erro de comunicação:", error);
                mostrarAlerta("⚠️ Servidor indisponível no momento. Tente novamente mais tarde.", "danger");
            } finally {
                if(btnSubmit.innerHTML !== "✅ Conta criada com sucesso! Redirecionando para o login...") {
                    btnSubmit.innerHTML = textoOriginal;
                    btnSubmit.disabled = false;
                }
            }
        }
    </script>
</body>
</html>
