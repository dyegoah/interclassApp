<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Torneios - InterclassApp</title>
    <style>
        :root { --theme-primary: #00f2fe; --theme-glow: rgba(0, 242, 254, 0.5); --bg-gradient: linear-gradient(-45deg, #020111, #191970, #000000, #4b0082); }
        body.theme-fem { --theme-primary: #ff00de; --theme-glow: rgba(255, 0, 222, 0.5); --bg-gradient: linear-gradient(-45deg, #1a0011, #4d0033, #000000, #330022); }
        body.theme-misto { --theme-primary: #b200ff; --theme-glow: rgba(178, 0, 255, 0.5); --bg-gradient: linear-gradient(-45deg, #0a001a, #2a004d, #000000, #1f0033); }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', 'Segoe UI', sans-serif; }
        body { background: var(--bg-gradient); background-size: 400% 400%; animation: gradientBG 10s ease infinite; color: #ffffff; min-height: 100vh; padding-bottom: 100px; overflow-x: hidden; transition: background 0.5s ease; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); }
        .arena-container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .section-title { text-transform: uppercase; font-size: 1.1rem; letter-spacing: 1px; margin-bottom: 1rem; color: var(--theme-primary); text-shadow: 0 0 10px var(--theme-glow); display: flex; align-items: center; gap: 10px; }

        .stepper-container { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-radius: 15px; margin-bottom: 2rem; border-left: 4px solid var(--theme-primary); overflow-x: auto; }
        .stepper-step { display: flex; align-items: center; gap: 8px; font-family: 'Segoe UI'; font-size: 0.85rem; font-weight: bold; color: rgba(255,255,255,0.4); white-space: nowrap; }
        .stepper-step.active { color: var(--theme-primary); text-shadow: 0 0 8px var(--theme-glow); }
        .stepper-step.completed { color: #00ff00; text-shadow: 0 0 8px rgba(0,255,0,0.4); }
        .stepper-line { height: 2px; flex-grow: 1; background: rgba(255,255,255,0.1); margin: 0 10px; min-width: 20px; }
        .stepper-line.active { background: var(--theme-primary); box-shadow: 0 0 8px var(--theme-glow); }

        .btn-acao { background: var(--theme-primary); color: #000; border: none; padding: 1rem 2rem; border-radius: 30px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; font-family: 'Orbitron'; }
        .btn-acao:hover { box-shadow: 0 0 20px var(--theme-glow); transform: translateY(-2px); color: #fff; background: transparent; border: 1px solid var(--theme-primary); }
        .btn-acao:disabled { background: #555; color: #888; cursor: not-allowed; }
        .btn-secundario { background: transparent; border: 1px solid var(--theme-primary); color: var(--theme-primary); }
        .btn-secundario:hover { background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 15px var(--theme-glow); }

        .hub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .hub-item { display: flex; align-items: center; justify-content: space-between; padding: 1.5rem; border-radius: 12px; border-left: 5px solid var(--theme-primary); background: rgba(0,0,0,0.4); }
        .hub-status.pendente { color: #ff4500; font-family: 'Segoe UI'; font-size: 0.85rem; font-weight: bold; }
        .hub-status.concluido { color: #00ff00; font-family: 'Segoe UI'; font-size: 0.85rem; font-weight: bold; }

        .detalhe-painel { background: rgba(10, 10, 20, 0.8); border-radius: 15px; padding: 2rem; border-top: 4px solid var(--theme-primary); }
        .config-section { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .config-section h4 { color: var(--theme-primary); font-family: 'Orbitron'; font-size: 1rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        
        .input-dark { width: 100%; padding: 12px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; font-family: 'Segoe UI'; outline: none; transition: 0.3s; margin-bottom: 10px; }
        .input-dark:focus { border-color: var(--theme-primary); box-shadow: 0 0 10px var(--theme-glow); }
        .grid-2-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.02); padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; font-family: 'Segoe UI'; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.1); }
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.2); transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--theme-primary); box-shadow: 0 0 10px var(--theme-glow); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Estilos do Simulador Visual Inteligente */
        .simulador-box { background: rgba(0, 0, 0, 0.4); border: 1px dashed var(--theme-primary); border-radius: 10px; padding: 1.5rem; margin-top: 15px; font-family: 'Segoe UI'; }
        .simulador-titulo { color: var(--theme-primary); font-size: 0.9rem; text-transform: uppercase; font-weight: bold; margin-bottom: 1rem; letter-spacing: 1px; display: flex; align-items: center; gap: 8px;}
        .simulador-content { display: flex; justify-content: space-around; align-items: center; text-align: center; font-size: 0.85rem; color: rgba(255,255,255,0.8); }
        .sim-chave { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); min-width: 120px; }
        .sim-seta { color: var(--theme-primary); font-size: 1.5rem; }
        .sim-tabela { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .sim-tabela th { border-bottom: 1px solid var(--theme-primary); padding: 5px; color: var(--theme-primary); }
        .sim-tabela td { padding: 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    </style>
</head>
<body>
    <div class="arena-container">
        <div id="topbar-placeholder"></div>

        <div class="stepper-container glass">
            <div class="stepper-step completed" id="step-1"><span>1.</span> Gênero</div>
            <div class="stepper-line active" id="line-1"></div>
            <div class="stepper-step completed" id="step-2"><span>2.</span> Modalidades</div>
            <div class="stepper-line active" id="line-2"></div>
            <div class="stepper-step active" id="step-3"><span>3.</span> Torneios</div>
            <div class="stepper-line" id="line-3"></div>
            <div class="stepper-step" id="step-4"><span>4.</span> Calendário</div>
            <div class="stepper-line" id="line-4"></div>
            <div class="stepper-step" id="step-5"><span>5.</span> Alunos</div>
        </div>

        <div id="setup-step3-hub">
            <h2 class="section-title">⚙️ Passo 3: Hub de Torneios (<span id="txt-genero-hub"></span>)</h2>
            <div class="hub-grid" id="hub-container"></div>
            <div style="display: flex; justify-content: space-between; margin-top: 3rem;">
                <button class="btn-acao btn-secundario" onclick="window.location.href='/setup/modalidades'">🡨 Voltar Modalidades</button>
                <button class="btn-acao" id="btn-finalizar-setup" disabled onclick="window.location.href='/setup/calendario'">Avançar para Calendário ➔</button>
            </div>
        </div>

        <div id="setup-step4-form" style="display: none;">
            <button class="btn-acao btn-secundario" style="padding: 5px 15px; margin-bottom: 1rem; font-size: 0.8rem;" onclick="voltarParaHub()">🡨 Voltar ao Hub</button>
            <div class="detalhe-painel glass" id="detalhe-painel-content"></div>
        </div>
    </div> 

    <div id="footbar-placeholder"></div>

    <script>
        const modalidadeDefs = [
            { id: 1, nome: 'Futsal', icone: '⚽', cor: '#00f2fe' }, { id: 2, nome: 'Vôlei', icone: '🏐', cor: '#ff00de' },
            { id: 3, nome: 'Basquete', icone: '🏀', cor: '#ffee00' }, { id: 4, nome: 'Handebol', icone: '🤾', cor: '#ff7300' },
            { id: 5, nome: 'Queimada', icone: '☄️', cor: '#7f00ff' }, { id: 6, nome: 'Vôlei de Areia', icone: '🏖️', cor: '#f4a460' },
            { id: 7, nome: 'Natação', icone: '🏊', cor: '#00bfff' }, { id: 8, nome: 'Atletismo', icone: '🏃', cor: '#32cd32' },
            { id: 9, nome: 'Tênis de Mesa', icone: '🏓', cor: '#ff4500' }, { id: 10, nome: 'Xadrez', icone: '♟️', cor: '#ffffff' },
            { id: 11, nome: 'Dama', icone: '🏁', cor: '#b22222' }, { id: 12, nome: 'E-Sports', icone: '🎮', cor: '#00ff00' }
        ];

        let setupData = null;
        let modalidadeEditandoAtual = null;

        window.onload = () => {
            fetch('/topbar.html').then(r => r.text()).then(h => document.getElementById('topbar-placeholder').innerHTML = h).catch(()=>{});
            fetch('/footbar.html').then(r => r.text()).then(h => document.getElementById('footbar-placeholder').innerHTML = h).catch(()=>{});
            
            // TRAVA DE SEGURANÇA (Para testar sem passar pelo index)
            setupData = JSON.parse(localStorage.getItem('arenaSetup'));
            if(!setupData || !setupData.genero) { 
                console.warn("Gerando modo teste automático.");
                setupData = { genero: 'masculino', esportes: [{ id: 1, configurado: false }] }; 
            }

            if (setupData.genero === 'feminino') document.body.classList.add('theme-fem');
            if (setupData.genero === 'misto') document.body.classList.add('theme-misto');
            
            document.getElementById('txt-genero-hub').textContent = setupData.genero.toUpperCase();
            atualizarHub();
        };

        function atualizarHub() {
            const container = document.getElementById('hub-container');
            container.innerHTML = '';
            let todosConfigurados = true;

            setupData.esportes.forEach(esp => {
                const def = modalidadeDefs.find(m => m.id === esp.id);
                const statusHtml = esp.configurado ? `<span class="hub-status concluido">✓ CONCLUÍDO</span>` : `<span class="hub-status pendente">⚠️ PENDENTE</span>`;
                if(!esp.configurado) todosConfigurados = false;

                container.innerHTML += `
                    <div class="hub-item glass">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <span style="font-size: 2rem;">${def.icone}</span>
                            <div>
                                <h3 style="margin: 0; font-size: 1.1rem; color: var(--theme-primary);">${def.nome}</h3>
                                ${statusHtml}
                            </div>
                        </div>
                        <button class="btn-acao btn-secundario" style="padding: 8px 15px; font-size: 0.8rem;" onclick="abrirConfigEspecifica(${def.id})">
                            ${esp.configurado ? 'Editar Torneio' : 'Configurar Torneio'}
                        </button>
                    </div>
                `;
            });
            document.getElementById('btn-finalizar-setup').disabled = !todosConfigurados;
        }

        function abrirConfigEspecifica(idModalidade) {
            modalidadeEditandoAtual = idModalidade;
            const def = modalidadeDefs.find(m => m.id === idModalidade);
            
            document.getElementById('setup-step3-hub').style.display = 'none';
            document.getElementById('setup-step4-form').style.display = 'block';
            
            const painel = document.getElementById('detalhe-painel-content');
            painel.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem;">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span style="font-size: 3rem; background: rgba(0,0,0,0.5); border-radius: 50%; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--theme-primary);">${def.icone}</span>
                        <div>
                            <h2 style="color: white; text-transform: uppercase; font-size: 1.8rem; margin: 0; text-shadow: 0 0 10px var(--theme-glow);">${def.nome}</h2>
                            <p style="color: var(--theme-primary); font-family: 'Segoe UI'; font-weight: bold; margin: 0;">Categoria: ${setupData.genero.toUpperCase()}</p>
                        </div>
                    </div>
                </div>

                <form>
                    <div class="config-section">
                        <h4>🏆 Formato da Competição</h4>
                        <div class="grid-2-col" style="margin-bottom: 15px;">
                            <div>
                                <label style="font-family: 'Segoe UI'; font-size: 0.85rem; color: rgba(255,255,255,0.7); display:block; margin-bottom: 5px;">Sistema Principal</label>
                                <select class="input-dark" id="select-formato" onchange="atualizarSimulador()">
                                    <option value="eliminatoria">Mata-Mata (Eliminatória Direta)</option>
                                    <option value="liga">Pontos Corridos (Liga Pura)</option>
                                    <option value="grupos">Estilo Copa do Mundo (Grupos + Mata-Mata)</option>
                                    <option value="liga_playoffs">Liga com Playoffs (Grupos Único + Semifinal)</option>
                                </select>
                            </div>
                            <div>
                                <label style="font-family: 'Segoe UI'; font-size: 0.85rem; color: rgba(255,255,255,0.7); display:block; margin-bottom: 5px;">Limite de Times (Altere para ver a simulação)</label>
                                <input type="number" class="input-dark" id="qtd-times" placeholder="Ex: 8" value="4" oninput="atualizarSimulador()" min="2">
                            </div>
                        </div>

                        <div class="simulador-box">
                            <div class="simulador-titulo" id="simulador-titulo">💡 Simulação Visual</div>
                            <div id="simulador-render" class="simulador-content"></div>
                        </div>

                        <div id="opcoes-eliminatoria" class="grid-2-col" style="margin-top: 15px;">
                            <div class="switch-container"><span>Partidas de Ida e Volta?</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
                            <div class="switch-container"><span>Disputa de 3º e 4º Lugar?</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
                        </div>
                        
                        <div id="opcoes-grupos" class="grid-2-col" style="display: none; margin-top: 15px;">
                            <div>
                                <label style="font-family: 'Segoe UI'; font-size: 0.85rem; color: rgba(255,255,255,0.7); display:block; margin-bottom: 5px;">Quantos classificam por grupo?</label>
                                <select class="input-dark"><option>Apenas o 1º Colocado</option><option selected>1º e 2º Colocados</option></select>
                            </div>
                        </div>
                    </div>

                    <div class="config-section">
                        <h4>⏱️ Regras de Jogo (Para a Súmula Digital)</h4>
                        <div class="grid-3-col">
                            <div>
                                <label style="font-family: 'Segoe UI'; font-size: 0.85rem; color: rgba(255,255,255,0.7); display:block; margin-bottom: 5px;">Tempos de Jogo</label>
                                <select class="input-dark"><option>Tempo Único</option><option selected>2 Tempos</option><option>4 Tempos (Quartos)</option></select>
                            </div>
                            <div><label style="font-family: 'Segoe UI'; font-size: 0.85rem; color: rgba(255,255,255,0.7); display:block; margin-bottom: 5px;">Duração (minutos)</label><input type="number" class="input-dark" value="15"></div>
                            <div><label style="font-family: 'Segoe UI'; font-size: 0.85rem; color: rgba(255,255,255,0.7); display:block; margin-bottom: 5px;">Lim. Faltas Coletivas</label><input type="number" class="input-dark" value="5"></div>
                        </div>
                    </div>

                    <div class="config-section" id="secao-pontuacao" style="display: none;">
                        <h4>📈 Regras de Pontuação</h4>
                        <div class="grid-3-col" style="margin-bottom: 15px;">
                            <div><label style="font-family: 'Segoe UI'; font-size: 0.85rem; color: #00ff00;">Vitória</label><input type="number" class="input-dark" value="3"></div>
                            <div><label style="font-family: 'Segoe UI'; font-size: 0.85rem; color: #ffff00;">Empate</label><input type="number" class="input-dark" value="1"></div>
                            <div><label style="font-family: 'Segoe UI'; font-size: 0.85rem; color: #ff4500;">Derrota</label><input type="number" class="input-dark" value="0"></div>
                        </div>
                    </div>

                    <div style="text-align: right; margin-top: 2rem;">
                        <button type="button" class="btn-acao" onclick="salvarConfigEspecifica()">Salvar Regras da Competição</button>
                    </div>
                </form>
            `;
            atualizarSimulador();
        }

        window.atualizarSimulador = function() {
            const formato = document.getElementById('select-formato').value;
            const inputTimes = document.getElementById('qtd-times');
            
            let times = parseInt(inputTimes.value);
            if(isNaN(times) || times < 2) times = 4; 

            const painelGrupos = document.getElementById('opcoes-grupos');
            const painelEliminatoria = document.getElementById('opcoes-eliminatoria');
            const painelPontuacao = document.getElementById('secao-pontuacao');
            const simulador = document.getElementById('simulador-render');
            
            document.getElementById('simulador-titulo').innerHTML = `💡 Diagrama do Torneio (Simulação com ${times} Times)`;

            if (formato === 'eliminatoria') {
                painelGrupos.style.display = 'none'; painelEliminatoria.style.display = 'grid'; painelPontuacao.style.display = 'none';
                
                if (times <= 4) {
                    simulador.innerHTML = `<div class="sim-chave"><b>Semifinal</b><br><br>Jogo 1<br><hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:5px 0;">Jogo 2</div><div class="sim-seta">➔</div><div class="sim-chave"><b>A Grande Final</b><br><br>Vencedor 1<br>x<br>Vencedor 2</div>`;
                } else if (times <= 8) {
                    simulador.innerHTML = `<div class="sim-chave"><b>Quartas de Final</b><br><br>4 Jogos</div><div class="sim-seta">➔</div><div class="sim-chave"><b>Semifinal</b><br><br>2 Jogos</div><div class="sim-seta">➔</div><div class="sim-chave"><b>Final</b><br><br>S1 x S2</div>`;
                } else {
                    simulador.innerHTML = `<div class="sim-chave"><b>Oitavas de Final</b><br><br>8 Jogos</div><div class="sim-seta">➔</div><div class="sim-chave"><b>Mata-Mata</b><br><br>Avançando...</div><div class="sim-seta">➔</div><div class="sim-chave"><b>Final</b></div>`;
                }
            } else if (formato === 'liga') {
                painelGrupos.style.display = 'none'; painelEliminatoria.style.display = 'none'; painelPontuacao.style.display = 'block';
                simulador.innerHTML = `
                    <div style="width: 100%;">
                        <p style="margin-bottom: 10px; color: var(--theme-primary);"><b>Todos contra Todos</b> - O Campeão será o 1º Colocado ao final de ${times - 1} rodadas.</p>
                        <table class="sim-tabela">
                            <tr><th>Pos</th><th>Time</th><th>Pts</th><th>J</th></tr>
                            <tr><td>1º</td><td>Time A (Campeão)</td><td>...</td><td>${times - 1}</td></tr>
                            <tr><td>2º</td><td>Time B</td><td>...</td><td>${times - 1}</td></tr>
                            <tr><td>...</td><td>...</td><td>...</td><td>...</td></tr>
                            <tr><td>${times}º</td><td>Último Colocado</td><td>...</td><td>${times - 1}</td></tr>
                        </table>
                    </div>
                `;
            } else if (formato === 'grupos') {
                painelGrupos.style.display = 'grid'; painelEliminatoria.style.display = 'grid'; painelPontuacao.style.display = 'block';
                let qtdGrupos = Math.ceil(times / 4);
                simulador.innerHTML = `
                    <div class="sim-chave" style="width: 40%;"><b>Fase de Grupos</b><br><br>${qtdGrupos} Grupo(s)<br>com ~4 times<br><span style="color:var(--theme-primary); font-size:0.7rem;">(Avançam os melhores)</span></div>
                    <div class="sim-seta">➔</div>
                    <div class="sim-chave" style="width: 40%;"><b>Mata-Mata Final</b><br><br>Chaveamento com os<br>classificados.</div>
                `;
            } else if (formato === 'liga_playoffs') {
                painelGrupos.style.display = 'none'; painelEliminatoria.style.display = 'grid'; painelPontuacao.style.display = 'block';
                simulador.innerHTML = `
                    <div class="sim-chave" style="width: 30%;"><b>Tabela Geral</b><br><br>${times} Times lutando<br>pelo G4 (G-Quatro)</div>
                    <div class="sim-seta">➔</div>
                    <div class="sim-chave" style="width: 30%;"><b>Semifinais</b><br><br>1º x 4º<br><hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:5px 0;">2º x 3º</div>
                    <div class="sim-seta">➔</div>
                    <div class="sim-chave" style="width: 20%;"><b>Final</b><br><br>S1 x S2</div>
                `;
            }
        };

        function voltarParaHub() {
            document.getElementById('setup-step4-form').style.display = 'none';
            document.getElementById('setup-step3-hub').style.display = 'block';
        }

        function salvarConfigEspecifica() {
            const esp = setupData.esportes.find(e => e.id === modalidadeEditandoAtual);
            if(esp) esp.configurado = true;
            localStorage.setItem('arenaSetup', JSON.stringify(setupData));
            voltarParaHub();
            atualizarHub(); 
        }

        window.toggleUserMenu = function(e) { e.stopPropagation(); const d = document.getElementById('user-dropdown'); if(d) d.style.display = d.style.display === 'none' ? 'block' : 'none'; };
        document.addEventListener('click', () => { const d = document.getElementById('user-dropdown'); if(d && d.style.display === 'block') d.style.display = 'none'; });
    </script>
</body>
</html>
