<script>
        async function validarCredenciais(event) {
            event.preventDefault();
            
            const emailDigitado = document.getElementById('email').value.trim();
            const senhaDigitada = document.getElementById('senha').value.trim();
            const btnSubmit = document.getElementById('btn-etapa1');

            btnSubmit.innerHTML = "⏳ Verificando...";
            btnSubmit.disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailDigitado, senha: senhaDigitada, codigo2fa: "" })
                });

                if (response.ok) {
                    const dados = await response.json();
                    localStorage.setItem('interclassToken', dados.token);
                    localStorage.setItem('profId', dados.hash);
                    localStorage.setItem('profHash', dados.hash); 
                    localStorage.setItem('profNome', dados.nome);
                    localStorage.setItem('profEscola', dados.escola);
                    
                    window.location.replace('/dashboard.html'); 
                } else {
                    const erroServidor = await response.text();
                    
                    if (erroServidor.includes("obrigatório para contas Master")) {
                        document.getElementById('etapa-1').style.display = 'none';
                        document.getElementById('etapa-2').style.display = 'block';
                        setTimeout(() => document.getElementById('codigo2fa').focus(), 100);
                        verificarBloqueio2FA(); // Verifica se já existe um bloqueio ativo
                    } else {
                        alert("❌ E-mail ou senha incorretos. Por favor, tente novamente.");
                    }
                }
            } catch (error) {
                console.error("Erro:", error);
                alert("⚠️ Erro de conexão com os servidores.");
            } finally {
                btnSubmit.innerHTML = "Continuar";
                btnSubmit.disabled = false;
            }
        }

        // Função para gerenciar o visual do bloqueio temporal do 2FA
        function verificarBloqueio2FA() {
            const blockTime = localStorage.getItem('block2FAUntil');
            const btnSubmit = document.getElementById('btn-etapa2');
            
            if (blockTime && Date.now() < parseInt(blockTime)) {
                btnSubmit.disabled = true;
                
                const timer = setInterval(() => {
                    const faltamSegundos = Math.ceil((parseInt(blockTime) - Date.now()) / 1000);
                    
                    if (faltamSegundos <= 0) {
                        clearInterval(timer);
                        localStorage.removeItem('block2FAUntil');
                        localStorage.setItem('tentativas2FA', '0');
                        btnSubmit.disabled = false;
                        btnSubmit.innerHTML = "Autenticar e Entrar";
                    } else {
                        const min = Math.floor(faltamSegundos / 60);
                        const seg = faltamSegundos % 60;
                        btnSubmit.innerHTML = `Bloqueado (${min}m ${seg}s)`;
                    }
                }, 1000);
                
                return true; 
            }
            return false; 
        }

        async function enviarLoginCompleto(event) {
            event.preventDefault();
            
            if (verificarBloqueio2FA()) return; // Impede execução se estiver bloqueado

            const emailDigitado = document.getElementById('email').value.trim();
            const senhaDigitada = document.getElementById('senha').value.trim();
            const codigo = document.getElementById('codigo2fa').value.trim();
            const btnSubmit = document.getElementById('btn-etapa2');

            if (codigo.length !== 6) {
                alert("O código precisa ter exatamente 6 dígitos.");
                return;
            }

            btnSubmit.innerHTML = "⏳ Autenticando...";
            btnSubmit.disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailDigitado, senha: senhaDigitada, codigo2fa: codigo })
                });

                if (response.ok) {
                    // Sucesso: Limpa contadores de erro
                    localStorage.removeItem('tentativas2FA');
                    localStorage.removeItem('block2FAUntil');
                    
                    const dados = await response.json();
                    localStorage.setItem('interclassToken', dados.token);
                    localStorage.setItem('profId', dados.hash);
                    localStorage.setItem('profHash', dados.hash);
                    localStorage.setItem('profNome', dados.nome);
                    localStorage.setItem('profEscola', dados.escola);
                    
                    window.location.replace('/admin.html'); 
                } else {
                    // Falha: Incrementa tentativas
                    let tentativas = parseInt(localStorage.getItem('tentativas2FA') || '0') + 1;
                    
                    if (tentativas >= 5) {
                        const cincoMinutos = 5 * 60 * 1000;
                        localStorage.setItem('block2FAUntil', Date.now() + cincoMinutos);
                        alert("🚨 Segurança Master: Limite de tentativas excedido. Acesso bloqueado por 5 minutos.");
                        verificarBloqueio2FA();
                    } else {
                        localStorage.setItem('tentativas2FA', tentativas);
                        alert(`🔒 Acesso Negado: Código 2FA inválido. (Tentativa ${tentativas} de 5)`);
                    }
                    
                    document.getElementById('codigo2fa').value = ""; 
                    if(tentativas < 5) document.getElementById('codigo2fa').focus();
                }
            } catch (error) {
                console.error("Erro:", error);
                alert("⚠️ Erro de conexão.");
            } finally {
                // Só restaura o botão se não houver um bloqueio ativo
                if (!localStorage.getItem('block2FAUntil')) {
                    btnSubmit.innerHTML = "Autenticar e Entrar";
                    btnSubmit.disabled = false;
                }
            }
        }

        function voltarParaEtapa1() {
            document.getElementById('etapa-2').style.display = 'none';
            document.getElementById('etapa-1').style.display = 'block';
            document.getElementById('codigo2fa').value = ""; 
        }

        function recuperarSenha(event) {
            event.preventDefault(); 
            
            alert("🔒 Por motivos de segurança, a redefinição de senha é realizada através da nossa central de atendimento.\n\nClique em OK para falar com nossa equipe no WhatsApp.");
            
            const numeroWhatsApp = "5588996312358"; 
            const mensagem = "Olá, esqueci minha senha no interclasseApp e preciso de ajuda para recuperar meu acesso.";
            const linkWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;
            
            window.open(linkWhatsApp, "_blank");
        }
    </script>
