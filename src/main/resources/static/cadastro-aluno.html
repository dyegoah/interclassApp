<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - InterclassApp</title>
	<link rel="manifest" href="/manifest.json">
	<meta name="theme-color" content="#05050f">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<link rel="apple-touch-icon" href="/img/icon-192x192.png">
    <style>

        :root { --theme-primary: #ff00de; --theme-glow: rgba(255, 0, 222, 0.5); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        body { 
            background-color: #05050f;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 242, 254, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            animation: moveGrid 20s linear infinite;
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 2rem; 
        }

        @keyframes moveGrid {
            0% { background-position: center center, 0 0, 0 0; }
            100% { background-position: center center, 40px 40px, 40px 40px; }
        }
        
        .glass-form { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 500px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border-top: 4px solid var(--theme-primary); }
        
        h1 { font-family: 'Orbitron', sans-serif; color: var(--theme-primary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; text-shadow: 0 0 15px var(--theme-glow); text-align: center;}
        p.subtitle { color: rgba(255,255,255,0.6); margin-bottom: 25px; font-size: 0.95rem; text-align: center; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 1px; font-weight: bold;}
        .form-group input, .form-group select { width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: white; outline: none; transition: 0.3s; font-size: 1rem; }
        .form-group input:focus, .form-group select:focus { border-color: var(--theme-primary); box-shadow: 0 0 15px var(--theme-glow); }
        .form-group option { background: #05050f; color: white; }

        .btn-submit { width: 100%; padding: 15px; background: linear-gradient(90deg, #ff00de, #b200ff); border: none; border-radius: 30px; color: #fff; font-weight: bold; font-family: 'Orbitron', sans-serif; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; margin-top: 15px; transition: 0.3s; box-shadow: 0 0 15px var(--theme-glow); }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 0 25px rgba(255, 0, 222, 0.8); }
        
        .char-counter { font-size: 0.75rem; color: #888; float: right; margin-top: 5px; }
        .alert { padding: 15px; margin-bottom: 20px; border: 1px solid transparent; border-radius: 8px; font-size: 0.9rem; text-align: center; display: none; font-weight: bold; font-family: 'Segoe UI'; }
        .alert-danger { color: #ffccdd; background-color: rgba(255, 0, 85, 0.1); border-color: #ff0055; box-shadow: 0 0 15px rgba(255,0,85,0.3); }
        .alert-success { color: #ccffcc; background-color: rgba(0, 255, 0, 0.1); border-color: #00ff00; box-shadow: 0 0 15px rgba(0,255,0,0.3); }
        .d-block { display: block !important; }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    </style>
</head>
<body>

    <div class="glass-form">
        <h1>Inscrição de Atleta</h1>
        <p class="subtitle">Preencha os seus dados para participar dos torneios e súmulas.</p>

        <div id="mensagem-alerta" class="alert"></div>

        <form id="form-cadastro" onsubmit="inscreverAluno(event)">
            <div class="form-group">
                <label>Nome Completo do Aluno</label>
                <input type="text" id="nomeAluno" required minlength="3" maxlength="50" placeholder="Ex: João da Silva">
                <div class="char-counter">Máx. 50 caracteres</div>
            </div>

            <div class="form-group">
                <label>Turma / Ano / Classe</label>
                <input type="text" id="turmaAluno" required minlength="2" maxlength="30" placeholder="Ex: 3º Ano A">
            </div>

            <button type="submit" class="btn-submit">Confirmar Inscrição</button>
        </form>
    </div>

    <script>
        function mostrarAlerta(mensagem, tipo) {
            const alerta = document.getElementById('mensagem-alerta');
            alerta.textContent = mensagem;
            alerta.className = `alert alert-${tipo} d-block`;
            alerta.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        async function inscreverAluno(event) {
            event.preventDefault();
            
            const nome = document.getElementById('nomeAluno').value.trim();
            const turma = document.getElementById('turmaAluno').value.trim();
            
            // 🔥 RECUPERA O HASH PÚBLICO DA URL EM VEZ DO ID NUMÉRICO 🔥
            const urlParams = new URLSearchParams(window.location.search);
            const professorHashPublico = urlParams.get('ref');

            if (!professorHashPublico) {
                mostrarAlerta("❌ Link de inscrição inválido. Solicite um novo link ao seu professor.", "danger");
                return;
            }

            const btnSubmit = document.querySelector('.btn-submit');
            const textoOriginal = btnSubmit.innerHTML;
            btnSubmit.innerHTML = "⏳ Enviando...";
            btnSubmit.disabled = true;
            document.getElementById('mensagem-alerta').className = 'alert';

            try {
                // Manda a requisição para a rota blindada usando a STRING hashPublico
                const response = await fetch(`/api/alunos/public/${professorHashPublico}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome: nome, turma: turma })
                });

                if (response.ok) {
                    mostrarAlerta("✅ Inscrição realizada com sucesso! Você já pode fechar esta página.", "success");
                    document.getElementById('form-cadastro').reset();
                    btnSubmit.innerHTML = "Inscrito! ✔️";
                } else {
                    const msgErro = await response.text();
                    mostrarAlerta("❌ Falha na inscrição: " + msgErro, "danger");
                    btnSubmit.innerHTML = textoOriginal;
                    btnSubmit.disabled = false;
                }
            } catch (error) {
                console.error("Erro de comunicação:", error);
                mostrarAlerta("⚠️ Servidor indisponível no momento. Tente novamente mais tarde.", "danger");
                btnSubmit.innerHTML = textoOriginal;
                btnSubmit.disabled = false;
            }
        }
    </script>
</body>
</html>
