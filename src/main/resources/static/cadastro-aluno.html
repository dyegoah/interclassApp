<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Atleta - InterclassApp</title>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: linear-gradient(-45deg, #020111, #191970, #000000, #4b0082); background-size: 400% 400%; animation: gradientBG 10s ease infinite; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 2rem; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .glass-form { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 500px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border-top: 4px solid #00f2fe; }
        h2 { font-family: 'Orbitron'; text-align: center; color: #00f2fe; margin-bottom: 0.5rem; text-transform: uppercase; }
        .subtitle { text-align: center; font-size: 0.9rem; opacity: 0.8; margin-bottom: 2rem; }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: rgba(255,255,255,0.8); }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group select:focus { border-color: #00f2fe; box-shadow: 0 0 10px rgba(0, 242, 254, 0.3); }
        
        .form-group select optgroup { background: #191970; color: #00f2fe; font-family: 'Orbitron'; }
        .form-group select option { background: #020111; color: white; font-family: 'Segoe UI'; }

        /* Input de Arquivo Customizado */
        input[type="file"]::file-selector-button { background: #ff00de; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-right: 15px; font-family: 'Orbitron'; transition: 0.3s; }
        input[type="file"]::file-selector-button:hover { background: #d000b5; box-shadow: 0 0 10px #ff00de; }

        .btn-submit { width: 100%; padding: 15px; background: linear-gradient(45deg, #00f2fe, #4facfe); border: none; border-radius: 30px; color: white; font-weight: bold; font-family: 'Orbitron'; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; margin-top: 1rem; transition: 0.3s; }
        .btn-submit:hover { box-shadow: 0 0 20px rgba(0, 242, 254, 0.6); transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="glass-form">
        <h2>Draft da Arena</h2>
        <p class="subtitle">Inscreva-se para representar a sua turma.</p>

        <form id="form-cadastro-aluno">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" required placeholder="Digite o seu nome completo">
            </div>

            <div class="form-group" style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>Data de Nascimento</label>
                    <input type="date" id="dataNascimento" required>
                </div>
                <div style="flex: 1;">
                    <label>Turma</label>
                    <select id="turma" required>
                        </select>
                </div>
            </div>

            <div class="form-group" style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>Categoria (Gênero)</label>
                    <select id="genero" required>
                        <option value="">Selecione...</option>
                        <option value="masculino">🚹 Masculino</option>
                        <option value="feminino">🚺 Feminino</option>
						<option value="misto">🚺🚹 Misto</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label>Modalidade (Esporte)</label>
					<select id="modalidade" required>
					    <option value="" data-icone="">Selecione...</option>
					    <option value="Futsal" data-icone="⚽">⚽ Futsal</option>
					    <option value="Vôlei" data-icone="🏐">🏐 Vôlei</option>
					    <option value="Basquete" data-icone="🏀">🏀 Basquete</option>
					    <option value="Handebol" data-icone="🤾">🤾 Handebol</option>
					    <option value="Queimada" data-icone="☄️">☄️ Queimada</option>
					    <option value="Vôlei de Areia" data-icone="🏖️">🏖️ Vôlei de Areia</option>
					    <option value="Natação" data-icone="🏊">🏊 Natação</option>
					    <option value="Atletismo" data-icone="🏃">🏃 Atletismo</option>
					    <option value="Tênis de Mesa" data-icone="🏓">🏓 Tênis de Mesa</option>
					    <option value="Xadrez" data-icone="♟️">♟️ Xadrez</option>
					    <option value="Dama" data-icone="🏁">🏁 Dama</option>
					    <option value="E-Sports" data-icone="🎮">🎮 E-Sports</option>
					</select>
                </div>
            </div>

            <div class="form-group">
                <label>Foto do Atleta (Opcional - Para a Súmula)</label>
                <div style="display: flex; align-items: center; gap: 15px;">
                    <img id="preview-foto" src="https://ui-avatars.com/api/?name=Atleta&background=222&color=fff" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #00f2fe;">
                    <div>
                        <input type="file" id="fotoAluno" accept="image/*" onchange="processarImagem(event)">
                    </div>
                </div>
            </div>

            <button type="button" class="btn-submit" onclick="enviarCadastro()">Enviar Inscrição</button>
        </form>
    </div>

    <script>
        // Variável global para guardar a foto codificada
        let fotoBase64 = null;

        window.onload = () => {
            gerarMenuDeTurmas();
			
        };

        // GERA AS TURMAS PADRÃO DO BRASIL AUTOMATICAMENTE
        function gerarMenuDeTurmas() {
            const select = document.getElementById('turma');
            const turmas = [
                { grupo: "Ensino Fundamental I", series: ["1º Ano", "2º Ano", "3º Ano", "4º Ano", "5º Ano"], letras: ["A", "B", "C"] },
                { grupo: "Ensino Fundamental II", series: ["6º Ano", "7º Ano", "8º Ano", "9º Ano"], letras: ["A", "B", "C", "D"] },
                { grupo: "Ensino Médio", series: ["1ª Série", "2ª Série", "3ª Série"], letras: ["A", "B", "C", "D", "E"] }
            ];

            let html = '<option value="">Selecione sua turma...</option>';
            turmas.forEach(t => {
                html += `<optgroup label="${t.grupo}">`;
                t.series.forEach(serie => {
                    t.letras.forEach(letra => {
                        html += `<option value="${serie} ${letra}">${serie} ${letra}</option>`;
                    });
                });
                html += `</optgroup>`;
            });
            select.innerHTML = html;
        }

		// BUSCA AS MODALIDADES ATIVAS NO BANCO DE DADOS
		async function carregarModalidadesDoBanco() {
		    const selectMod = document.getElementById('modalidade');
		    try {
		        const response = await fetch('/api/modalidades');
		        if (response.ok) {
		            const modalidades = await response.json();
		            
		            if (modalidades.length === 0) {
		                selectMod.innerHTML = '<option value="">Nenhum torneio ativo ainda!</option>';
		                selectMod.disabled = true;
		                return;
		            }

		            let html = '<option value="">Selecione...</option>';
		            modalidades.forEach(mod => {
		                // Aqui usamos o ID real que o banco gerou, seja ele 1, 10 ou 54!
		                html += `<option value="${mod.id}">${mod.icone} ${mod.nomeEsporte}</option>`;
		            });
		            
		            selectMod.innerHTML = html;
		            selectMod.disabled = false;
		        }
		    } catch (error) {
		        console.error("Erro ao buscar modalidades:", error);
		        selectMod.innerHTML = '<option value="">Erro ao conectar no servidor</option>';
		    }
		}
		
		
        // LÊ A FOTO DO CELULAR/PC E MOSTRA NA BOLINHA
        function processarImagem(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    fotoBase64 = e.target.result; // Converte a imagem em texto (Base64)
                    document.getElementById('preview-foto').src = fotoBase64;
                }
                reader.readAsDataURL(file);
            } else {
                fotoBase64 = null;
                document.getElementById('preview-foto').src = "https://ui-avatars.com/api/?name=Atleta&background=222&color=fff";
            }
        }

		async function enviarCadastro() {
		    const nome = document.getElementById('nome').value;
		    const dataNasc = document.getElementById('dataNascimento').value;
		    const turmaSelect = document.getElementById('turma');
		    const generoSelect = document.getElementById('genero');
		    const selectMod = document.getElementById('modalidade');

		    if(!nome) { alert("Digite o seu nome."); return; }
		    if(!dataNasc) { alert("Informe a data de nascimento."); return; }
		    if(turmaSelect.value === "") { alert("Selecione a sua turma!"); return; }
		    if(generoSelect.value === "") { alert("Selecione a sua categoria/gênero!"); return; }
		    if(selectMod.value === "") { alert("Selecione um esporte!"); return; }

		    let fotoFinal = fotoBase64;
		    if (!fotoFinal) {
		        fotoFinal = `https://ui-avatars.com/api/?name=${encodeURIComponent(nome)}&background=random&color=fff`;
		    }

		    // CAPTURANDO O NOME DO ESPORTE E O ÍCONE DA OPÇÃO SELECIONADA
		    const optionSelecionada = selectMod.options[selectMod.selectedIndex];
		    const nomeEsporte = optionSelecionada.value;
		    const iconeEsporte = optionSelecionada.getAttribute('data-icone');

		    // JSON formatado para a sua classe Aluno.java
		    const novoAluno = {
		        nome: nome,
		        turma: turmaSelect.value,
		        dataNascimento: dataNasc,
		        fotoUrl: fotoFinal,
		        genero: generoSelect.value,
		        esporte: nomeEsporte,
		        iconeEsporte: iconeEsporte
		    };

		    try {
		        const response = await fetch('/api/alunos', {
		            method: 'POST',
		            headers: { 'Content-Type': 'application/json' },
		            body: JSON.stringify(novoAluno)
		        });

		        if(response.ok) {
		            alert("Inscrição gravada com sucesso no Banco de Dados!");
		            document.getElementById('form-cadastro-aluno').reset();
		            fotoBase64 = null;
		            document.getElementById('preview-foto').src = "https://ui-avatars.com/api/?name=Atleta&background=222&color=fff";
		        } else {
		            alert("⚠️ Erro ao salvar no Servidor. Verifique os dados.");
		        }
		    } catch (error) {
		        console.error(error);
		        alert("🚨 Falha de comunicação com o servidor.");
		    }
		}
    </script>
</body>
</html>
