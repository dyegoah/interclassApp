<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Interclass Arena</title>
	<link rel="manifest" href="/manifest.json">
	<meta name="theme-color" content="#05050f">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<link rel="apple-touch-icon" href="/img/icon-192x192.png">
	
    <style>
        :root { --theme-primary: #00f2fe; --theme-glow: rgba(0, 242, 254, 0.5); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        body { 
            background-color: #05050f; 
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 242, 254, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(0, 242, 254, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.06) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            animation: moveGrid 20s linear infinite;
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 2rem; 
        }

        @keyframes moveGrid {
            0% { background-position: center center, 0 0, 0 0; }
            100% { background-position: center center, 40px 40px, 40px 40px; }
        }
        
        .glass-form { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 3rem; width: 100%; max-width: 450px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border-top: 4px solid var(--theme-primary); text-align: center; }
        
        h1 { font-family: 'Orbitron', sans-serif; color: var(--theme-primary); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 15px var(--theme-glow); }
        p.subtitle { color: rgba(255,255,255,0.6); margin-bottom: 30px; font-size: 0.95rem; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 1px; font-weight: bold;}
        .form-group input { width: 100%; padding: 15px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: white; outline: none; transition: 0.3s; font-size: 1rem; }
        .form-group input:focus { border-color: var(--theme-primary); box-shadow: 0 0 15px var(--theme-glow); }

        .btn-submit { width: 100%; padding: 15px; background: linear-gradient(90deg, #00f2fe, #4facfe); border: none; border-radius: 30px; color: #000; font-weight: bold; font-family: 'Orbitron', sans-serif; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: 0.3s; box-shadow: 0 0 15px var(--theme-glow); }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 0 25px rgba(0, 242, 254, 0.8); background: #fff; }

        .links-rodape { margin-top: 25px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 10px; }
        .links-rodape a { color: var(--theme-primary); text-decoration: none; transition: 0.3s; }
        .links-rodape a:hover { text-shadow: 0 0 10px var(--theme-glow); text-decoration: underline; }
        
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    </style>
</head>
<body>

    <div class="glass-form">
        <h1>Interclass Arena</h1>
        <p class="subtitle">Acesse o seu painel de gestão esportiva.</p>

        <form id="form-login" onsubmit="fazerLogin(event)">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Entrar na Arena</button>
        </form>

        <div class="links-rodape">
            <a href="#">Esqueceu a sua senha?</a>
            <span style="color: rgba(255,255,255,0.5);">Ainda não tem conta? <a href="/cadastro-professor.html" style="font-weight: bold; color: #ff00de;">Cadastre-se aqui</a></span>
        </div>
    </div>

    <script>
		async function fazerLogin(event) {
		    if(event) event.preventDefault(); // Evita recarregar a página se estiver num form

		    const email = document.getElementById('email').value;
		    const senha = document.getElementById('senha').value;
		    const btn = document.querySelector('button');

		    if(!email || !senha) {
		        alert("Preencha todos os campos!");
		        return;
		    }

		    btn.innerText = "Aguarde...";
		    btn.disabled = true;

		    try {
		        // 🔥 A MÁGICA AQUI: Usando rota relativa sem o "localhost"
		        const response = await fetch('/api/auth/login', {
		            method: 'POST',
		            headers: {
		                'Content-Type': 'application/json'
		            },
		            body: JSON.stringify({ email: email, senha: senha })
		        });

		        if (response.ok) {
		            const data = await response.json();
		            
		            // Salva o Crachá (Token) no navegador
		            localStorage.setItem('interclassToken', data.token);
		            
		            // Vai para o painel de controle
		            window.location.href = '/admin.html';
		        } else {
		            alert("❌ E-mail ou Senha incorretos! Você é mesmo o Master?");
		            btn.innerText = "ENTRAR";
		            btn.disabled = false;
		        }
		    } catch (error) {
		        console.error(error);
		        alert("🚨 Servidor indisponível no momento. Verifique a sua conexão.");
		        btn.innerText = "ENTRAR";
		        btn.disabled = false;
		    }
		}
    </script>
</body>
</html>
