<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Súmula Futsal - InterclassApp</title>
    
    <!-- INJEÇÃO DO CSS E JS GLOBAIS DE ALTA PERFORMANCE -->
    <link rel="stylesheet" href="/estilo-global.css">
    <script src="/seguranca.js"></script>

	<link rel="manifest" href="/manifest.json">
	<meta name="theme-color" content="#05050f">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<link rel="apple-touch-icon" href="/img/icon-192x192.png">
	
    <style>
        /* CSS EXCLUSIVO DA SÚMULA DE FUTSAL */
        :root { --theme-primary: #00f2fe; --team-a: #00f2fe; --team-b: #ff00de; }
        
        body { background: #020111 !important; overflow-x: hidden; }
        .arena-container { padding: 1.5rem; } /* Ajuste fino de borda da súmula */
        
        .futsal-header { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); padding: 15px 20px; border-radius: 15px; border-bottom: 2px solid #00f2fe;}
        .btn-voltar { background: transparent; border: 1px solid #fff; color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Segoe UI'; font-weight: bold;}
        
        .crono-box { text-align: center; }
        .crono-periodo { color: #aaa; font-family: 'Segoe UI'; font-size: 0.9rem; text-transform: uppercase; font-weight: bold; cursor: pointer;}
        .crono-display { font-size: 3rem; font-weight: bold; letter-spacing: 2px; color: #00f2fe; text-shadow: 0 0 10px rgba(0,242,254,0.5); line-height: 1;}
        .crono-controls button { background: transparent; border: 1px solid #aaa; color: #fff; border-radius: 5px; padding: 5px 10px; cursor: pointer; margin: 0 3px;}
        
        .btn-finalizar { background: #00ff00; color: #000; font-weight: bold; font-family: 'Orbitron'; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer;}

        .placar-board { display: flex; justify-content: space-around; align-items: center; margin: 20px 0; background: rgba(0,0,0,0.5); border-radius: 15px; padding: 15px;}
        .team-col { text-align: center; flex: 1; }
        .team-name { font-size: 1.2rem; font-weight: bold; color: #fff; font-family: 'Segoe UI'; text-transform: uppercase;}
        .team-score { font-size: 5rem; font-weight: bold; line-height: 1; }
        .score-a { color: var(--team-a); } .score-b { color: var(--team-b); }
        
        .faltas-coletivas { font-family: 'Segoe UI'; font-size: 0.9rem; margin-top: 10px; padding: 5px; background: rgba(255,255,255,0.05); border-radius: 8px;}
        .faltas-dots span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #333; margin: 0 2px; }
        .faltas-dots span.active { background: #ffea00; box-shadow: 0 0 5px #ffea00; }
        .faltas-dots.estourado span.active { background: #ff0000; box-shadow: 0 0 8px #ff0000; }

        /* 🔥 LAYOUT ARENA COLETIVA (LINHA DO TEMPO NO MEIO) 🔥 */
        .arena-prancheta { display: flex; width: 100%; margin: 25px auto; gap: 20px; align-items: flex-start; justify-content: center; }
        @media (max-width: 900px) { .arena-prancheta { flex-direction: column; } }

        .coluna-time { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 280px; width: 100%; background: rgba(255,255,255,0.02); border-radius: 12px; padding: 15px; border-top: 3px solid transparent; }
        .coluna-time.a { border-top-color: var(--team-a); }
        .coluna-time.b { border-top-color: var(--team-b); }
        
        .player-row { display: flex; align-items: center; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.2s;}
        .player-row:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); transform: scale(1.02);}
        .player-row.readonly { cursor: default; }
        .player-row.readonly:hover { transform: none; background: rgba(0,0,0,0.4); border-color: transparent;}
        
        .player-photo { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; margin-right: 10px; border: 2px solid #555;}
        .player-num { font-size: 1.2rem; font-weight: bold; color: #fff; width: 30px; }
        .player-info { flex-grow: 1; }
        .player-name { font-family: 'Segoe UI'; font-weight: bold; font-size: 1rem; color: #fff; }
        
        .player-stats { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
        .stat-pill { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 12px; font-family: 'Segoe UI'; font-size: 0.85rem; color: white; display: flex; align-items: center; gap: 4px; }
        .stat-pill b { font-family: 'Orbitron'; color: var(--theme-primary); font-size: 0.9rem;}

        .timeline-container { flex: 1.2; min-width: 300px; width: 100%; background: rgba(0,0,0,0.6); border-radius: 15px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; min-height: 250px; }
        .timeline-titulo { font-size: 1rem; color: var(--theme-primary); margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Orbitron';}
        .timeline-list { display: flex; flex-direction: column; gap: 10px; flex-grow: 1; overflow-y: auto; max-height: 450px; padding-right: 5px;}
        .timeline-item { display: flex; align-items: center; gap: 12px; font-family: 'Segoe UI'; font-size: 0.85rem; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px; border-left: 3px solid #555;}
        .timeline-item.evt-a { border-left-color: var(--team-a); }
        .timeline-item.evt-b { border-left-color: var(--team-b); }
        .time-stamp { color: #00ff00; font-family: 'Orbitron'; font-weight: bold; width: 55px; font-size: 0.95rem; flex-shrink: 0;}

        /* Modal da Súmula (diferente do Global por causa dos botões internos) */
        .modal-box-sumula { background: #111; border: 1px solid var(--theme-primary); border-radius: 15px; padding: 2rem; width: 90%; max-width: 400px; text-align: center; }
        .modal-box-sumula img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--theme-primary); margin-bottom: 10px; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .action-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; color: #000; font-family: 'Segoe UI'; font-size: 0.95rem;}
        .btn-gol { background: #fff; }
        .btn-amarelo { background: #ffea00; }
        .btn-vermelho { background: #ff0000; color: #fff;}
        .btn-falta { background: #ff8c00; color: #fff;}
        .btn-contra { background: #555; color: #fff;}
    </style>
</head>
<body>
    <div class="arena-container">
        
        <div class="futsal-header">
            <button class="btn-voltar" onclick="window.location.href='/tabelas.html'">🡨 Voltar PlayHub</button>
            
            <div class="crono-box" id="crono-area">
                <div class="crono-periodo" id="periodo-lbl" onclick="trocarPeriodo()">1º TEMPO (Trocar)</div>
                <div class="crono-display" id="crono-display">00:00</div>
                <div class="crono-controls">
                    <button id="btn-start" onclick="toggleCrono()">▶ Play</button>
                    <button onclick="resetCrono()">Reset</button>
                </div>
            </div>

            <button class="btn-finalizar" id="btn-finalizar" onclick="finalizarFutsal()">Finalizar ✓</button>
        </div>

        <div style="text-align: center; margin-top: 10px; font-family: 'Segoe UI'; color: #aaa; font-size: 0.85rem;" id="match-info">Carregando Jogo...</div>

        <div class="placar-board">
            <div class="team-col">
                <div class="team-name" id="nome-time-a">Equipe A</div>
                <div class="team-score score-a" id="score-a">0</div>
                <div class="faltas-coletivas">
                    Faltas Coletivas: <span id="faltas-text-a">0/5</span>
                    <div class="faltas-dots" id="dots-a">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </div>
            </div>
            
            <div style="font-size: 2rem; font-weight: bold; color: rgba(255,255,255,0.2);">X</div>
            
            <div class="team-col">
                <div class="team-name" id="nome-time-b">Equipe B</div>
                <div class="team-score score-b" id="score-b">0</div>
                <div class="faltas-coletivas">
                    Faltas Coletivas: <span id="faltas-text-b">0/5</span>
                    <div class="faltas-dots" id="dots-b">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 🔥 LINHA DO TEMPO CENTRALIZADA 🔥 -->
        <div class="arena-prancheta">
            <div class="coluna-time a" id="lista-a"></div>
            
            <div class="timeline-container">
                <div class="timeline-titulo">⏱️ Relatório da Partida</div>
                <div class="timeline-list" id="timeline-lista">
                    <div class="timeline-item" style="color: #aaa; justify-content: center;">A partida ainda não começou.</div>
                </div>
            </div>
            
            <div class="coluna-time b" id="lista-b"></div>
        </div>

    </div>

    <!-- Puxando a classe .modal-overlay do estilo global -->
    <div id="modal-acao" class="modal-overlay">
        <div class="modal-box-sumula">
            <img id="acao-foto" src="">
            <h3 id="acao-nome" style="color: white; font-family: 'Segoe UI';">Nome</h3>
            <p id="acao-num" style="color: var(--theme-primary); font-family: 'Orbitron'; font-weight: bold; margin-bottom: 15px;">Camisa 10</p>
            
            <div class="action-grid" id="action-grid-buttons">
                <button class="action-btn btn-gol" onclick="registrar('Gol', '⚽', 1)">⚽ Marcar Gol</button>
                <button class="action-btn btn-falta" onclick="registrarFalta()">🛑 Falta Coletiva</button>
                <button class="action-btn btn-amarelo" onclick="registrar('Cartão Amarelo', '🟨', 0)">🟨 Amarelo</button>
                <button class="action-btn btn-vermelho" onclick="registrar('Cartão Vermelho', '🟥', 0)">🟥 Vermelho</button>
                <button class="action-btn btn-contra" onclick="registrar('Gol Contra', '🤦‍♂️', -1)">⚽ Gol Contra</button>
                <button class="action-btn btn-contra" style="background: transparent; border: 1px solid #555;" onclick="fecharModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idJogo = parseInt(urlParams.get('jogo'));
        const lote = urlParams.get('lote') || 'masculino';
        const isReadOnly = urlParams.get('read') === 'true';

        let matchAtiva = null;
        let placar = { A: 0, B: 0 };
        let faltas = { A: 0, B: 0 };
        let escalacao = { A: [], B: [] };
        let timeline = [];
        let listaAlunosGlobais = [];
        
        let jogadorAcao = null; let timeAcao = null;
        let cronoInt = null; let secs = 0; let rodando = false; let periodo = "1º Tempo";
        let periodoIndex = 1;

        window.onload = async () => {
            const token = localStorage.getItem('interclassToken');

            try {
                let resAlunos = await fetch('/api/alunos', { headers: { 'Authorization': `Bearer ${token}` } });
                if (resAlunos.ok) {
                    listaAlunosGlobais = await resAlunos.json();
                }
            } catch (error) { console.warn("Erro ao buscar alunos."); }

            try {
                let res = await fetch(`/api/jogos/lote/${lote}`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    let jogosLote = await res.json();
                    matchAtiva = jogosLote.find(j => j.id === idJogo);
                }
            } catch(e) { console.warn("Súmula em Modo Offline."); }

            if (!matchAtiva) {
                const calOficial = JSON.parse(localStorage.getItem('calendariosOficiais')) || {};
                if(calOficial[lote]) matchAtiva = calOficial[lote].jogos.find(j => j.id === idJogo);
            }

            if(!matchAtiva) matchAtiva = { id: idJogo, esporte: 'Futsal', titulo: 'Partida', quadra: 'Quadra', icone: '⚽' };

            let nomeEsporte = matchAtiva.esporte || (matchAtiva.modalidade ? matchAtiva.modalidade.nomeEsporte : "Futsal");
            let iconeEsporte = matchAtiva.icone || (matchAtiva.modalidade ? matchAtiva.modalidade.icone : "⚽");

            document.getElementById('match-info').innerHTML = `${iconeEsporte} <b>${nomeEsporte}</b> - ${matchAtiva.titulo} | ${matchAtiva.quadra}`;
            document.getElementById('nome-time-a').innerText = matchAtiva.equipeANome || "Equipe A";
            document.getElementById('nome-time-b').innerText = matchAtiva.equipeBNome || "Equipe B";

            if(isReadOnly) {
                let relatorios = JSON.parse(localStorage.getItem('relatoriosPartidas')) || {};
                let rel = relatorios[idJogo] || { placar:{A:0,B:0}, faltas:{A:0,B:0}, escalacao:{A:[],B:[]}, timeline:[] };
                placar = rel.placar || {A:0,B:0};
                faltas = rel.faltas || {A:0,B:0};
                escalacao = rel.escalacao || {A:[],B:[]};
                timeline = rel.timeline || [];
                
                document.getElementById('crono-area').style.display = 'none';
                document.getElementById('btn-finalizar').style.display = 'none';
            } else {
                if (matchAtiva.escalacoes && matchAtiva.escalacoes.length > 0) {
                    matchAtiva.escalacoes.forEach(esc => {
                        let nome = esc.aluno ? esc.aluno.nome : (esc.nomeAluno || "Atleta");
                        let eq = esc.equipe;
                        let num = esc.numeroCamisa || '-';
                        let id = esc.aluno ? esc.aluno.id : (esc.alunoId || ('esc_' + Math.random()));
                        let corEq = eq === 'A' ? '00f2fe' : 'ff00de';
                        let fotoUrl = (esc.aluno && esc.aluno.fotoUrl) ? esc.aluno.fotoUrl : (esc.fotoUrl || '');
                        if(!fotoUrl) fotoUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(nome)}&background=222&color=${corEq}&bold=true`;
                        escalacao[eq].push({ id: id, numero: num, nome: nome, foto: fotoUrl, stats: [] });
                    });
                } else {
                    let sportName = nomeEsporte.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                    let rawA = (matchAtiva.equipeANome || "Equipe A").split(' (')[0].trim();
                    let rawB = (matchAtiva.equipeBNome || "Equipe B").split(' (')[0].trim();

                    let alunosA = listaAlunosGlobais.filter(a => a.turma === rawA && (a.esporte || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() === sportName && a.genero === lote);
                    let alunosB = listaAlunosGlobais.filter(a => a.turma === rawB && (a.esporte || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() === sportName && a.genero === lote);

                    if(alunosA.length > 0) {
                        alunosA.forEach((a, i) => {
                            let fotoUrl = a.fotoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(a.nome)}&background=222&color=00f2fe&bold=true`;
                            escalacao.A.push({ id: a.id, numero: i+1, nome: a.nome, foto: fotoUrl, stats: [] });
                        });
                    } else {
                        escalarMockEquipe('A', rawA, '00f2fe', 1);
                    }

                    if(alunosB.length > 0) {
                        alunosB.forEach((a, i) => {
                            let fotoUrl = a.fotoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(a.nome)}&background=222&color=ff00de&bold=true`;
                            escalacao.B.push({ id: a.id, numero: i+1, nome: a.nome, foto: fotoUrl, stats: [] });
                        });
                    } else {
                        escalarMockEquipe('B', rawB, 'ff00de', 10);
                    }
                }
            }

            atualizarTela();
            renderTimeline();
        };

        function escalarMockEquipe(eq, nomeTurma, cor, startNum) {
            for(let i=0; i<5; i++) {
                escalacao[eq].push({ 
                    id: eq + i, 
                    numero: startNum + i, 
                    nome: `Atleta ${i+1} (${nomeTurma})`, 
                    foto: `https://ui-avatars.com/api/?name=A+${i+1}&background=222&color=${cor}&bold=true`, 
                    stats: [] 
                });
            }
        }

        function atualizarTela() {
            document.getElementById('score-a').textContent = placar.A;
            document.getElementById('score-b').textContent = placar.B;

            const renderFaltas = (t) => {
                let f = faltas[t];
                document.getElementById(`faltas-text-${t.toLowerCase()}`).textContent = `${f}/5`;
                let dotsContainer = document.getElementById(`dots-${t.toLowerCase()}`);
                let dots = '';
                for(let i=0; i<5; i++) dots += `<span class="${i < f ? 'active' : ''}"></span>`;
                dotsContainer.innerHTML = dots;
                dotsContainer.className = f >= 5 ? 'faltas-dots estourado' : 'faltas-dots';
            };
            renderFaltas('A'); renderFaltas('B');

            const renderTime = (t, domId) => {
                let html = '';
                escalacao[t].forEach(j => {
                    let contagemStats = {}; let tomouVermelho = false;
                    if(!j.stats) j.stats = [];
                    j.stats.forEach(icone => {
                        contagemStats[icone] = (contagemStats[icone] || 0) + 1;
                        if(icone === '🟥') tomouVermelho = true;
                    });
                    
                    let statsHtml = '';
                    for(let icone in contagemStats) statsHtml += `<span class="stat-pill">${icone} <b>${contagemStats[icone]}</b></span>`;

                    let estiloLinha = tomouVermelho ? 'border-color: #ff0000; background: rgba(255,0,0,0.1); opacity:0.7;' : '';
                    let pointer = isReadOnly || tomouVermelho ? 'readonly' : '';
                    
                    // 🔥 CORREÇÃO DE CLIQUE E MUDANÇA VISUAL 🔥
                    let click = '';
                    if (tomouVermelho) {
                        click = `onclick="alert('Jogador expulso.')"`;
                    } else if (!isReadOnly) {
                        click = `onclick="abrirModal('${j.id}', '${t}')"`;
                    }
                    
                    html += `
                        <div class="player-row ${pointer}" ${click} style="${estiloLinha}">
                            <img src="${j.foto}" class="player-photo">
                            <div class="player-num">${j.numero}</div>
                            <div class="player-info"><div class="player-name">${j.nome}</div></div>
                            <div class="player-stats">${statsHtml}</div>
                        </div>
                    `;
                });
                document.getElementById(domId).innerHTML = html;
            };
            renderTime('A', 'lista-a'); renderTime('B', 'lista-b');
        }

        function abrirModal(id, t) {
            // 🔥 CORREÇÃO DO BUG: COMPARAÇÃO CONVERTIDA PARA STRING 🔥
            jogadorAcao = escalacao[t].find(j => String(j.id) === String(id)); 
            timeAcao = t;
            document.getElementById('acao-foto').src = jogadorAcao.foto;
            document.getElementById('acao-nome').textContent = jogadorAcao.nome;
            document.getElementById('acao-num').textContent = `Camisa ${jogadorAcao.numero}`;
            document.getElementById('modal-acao').style.display = 'flex';
        }
        function fecharModal() { document.getElementById('modal-acao').style.display = 'none'; }

        function registrar(nome, icone, pts) {
            let addPontoEm = timeAcao;
            if(pts === -1) { addPontoEm = timeAcao === 'A' ? 'B' : 'A'; pts = 1; }
            if(pts > 0) placar[addPontoEm] += pts;
            
            if(!jogadorAcao.stats) jogadorAcao.stats = [];
            jogadorAcao.stats.push(icone);
            addTimeline(`${icone} ${nome}: ${jogadorAcao.nome}`, timeAcao);
            fecharModal(); atualizarTela();
        }

        function registrarFalta() {
            faltas[timeAcao]++;
            if(!jogadorAcao.stats) jogadorAcao.stats = [];
            jogadorAcao.stats.push('🛑');
            addTimeline(`🛑 Falta cometida por ${jogadorAcao.nome}`, timeAcao);
            fecharModal(); atualizarTela();
            if(faltas[timeAcao] >= 5) alert(`⚠️ LIMITE ESTOURADO! Tiro livre direto para a Equipe ${timeAcao === 'A' ? 'B' : 'A'}.`);
        }

        function formatTime() {
            let m = Math.floor(secs / 60).toString().padStart(2, '0');
            let s = (secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }
        function toggleCrono() {
            if(rodando) { clearInterval(cronoInt); rodando = false; document.getElementById('btn-start').innerHTML = '▶ Play'; }
            else { rodando = true; document.getElementById('btn-start').innerHTML = '⏸ Pause'; cronoInt = setInterval(() => { secs++; document.getElementById('crono-display').textContent = formatTime(); }, 1000); }
        }
        function resetCrono() { clearInterval(cronoInt); rodando = false; secs = 0; document.getElementById('crono-display').textContent = "00:00"; document.getElementById('btn-start').innerHTML = '▶ Play'; }
        function trocarPeriodo() { 
            periodo = periodo === "1º Tempo" ? "2º Tempo" : (periodo === "2º Tempo" ? "Prorrogação" : "1º Tempo"); 
            periodoIndex++;
            document.getElementById('periodo-lbl').textContent = periodo + " (Trocar)"; 
        }

        function addTimeline(txt, eq = null) {
            let tStr = document.getElementById('crono-display').textContent;
            timeline.push({ tempo: tStr, periodo: periodo, txt: txt, equipe: eq });
            renderTimeline();
        }

        function renderTimeline() {
            let html = '';
            if(timeline.length === 0) {
                html = '<div class="timeline-item" style="color: #aaa; justify-content: center;">A partida ainda não começou.</div>';
            } else {
                [...timeline].reverse().forEach(t => {
                    let eqClass = t.equipe === 'A' ? 'evt-a' : (t.equipe === 'B' ? 'evt-b' : '');
                    html += `<div class="timeline-item ${eqClass}">
                                <div class="time-stamp">${t.tempo}</div>
                                <div style="flex-grow:1; font-family:'Segoe UI';"><b>[${t.periodo}]</b> ${t.txt}</div>
                             </div>`;
                });
            }
            document.getElementById('timeline-lista').innerHTML = html;
        }

        async function finalizarFutsal() {
            if(confirm("Encerrar partida e gravar súmula oficial no Banco de Dados? O resultado não poderá ser alterado.")) {
                const token = localStorage.getItem('interclassToken');

                const sumulaFinalizadaDTO = { 
                    status: 'FINALIZADO',
                    placarA: placar.A,
                    placarB: placar.B,
                    placar: placar, 
                    periodoIndex: periodoIndex, 
                    escalacao: escalacao, 
                    timeline: timeline 
                };

                try {
                    await fetch(`/api/jogos/${idJogo}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ status: 'FINALIZADO', placarA: placar.A, placarB: placar.B })
                    }).catch(e => console.warn("Fallback PUT Jogos ignorado"));

                    const response = await fetch(`/api/sumulas/${idJogo}/finalizar`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify(sumulaFinalizadaDTO)
                    });

                    let rels = JSON.parse(localStorage.getItem('relatoriosPartidas')) || {};
                    rels[idJogo] = { placar: placar, faltas: faltas, escalacao: escalacao, timeline: timeline, periodoIndex: periodoIndex };
                    localStorage.setItem('relatoriosPartidas', JSON.stringify(rels));

                    if (response.ok) {
                        alert("🏆 Súmula processada e gravada com sucesso no Servidor Oficial!");
                    } else {
                        alert(`⚠️ Salvo na memória. Erro do Servidor: ${await response.text()}`);
                    }
                    window.location.href = '/tabelas.html';
                } catch (error) {
                    console.error("Erro de conexão:", error);
                    let rels = JSON.parse(localStorage.getItem('relatoriosPartidas')) || {};
                    rels[idJogo] = { placar: placar, faltas: faltas, escalacao: escalacao, timeline: timeline, periodoIndex: periodoIndex };
                    localStorage.setItem('relatoriosPartidas', JSON.stringify(rels));
                    alert("🚨 Falha de comunicação com o Servidor. Salvando offline por segurança.");
                    window.location.href = '/tabelas.html';
                }
            }
        }
    </script>
</body>
</html>
