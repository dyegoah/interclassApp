<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Súmula Vôlei de Areia - InterclassApp</title>
	<link rel="manifest" href="/manifest.json">
	<meta name="theme-color" content="#05050f">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<link rel="apple-touch-icon" href="/img/icon-192x192.png">
	
    <style>
        :root { --theme-primary: #f4a460; --team-a: #00f2fe; --team-b: #ff00de; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', 'Segoe UI', sans-serif; }
        body { background: #020111; color: #ffffff; min-height: 100vh; overflow-x: hidden; }
        
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); }
        .arena-container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        
        .volei-header { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); padding: 15px 20px; border-radius: 15px; border-bottom: 2px solid var(--theme-primary);}
        .btn-voltar { background: transparent; border: 1px solid #fff; color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Segoe UI'; font-weight: bold;}
        
        .set-display { text-align: center; }
        .set-title { color: var(--theme-primary); font-size: 1.5rem; font-weight: bold; text-transform: uppercase; text-shadow: 0 0 10px rgba(244, 164, 96, 0.5);}
        .set-subtitle { font-family: 'Segoe UI'; font-size: 0.8rem; color: #aaa; margin-top: 5px;}
        
        .btn-finalizar { background: #00ff00; color: #000; font-weight: bold; font-family: 'Orbitron'; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer;}

        .placar-board { display: flex; justify-content: space-around; align-items: stretch; margin: 20px 0; background: rgba(0,0,0,0.5); border-radius: 15px; padding: 20px;}
        .team-col { text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .team-name { font-size: 1.2rem; font-weight: bold; color: #fff; font-family: 'Segoe UI'; text-transform: uppercase; margin-bottom: 10px;}
        
        .sets-won { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .set-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); background: transparent; }
        .team-a .set-dot.won { background: var(--team-a); border-color: var(--team-a); box-shadow: 0 0 10px var(--team-a); }
        .team-b .set-dot.won { background: var(--team-b); border-color: var(--team-b); box-shadow: 0 0 10px var(--team-b); }

        .team-score { font-size: 6rem; font-weight: bold; line-height: 1; text-shadow: 0 5px 15px rgba(0,0,0,0.8);}
        .score-a { color: var(--team-a); } .score-b { color: var(--team-b); }
        
        .timeouts-area { font-family: 'Segoe UI'; font-size: 0.8rem; margin-top: 15px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; display: inline-block; margin-left: auto; margin-right: auto;}
        .timeout-dots { display: flex; gap: 5px; justify-content: center; margin-top: 5px; }
        .timeout-dot { width: 25px; height: 10px; background: #00ff00; border-radius: 3px; box-shadow: 0 0 5px #00ff00; cursor: pointer;}
        .timeout-dot.used { background: #333; box-shadow: none; cursor: default;}

        .prancheta { display: flex; gap: 20px; flex-wrap: wrap; }
        .time-list { flex: 1; min-width: 300px; background: rgba(255,255,255,0.02); border-radius: 12px; padding: 15px; border-top: 3px solid transparent;}
        .time-list.a { border-top-color: var(--team-a); } .time-list.b { border-top-color: var(--team-b); }
        
        .player-row { display: flex; align-items: center; background: rgba(0,0,0,0.4); padding: 15px 10px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.2s;}
        .player-row:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); transform: scale(1.02);}
        .player-row.readonly { cursor: default; }
        .player-row.readonly:hover { transform: none; background: rgba(0,0,0,0.4); border-color: transparent;}
        
        .player-photo { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; margin-right: 15px; border: 2px solid var(--theme-primary);}
        .player-num { font-size: 1.3rem; font-weight: bold; color: #fff; width: 35px; }
        .player-info { flex-grow: 1; }
        .player-name { font-family: 'Segoe UI'; font-weight: bold; font-size: 1.1rem; color: #fff; }
        
        .player-stats { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
        .stat-pill { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; font-family: 'Segoe UI'; font-size: 0.9rem; color: white; display: flex; align-items: center; gap: 5px; }
        .stat-pill b { font-family: 'Orbitron'; color: var(--theme-primary); font-size: 1rem;}

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; }
        .modal-box { background: #111; border: 1px solid var(--theme-primary); border-radius: 15px; padding: 2rem; width: 90%; max-width: 450px; text-align: center; }
        .modal-box img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--theme-primary); margin-bottom: 10px; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .action-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; color: #fff; font-family: 'Segoe UI'; font-size: 0.9rem;}
        .btn-ponto { background: rgba(0, 255, 0, 0.2); border: 1px solid #00ff00; color: #00ff00;}
        .btn-erro { background: rgba(255, 0, 0, 0.2); border: 1px solid #ff0000; color: #ff5555;}
        .btn-card-amarelo { background: rgba(255, 234, 0, 0.2); border: 1px solid #ffea00; color: #ffea00;}
        .btn-card-vermelho { background: rgba(255, 0, 0, 0.5); border: 1px solid #ff0000; color: #fff;}

        .timeline-box { margin-top: 20px; background: rgba(0,0,0,0.5); border-radius: 10px; padding: 15px; display: none; }
        .timeline-item { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-family: 'Segoe UI'; font-size: 0.9rem; }
        .timeline-time { color: var(--theme-primary); font-family: 'Orbitron'; font-weight: bold; }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    </style>
</head>
<body>
    <div class="arena-container">
        
        <div class="volei-header">
            <button class="btn-voltar" onclick="window.location.href='/tabelas.html'">🡨 Voltar PlayHub</button>
            
            <div class="set-display">
                <div class="set-title" id="set-atual-lbl">1º SET</div>
                <div class="set-subtitle" id="set-meta-lbl">Vitória a 21 pts (Vantagem de 2)</div>
            </div>

            <button class="btn-finalizar" id="btn-finalizar" onclick="finalizarPartida()">Finalizar ✓</button>
        </div>

        <div style="text-align: center; margin-top: 10px; font-family: 'Segoe UI'; color: #aaa; font-size: 0.85rem;" id="match-info">A Carregar Súmula...</div>

        <div class="placar-board">
            <div class="team-col team-a">
                <div class="team-name" id="placar-nome-a">Dupla A</div>
                <div class="sets-won" id="sets-dots-a"></div>
                <div class="team-score score-a" id="score-a">0</div>
                <div class="timeouts-area" id="box-timeouts-a">
                    Tempo Restante (Set) <div class="timeout-dots" id="timeouts-a"></div>
                </div>
            </div>
            
            <div style="display:flex; flex-direction: column; justify-content: center; font-size: 2rem; font-weight: bold; color: rgba(255,255,255,0.2);">X</div>
            
            <div class="team-col team-b">
                <div class="team-name" id="placar-nome-b">Dupla B</div>
                <div class="sets-won" id="sets-dots-b"></div>
                <div class="team-score score-b" id="score-b">0</div>
                <div class="timeouts-area" id="box-timeouts-b">
                    Tempo Restante (Set) <div class="timeout-dots" id="timeouts-b"></div>
                </div>
            </div>
        </div>

        <div class="prancheta">
            <div class="time-list a" id="lista-a"></div>
            <div class="time-list b" id="lista-b"></div>
        </div>

        <div class="timeline-box" id="timeline-container">
            <h3 style="color: #fff; font-family: 'Orbitron'; margin-bottom: 10px;">📄 Relatório da Partida</h3>
            <div id="timeline-lista"></div>
        </div>

    </div>

    <div id="modal-acao" class="modal-overlay">
        <div class="modal-box">
            <img id="acao-foto" src="">
            <h3 id="acao-nome" style="color: white; font-family: 'Segoe UI';">Nome</h3>
            <p id="acao-num" style="color: var(--theme-primary); font-family: 'Orbitron'; font-weight: bold; margin-bottom: 15px;">Atleta 1</p>
            
            <p style="font-family:'Segoe UI'; font-size:0.8rem; color:#aaa; text-align:left; margin-bottom:5px; text-transform:uppercase;">Ações Positivas</p>
            <div class="action-grid" style="margin-top: 0; margin-bottom: 15px;">
                <button class="action-btn btn-ponto" onclick="registrar('Ataque', '🏐', 'ponto')"><span style="font-size:1.5rem;">🏐</span> Ponto de Ataque</button>
                <button class="action-btn btn-ponto" onclick="registrar('Bloqueio', '🧱', 'ponto')"><span style="font-size:1.5rem;">🧱</span> Bloqueio</button>
                <button class="action-btn btn-ponto" onclick="registrar('Ace (Saque)', '☄️', 'ponto')" style="grid-column: span 2;"><span style="font-size:1.5rem;">☄️</span> Ace (Saque)</button>
            </div>

            <p style="font-family:'Segoe UI'; font-size:0.8rem; color:#aaa; text-align:left; margin-bottom:5px; text-transform:uppercase;">Erros (Ponto Adversário)</p>
            <div class="action-grid" style="margin-top: 0; margin-bottom: 15px;">
                <button class="action-btn btn-erro" onclick="registrar('Erro de Saque', '❌', 'erro')"><span style="font-size:1.5rem;">❌</span> Erro de Saque</button>
                <button class="action-btn btn-erro" onclick="registrar('Toque na Rede / Invasão', '🕸️', 'erro')"><span style="font-size:1.5rem;">🕸️</span> Toque na Rede</button>
                <button class="action-btn btn-erro" onclick="registrar('Ataque Fora / Erro', '⚠️', 'erro')" style="grid-column: span 2;"><span style="font-size:1.5rem;">⚠️</span> Ataque Fora</button>
            </div>

            <div class="action-grid" style="grid-template-columns: 1fr 1fr 1fr;">
                <button class="action-btn btn-card-amarelo" onclick="registrar('Advertência', '🟨', 'aviso')">🟨 Aviso</button>
                <button class="action-btn btn-card-vermelho" onclick="registrar('Penalidade (Ponto Contra)', '🟥', 'punicao')">🟥 Punição</button>
                <button class="action-btn" style="background: transparent; border: 1px solid #555;" onclick="fecharModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let jogoId = parseInt(new URLSearchParams(window.location.search).get('jogo'));
        let lote = new URLSearchParams(window.location.search).get('lote') || 'masculino';
        let modoLeitura = new URLSearchParams(window.location.search).get('read') === 'true';
        
        let placarGlobal = { A: 0, B: 0 };
        let pontosAtletas = {}; 
        let faltasAtletas = {};
        let jogadorSelecionado = null;
        let timelineEventos = [];

        let timerInterval = null;
        let timerSegundos = 0;
        let isTimerRunning = false;
        
        let setsGanhos = { A: 0, B: 0 };
        let timeoutsUsados = { A: [false], B: [false] }; 
        let escalacao = { A: [], B: [] };
        
        let timeAcao = null;
        let totalSetsParaVencer = 2; 
        let setAtualIndex = 1; 

        // 🔥 LÓGICA DE CARREGAMENTO SEGURO VIA LOTE E DTO 🔥
        window.onload = async () => {
            if (!jogoId) { alert("Partida não encontrada."); return; }
            
            let jogoEncontrado = null;
            
            try {
                const token = localStorage.getItem('interclassToken');
                const resposta = await fetch(`/api/jogos/lote/${lote}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!resposta.ok) throw new Error("Erro de comunicação com a API.");
                
                const todosJogosDoLote = await resposta.json();
                jogoEncontrado = todosJogosDoLote.find(j => j.id === jogoId);
                
                if (!jogoEncontrado) throw new Error("Jogo não encontrado no lote atual.");
                
            } catch (err) {
                console.error("Erro na busca segura da Súmula:", err);
                
                // Fallback Offline Seguro
                let calOffline = JSON.parse(localStorage.getItem('calendariosOficiais')) || {};
                if (calOffline[lote] && calOffline[lote].jogos) {
                    jogoEncontrado = calOffline[lote].jogos.find(j => j.id === jogoId);
                }
            }

            if(!jogoEncontrado) {
                alert("Falha ao carregar a partida. O jogo não existe ou não pertence a este lote.");
                return;
            }

            processarDadosDoJogo(jogoEncontrado);
            
            if(modoLeitura) {
                let rels = JSON.parse(localStorage.getItem('relatoriosPartidas')) || {};
                let rel = rels[jogoId] || { placar:{A:0,B:0}, setsGanhos:{A:0,B:0}, setAtualIndex:0, escalacao:{A:[],B:[]}, timeline:[] };
                placarGlobal = rel.placar || {A:0, B:0};
                setsGanhos = rel.setsGanhos || {A:0,B:0};
                escalacao = rel.escalacao || {A:[],B:[]};
                timelineEventos = rel.timeline || [];
                setAtualIndex = rel.setAtualIndex || 0;
                
                document.getElementById('btn-finalizar').style.display = 'none';
                document.getElementById('box-timeouts-a').style.display = 'none';
                document.getElementById('box-timeouts-b').style.display = 'none';
                document.getElementById('timeline-container').style.display = 'block';
                atualizarTimelineDOM(); atualizarPlacarVisual(true);
            } else {
                escalarMockAreia(); atualizarPlacarVisual();
            }
            renderizarListas();
        };

        function escalarMockAreia() {
            const nomes = ["Lucas", "Pedro", "João", "Gabriel"];
            for(let i=0; i<2; i++) {
                escalacao.A.push({ id: 'A'+i, numero: i+1, nome: nomes[i], foto: `https://i.pravatar.cc/150?img=${i+10}`, stats: [] });
                escalacao.B.push({ id: 'B'+i, numero: i+1, nome: nomes[i+2] || 'Atleta B', foto: `https://i.pravatar.cc/150?img=${i+20}`, stats: [] });
            }
        }

        function checarFimDeSet() {
            let ptsParaVencer = (setAtualIndex === (totalSetsParaVencer * 2 - 1)) ? 15 : 21; 
            let venceuA = placarGlobal.A >= ptsParaVencer && (placarGlobal.A - placarGlobal.B) >= 2;
            let venceuB = placarGlobal.B >= ptsParaVencer && (placarGlobal.B - placarGlobal.A) >= 2;

            if(venceuA || venceuB) {
                let timeVencedor = venceuA ? 'A' : 'B';
                timelineEventos.push({ set: setAtualIndex, placarStr: `${placarGlobal.A}x${placarGlobal.B}`, txt: `🏆 FIM DO ${setAtualIndex}º SET! Vitória da Dupla ${timeVencedor} por ${placarGlobal.A} x ${placarGlobal.B}`});
                setsGanhos[timeVencedor]++;
                
                if(setsGanhos[timeVencedor] === totalSetsParaVencer) {
                    alert(`🏆 FIM DE JOGO! A Dupla ${timeVencedor} venceu a partida.`);
                    finalizarPartida();
                } else {
                    alert(`Fim do ${setAtualIndex}º Set! Vitória da Dupla ${timeVencedor}.\nAs duplas trocarão de lado.`);
                    placarGlobal.A = 0; placarGlobal.B = 0; timeoutsUsados = { A: [false], B: [false] };
                    setAtualIndex++; atualizarPlacarVisual();
                }
                return true;
            }
            return false;
        }

        function atualizarPlacarVisual(leitura = false) {
            document.getElementById('score-a').textContent = placarGlobal.A;
            document.getElementById('score-b').textContent = placarGlobal.B;

            let isTieBreak = setAtualIndex === (totalSetsParaVencer * 2 - 1);
            document.getElementById('set-atual-lbl').innerHTML = isTieBreak ? `🔥 TIE-BREAK` : `${setAtualIndex}º SET`;
            document.getElementById('set-meta-lbl').textContent = isTieBreak ? `Vitória a 15 pts` : `Vitória a 21 pts`;

            const renderDots = (t) => {
                let html = '';
                for(let i=0; i<totalSetsParaVencer; i++) html += `<div class="set-dot ${i < setsGanhos[t] ? 'won' : ''}"></div>`;
                document.getElementById(`sets-dots-${t.toLowerCase()}`).innerHTML = html;
            };
            renderDots('A'); renderDots('B');

            if(!leitura) {
                const renderTimeouts = (t) => {
                    document.getElementById(`timeouts-${t.toLowerCase()}`).innerHTML = `<div class="timeout-dot ${timeoutsUsados[t][0] ? 'used' : ''}" onclick="pedirTempo('${t}', 0)"></div>`;
                };
                renderTimeouts('A'); renderTimeouts('B');
            }
        }

        function pedirTempo(time, index) {
            if(timeoutsUsados[time][index]) return; 
            if(confirm(`Confirmar Pedido de Tempo (30s) para a Dupla ${time}?`)) {
                timeoutsUsados[time][index] = true;
                timelineEventos.push({ set: setAtualIndex, placarStr: `${placarGlobal.A}x${placarGlobal.B}`, txt: `⏱️ TEMPO TÉCNICO: Solicitado pela Dupla ${time}.`});
                atualizarPlacarVisual();
            }
        }

        function processarDadosDoJogo(jogo) {
            let nomeEsporte = jogo.esporte || (jogo.modalidade ? jogo.modalidade.nomeEsporte : "A Definir");
            let iconeEsporte = jogo.icone || (jogo.modalidade ? jogo.modalidade.icone : "🏅");
            
            document.getElementById('lbl-esporte').innerText = `${iconeEsporte} ${nomeEsporte} | ${jogo.titulo.split(' | ')[0]}`;

            let confronto = jogo.titulo.split(' | ').length > 1 ? jogo.titulo.split(' | ')[1] : jogo.titulo;
            let lados = confronto.split(' x ');

            let equipaA = jogo.equipeANome || "Equipe A";
            let atletaA = jogo.equipeANome || "A Definir";
            let turmaA = "Competidor";
            let idAtletaA = jogo.equipeAId || "ID_FANTASMA_A";

            if (lados[0] && lados[0].includes('(')) {
                turmaA = lados[0].split('(')[0].trim();
                atletaA = lados[0].split('(')[1].replace(')', '').trim();
            }

            let equipaB = jogo.equipeBNome || "Equipe B";
            let atletaB = jogo.equipeBNome || "A Definir";
            let turmaB = "Competidor";
            let idAtletaB = jogo.equipeBId || "ID_FANTASMA_B";

            if (lados[1] && lados[1].includes('(')) {
                turmaB = lados[1].split('(')[0].trim();
                atletaB = lados[1].split('(')[1].replace(')', '').trim();
            }

            document.getElementById('placar-nome-a').innerText = equipaA;
            document.getElementById('placar-nome-b').innerText = equipaB;
        }

        function renderizarListas() {
            const renderTime = (t, domId) => {
                let html = '';
                escalacao[t].forEach(j => {
                    let contagemStats = {}; if (!j.stats) j.stats = []; 
                    j.stats.forEach(icone => { contagemStats[icone] = (contagemStats[icone] || 0) + 1; });
                    let statsHtml = '';
                    for(let icone in contagemStats) statsHtml += `<span class="stat-pill">${icone} <b>${contagemStats[icone]}</b></span>`;

                    let pointer = isReadOnly ? 'readonly' : '';
                    let click = isReadOnly ? '' : `onclick="abrirModalAcoes('${j.id}', '${t}', '${j.nome}', '${j.foto}')"`;
                    
                    html += `
                        <div class="player-row ${pointer}" ${click}>
                            <img src="${j.foto}" class="player-photo">
                            <div class="player-info">
                                <div class="player-name">${j.nome}</div>
                                <div class="player-num" style="font-size:0.8rem; color:var(--theme-primary); width:auto;">Atleta ${j.numero}</div>
                            </div>
                            <div class="player-stats">${statsHtml}</div>
                        </div>
                    `;
                });
                document.getElementById(domId).innerHTML = html;
            };
            renderTime('A', 'lista-a'); renderTime('B', 'lista-b');
        }

        function abrirModalAcoes(idAtleta, equipe, nome, imgUrl) {
            jogadorSelecionado = { id: idAtleta, equipe: equipe, nome: nome };
            timeAcao = equipe;
            document.getElementById('acao-foto').src = imgUrl;
            document.getElementById('acao-nome').innerText = nome;
            document.getElementById('modal-acao').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modal-acao').style.display = 'none';
            jogadorSelecionado = null;
        }

        function registrar(nome, icone, tipoAcao) {
            if(!jogadorSelecionado) return;
            
            let eq = timeAcao;
            let id = jogadorSelecionado.id;
            let nomeAtleta = jogadorSelecionado.nome;
            
            let timeRecebePonto = null;
            if (tipoAcao === 'ponto') timeRecebePonto = eq; 
            else if (tipoAcao === 'erro') timeRecebePonto = eq === 'A' ? 'B' : 'A'; 
            else if (tipoAcao === 'punicao') { timeRecebePonto = eq === 'A' ? 'B' : 'A'; alert("🟥 Cartão Vermelho na Areia é ponto e saque para o adversário!"); }

            if (timeRecebePonto) placarGlobal[timeRecebePonto]++;
            
            let jAcao = escalacao[eq].find(j => j.id === id);
            if(!jAcao.stats) jAcao.stats = [];
            jAcao.stats.push(icone);

            timelineEventos.unshift({ set: setAtualIndex, placarStr: `${placarGlobal.A}x${placarGlobal.B}`, txt: `${icone} ${nome}: ${nomeAtleta}` });
            
            fecharModal(); atualizarPlacarVisual(); renderizarListas(); atualizarTimelineDOM(); checarFimDeSet();
        }

        function atualizarTimelineDOM() {
            const list = document.getElementById('timeline-lista');
            if(timelineEventos.length === 0) return;
            
            list.innerHTML = '';
            timelineEventos.forEach(t => {
                list.innerHTML += `
                    <div class="timeline-item">
                        <span class="timeline-time">[Set ${t.set} | ${t.placarStr}]</span> 
                        <div style="flex-grow:1;">${t.txt}</div>
                    </div>
                `;
            });
        }

        async function enviarSumulaParaBanco() {
            if (!confirm(`Encerrar a partida com o placar final de ${placarGlobal.A} x ${placarGlobal.B}?`)) return;

            const btn = document.getElementById('btn-finalizar');
            btn.disabled = true;
            btn.innerText = "Processando no Servidor...";

            let placarFinalA = (setsGanhos.A > 0 || setsGanhos.B > 0) ? setsGanhos.A : placarGlobal.A;
            let placarFinalB = (setsGanhos.A > 0 || setsGanhos.B > 0) ? setsGanhos.B : placarGlobal.B;

            try {
                const token = localStorage.getItem('interclassToken');
                await fetch(`/api/jogos/${jogoId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ status: 'FINALIZADO', placarA: placarFinalA, placarB: placarFinalB })
                }).catch(e => console.warn("Fallback PUT Jogos ignorado"));

                const resposta = await fetch(`/api/sumulas/${jogoId}/finalizar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ placarA: placarFinalA, placarB: placarFinalB })
                });

                if (resposta.ok) {
                    let relatorios = JSON.parse(localStorage.getItem('relatoriosPartidas')) || {};
                    relatorios[jogoId] = { placar: { A: placarFinalA, B: placarFinalB }, setsGanhos: setsGanhos, setAtualIndex: setAtualIndex, escalacao: escalacao, timeline: timelineEventos };
                    localStorage.setItem('relatoriosPartidas', JSON.stringify(relatorios));

                    alert("🏆 Súmula processada e gravada com sucesso no Servidor Oficial!");
                    window.location.href = '/tabelas.html';
                } else {
                    throw new Error("Erro no servidor Java.");
                }
            } catch (erro) {
                alert("Falha de conexão com o banco. Verifique o console do Spring Tools Suite.");
                btn.disabled = false;
                btn.innerText = "Tentar Novamente";
            }
        }
    </script>
</body>
