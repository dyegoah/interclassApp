<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Súmula Individual - InterclassApp</title>
	<link rel="manifest" href="/manifest.json">
	<meta name="theme-color" content="#05050f">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<link rel="apple-touch-icon" href="/img/icon-192x192.png">
	
    <style>
        :root { --theme-primary: #ffd700; --team-a: #00f2fe; --team-b: #ff00de; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', 'Segoe UI', sans-serif; }
        body { background: #020111; color: #ffffff; min-height: 100vh; overflow-x: hidden; padding-bottom: 100px; }
        
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); }
        
        .header-especial { background: rgba(0,0,0,0.8); padding: 20px 10px; border-bottom: 2px solid var(--theme-primary); text-align: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 5px 20px rgba(0,0,0,0.8);}
        .header-info-esporte { font-size: 0.85rem; color: #aaa; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 2px; }
        
        .placar-board { display: flex; justify-content: center; align-items: center; gap: 15px; max-width: 800px; margin: 0 auto;}
        .team-info { display: flex; flex-direction: column; align-items: center; flex: 1; overflow: hidden;}
        .team-class { font-family: 'Segoe UI'; font-size: 0.85rem; color: #888; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center;}
        .team-name { font-size: 1.3rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; margin-top: 5px; text-align: center;}
        .team-a-text { color: var(--team-a); }
        .team-b-text { color: var(--team-b); }
        
        .score-box { font-size: 4rem; font-weight: bold; line-height: 1; padding: 0 10px; text-shadow: 0 0 15px rgba(255,255,255,0.2);}
        .score-divider { font-size: 1.5rem; color: #555; }
        
        .timer-box { margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
        .timer-display { font-size: 2.2rem; font-weight: bold; color: #fff; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .btn-timer { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 20px; border-radius: 20px; font-family: 'Orbitron'; cursor: pointer; transition: 0.3s; font-size: 0.85rem; margin-top: 5px; }
        .btn-timer.running { background: #ff0000; color: #fff; border-color: #ff0000; box-shadow: 0 0 15px rgba(255,0,0,0.4);}

        /* 🔥 LAYOUT DE ARENA CENTRALIZADO E EXCLUSIVO (1v1) 🔥 */
        .arena-prancheta { 
            display: flex; 
            width: 95%; 
            max-width: 1200px; 
            margin: 25px auto; 
            gap: 20px; 
            align-items: flex-start; 
            justify-content: center;
        }
        
        @media (max-width: 900px) {
            .arena-prancheta { flex-direction: column; }
        }

        .coluna-time { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 280px; width: 100%; }
        
        .jogador-card { display: flex; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 50px 15px 15px 50px; padding: 15px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
        .jogador-card:active { background: rgba(255,255,255,0.1); transform: scale(0.96); }
        .jogador-card.eq-a { border-left: 4px solid var(--team-a); }
        .jogador-card.eq-b { border-left: 4px solid var(--team-b); }
        
        .jog-img-wrapper { position: relative; width: 80px; height: 80px; flex-shrink: 0; }
        .jog-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #555; background: #222;}
        .eq-a .jog-img { border-color: var(--team-a); }
        .eq-b .jog-img { border-color: var(--team-b); }
        
        .jog-detalhes { flex-grow: 1; padding: 0 15px; overflow: hidden; }
        .jog-nome { font-family: 'Segoe UI'; font-size: 1.2rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .jog-stats { font-size: 0.85rem; color: #aaa; display: flex; gap: 8px; margin-top: 6px; font-family: 'Segoe UI';}
        .stat-badge { background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; font-weight: bold; border: 1px solid rgba(255,255,255,0.1);}
        
        .gols-destaque { font-size: 2.5rem; font-weight: bold; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3);}

        .timeline-container { 
            flex: 1.2; 
            min-width: 300px; 
            width: 100%;
            background: rgba(0,0,0,0.6); 
            border-radius: 15px; 
            padding: 20px; 
            border: 1px solid rgba(255,255,255,0.1); 
            display: flex; 
            flex-direction: column;
            min-height: 250px;
        }
        .timeline-titulo { font-size: 1rem; color: var(--theme-primary); margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px;}
        .timeline-list { display: flex; flex-direction: column; gap: 10px; flex-grow: 1; overflow-y: auto; max-height: 350px; padding-right: 5px;}
        .timeline-item { display: flex; align-items: center; gap: 12px; font-family: 'Segoe UI'; font-size: 0.85rem; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px; border-left: 3px solid #555;}
        .timeline-item.evt-a { border-left-color: var(--team-a); }
        .timeline-item.evt-b { border-left-color: var(--team-b); }
        .time-stamp { color: #00ff00; font-family: 'Orbitron'; font-weight: bold; width: 55px; font-size: 0.95rem; flex-shrink: 0;}

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 2000; justify-content: center; align-items: center; }
        .modal-box { background: #111; border: 1px solid var(--theme-primary); border-radius: 20px; padding: 25px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 15px 50px rgba(0,0,0,0.8); }
        
        .modal-header { margin-bottom: 20px; }
        .modal-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 2px solid #fff; }
        .modal-box h3 { font-family: 'Segoe UI'; font-size: 1.3rem; color: #fff; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .modal-box p { font-size: 0.9rem; color: #aaa; font-family: 'Orbitron'; }
        
        .grid-acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .btn-acao-modal { padding: 15px; border-radius: 12px; font-family: 'Orbitron'; font-weight: bold; font-size: 0.95rem; cursor: pointer; border: none; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .btn-acao-modal:active { transform: scale(0.95); }
        .btn-gol { background: rgba(0, 255, 0, 0.1); color: #00ff00; border: 1px solid #00ff00; }
        .btn-falta { background: rgba(255, 255, 0, 0.1); color: #ffff00; border: 1px solid #ffff00; }
        .btn-vermelho { background: rgba(255, 0, 0, 0.1); color: #ff0000; border: 1px solid #ff0000; grid-column: span 2;}
        .btn-remover { background: transparent; color: #aaa; border: 1px dashed #555; grid-column: span 2; padding: 10px;}
        
        .btn-fechar-modal { background: #333; color: #fff; border: none; padding: 15px; border-radius: 10px; width: 100%; cursor: pointer; font-family: 'Segoe UI'; font-weight: bold; font-size: 1rem;}

        .footer-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.95); padding: 15px; text-align: center; border-top: 1px solid var(--theme-primary); z-index: 100; display: flex; justify-content: center; gap: 15px;}
        .btn-finalizar { background: #00ff00; color: #000; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; font-size: 1.1rem; font-family: 'Orbitron'; cursor: pointer; text-transform: uppercase; width: 100%; max-width: 400px; box-shadow: 0 0 15px rgba(0,255,0,0.4); }
        .btn-voltar { background: #fff; color: #000; display: none; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; width: 100%; max-width: 400px; cursor: pointer; font-family: 'Orbitron'; font-size: 1.1rem;}
    </style>
</head>
<body>

    <div class="header-especial glass">
        <div class="header-info-esporte" id="lbl-esporte">SÚMULA 1 VS 1</div>
        
        <div class="placar-board">
            <div class="team-info">
                <div class="team-class" id="lbl-turma-a">A Definir</div>
                <div class="team-name team-a-text" id="lbl-equipa-a">A Definir</div>
            </div>
            
            <div class="score-box team-a-text" id="val-placar-a">0</div>
            <div class="score-divider">X</div>
            <div class="score-box team-b-text" id="val-placar-b">0</div>
            
            <div class="team-info">
                <div class="team-class" id="lbl-turma-b">A Definir</div>
                <div class="team-name team-b-text" id="lbl-equipa-b">A Definir</div>
            </div>
        </div>

        <div class="timer-box">
            <div class="timer-display" id="relogio-display">00:00</div>
            <button class="btn-timer" id="btn-timer" onclick="toggleTimer()">▶ INICIAR CRONÔMETRO</button>
        </div>
    </div>

    <!-- 🔥 PRANCHETA CENTRALIZADA (TIME A - TIMELINE NO MEIO - TIME B) 🔥 -->
    <div class="arena-prancheta">
        
        <div class="coluna-time" id="coluna-a"></div>
        
        <div class="timeline-container">
            <div class="timeline-titulo">⏱️ Linha do Tempo da Partida</div>
            <div class="timeline-list" id="timeline-list">
                <div class="timeline-item" style="color: #aaa; justify-content: center;">A partida ainda não começou.</div>
            </div>
        </div>
        
        <div class="coluna-time" id="coluna-b"></div>

    </div>

    <div id="modal-acoes" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <img src="" alt="Avatar" class="modal-avatar" id="modal-img-jogador">
                <h3 id="modal-nome-jogador">Nome do Jogador</h3>
                <p id="modal-equipe-jogador">Equipe</p>
            </div>
            
            <div class="grid-acoes">
                <button class="btn-acao-modal btn-gol" onclick="registrarAcao('Gol/Ponto', 1, '🎯')">
                    <span style="font-size: 1.8rem;">🎯</span> +1 PONTO
                </button>
                <button class="btn-acao-modal btn-falta" onclick="registrarAcao('Cartão Amarelo', 0, '🟨')">
                    <span style="font-size: 1.8rem;">🟨</span> ADVERTÊNCIA
                </button>
                <button class="btn-acao-modal btn-vermelho" onclick="registrarAcao('Cartão Vermelho', 0, '🟥')">
                    <span style="font-size: 1.2rem;">🟥</span> DESCLASSIFICAÇÃO
                </button>
                <button class="btn-acao-modal btn-remover" onclick="registrarAcao('Remover Ponto', -1, '🔄')">
                    Corrigir / Remover 1 Ponto
                </button>
            </div>
            
            <button class="btn-fechar-modal" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

    <div class="footer-bar">
        <button class="btn-finalizar" id="btn-enviar" onclick="enviarSumulaParaBanco()">🏁 Processar e Encerrar</button>
        <button class="btn-voltar" id="btn-voltar" onclick="window.history.back()">Voltar ao PlayHub</button>
    </div>

    <script>
        let jogoId = parseInt(new URLSearchParams(window.location.search).get('jogo'));
        let lote = new URLSearchParams(window.location.search).get('lote') || 'masculino';
        let modoLeitura = new URLSearchParams(window.location.search).get('read') === 'true';
        
        let placarGlobal = { A: 0, B: 0 };
        let pontosAtletas = {}; 
        let faltasAtletas = {};
        let jogadorSelecionado = null;
        let timelineEventos = [];

        let timerInterval = null;
        let timerSegundos = 0;
        let isTimerRunning = false;

        window.onload = async () => {
            if (!jogoId) { alert("Partida não encontrada."); return; }
            
            let jogoEncontrado = null;
            
            try {
                const token = localStorage.getItem('interclassToken');
                const resposta = await fetch(`/api/jogos/lote/${lote}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!resposta.ok) throw new Error("Erro de comunicação com a API.");
                
                const todosJogosDoLote = await resposta.json();
                jogoEncontrado = todosJogosDoLote.find(j => j.id === jogoId);
                
                if (!jogoEncontrado) throw new Error("Jogo não encontrado no lote atual.");
                
            } catch (err) {
                console.error("Erro na busca segura da Súmula:", err);
                let calOffline = JSON.parse(localStorage.getItem('calendariosOficiais')) || {};
                if (calOffline[lote] && calOffline[lote].jogos) {
                    jogoEncontrado = calOffline[lote].jogos.find(j => j.id === jogoId);
                }
            }

            if(!jogoEncontrado) {
                alert("Falha ao carregar a partida. O jogo não existe ou não pertence a este lote.");
                return;
            }

            processarDadosDoJogo(jogoEncontrado);
            
            let rels = JSON.parse(localStorage.getItem('relatoriosPartidas')) || {};
            if(rels[jogoId] && rels[jogoId].timeline) {
                timelineEventos = rels[jogoId].timeline;
                atualizarTimelineDOM();
            }
        };

        function toggleTimer() {
            const btn = document.getElementById('btn-timer');
            if(isTimerRunning) {
                clearInterval(timerInterval);
                btn.innerText = "▶ RETOMAR CRONÔMETRO";
                btn.classList.remove('running');
            } else {
                timerInterval = setInterval(() => {
                    timerSegundos++;
                    document.getElementById('relogio-display').innerText = formatarTempo(timerSegundos);
                }, 1000);
                btn.innerText = "⏸ PAUSAR CRONÔMETRO";
                btn.classList.add('running');
            }
            isTimerRunning = !isTimerRunning;
        }

        function formatarTempo(segundosTotal) {
            let m = Math.floor(segundosTotal / 60).toString().padStart(2, '0');
            let s = (segundosTotal % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // 🔥 FUNÇÃO EXTRATORA DE NOMES BLINDADA
        function extrairNomeTurma(nomeOriginal) {
            if (!nomeOriginal || nomeOriginal === "A Definir" || nomeOriginal === "Equipe A" || nomeOriginal === "Equipe B") {
                return { nome: "A Definir", turma: "Competidor" };
            }
            
            let nomePuro = nomeOriginal;
            let turmaPura = "Competidor";
            
            const ultimaAbertura = nomeOriginal.lastIndexOf('(');
            const ultimoFechamento = nomeOriginal.lastIndexOf(')');
            
            if (ultimaAbertura !== -1 && ultimoFechamento !== -1 && ultimoFechamento > ultimaAbertura) {
                nomePuro = nomeOriginal.substring(0, ultimaAbertura).trim();
                turmaPura = nomeOriginal.substring(ultimaAbertura + 1, ultimoFechamento).trim();
            }
            
            return { nome: nomePuro, turma: turmaPura };
        }

        function processarDadosDoJogo(jogo) {
            let nomeEsporte = jogo.esporte || (jogo.modalidade ? jogo.modalidade.nomeEsporte : "A Definir");
            let iconeEsporte = jogo.icone || (jogo.modalidade ? jogo.modalidade.icone : "🏅");

            let tituloReduzido = jogo.titulo ? jogo.titulo.split(' | ')[0] : "Partida";
            document.getElementById('lbl-esporte').innerText = `${iconeEsporte} ${nomeEsporte} | ${tituloReduzido}`;

            // Pega o que o banco tem ou o Título
            let rawA = jogo.equipeANome || jogo.equipeaNome || "";
            let rawB = jogo.equipeBNome || jogo.equipebNome || "";

            if ((!rawA || rawA === "Equipe A" || rawA === "A Definir") && jogo.titulo && jogo.titulo.includes(' | ')) {
                let partes = jogo.titulo.split(' | ')[1].split(' x ');
                if (partes.length >= 2) {
                    rawA = partes[0].trim().replace(' (Série de Partidas)', '');
                    rawB = partes[1].trim().replace(' (Série de Partidas)', '');
                }
            } else if ((!rawA || rawA === "Equipe A" || rawA === "A Definir") && jogo.titulo && jogo.titulo.includes(' x ')) {
                let partes = jogo.titulo.split(' x ');
                if (partes.length >= 2) {
                    rawA = partes[0].trim().replace(' (Série de Partidas)', '');
                    rawB = partes[1].trim().replace(' (Série de Partidas)', '');
                }
            }

            let idA = jogo.equipeAId || "ID_A_" + Math.random();
            let idB = jogo.equipeBId || "ID_B_" + Math.random();
            
            let dadosA = extrairNomeTurma(rawA);
            let dadosB = extrairNomeTurma(rawB);

            // Injeta nos Placar do Topo
            document.getElementById('lbl-turma-a').innerText = dadosA.turma;
            document.getElementById('lbl-equipa-a').innerText = dadosA.nome;
            document.getElementById('lbl-turma-b').innerText = dadosB.turma;
            document.getElementById('lbl-equipa-b').innerText = dadosB.nome;

            let colA = document.getElementById('coluna-a');
            let colB = document.getElementById('coluna-b');
            colA.innerHTML = ''; colB.innerHTML = '';

            // 🔥 A MÁGICA DESTA TELA: ELA É EXCLUSIVA PARA 1x1. APENAS 1 CARD DESENHADO!
            // Não faz laços FOR. Desenha apenas o Competidor A na esquerda, e o B na direita.
            colA.innerHTML = criarCardJogador('A', dadosA.nome, idA);
            colB.innerHTML = criarCardJogador('B', dadosB.nome, idB);

            if (modoLeitura || jogo.status === 'FINALIZADO') {
                placarGlobal.A = jogo.placarA || 0;
                placarGlobal.B = jogo.placarB || 0;
                atualizarPlacarHTML();
                
                document.getElementById('btn-enviar').style.display = 'none';
                document.getElementById('btn-timer').style.display = 'none';
                document.getElementById('btn-voltar').style.display = 'block';
            }
        }

        function criarCardJogador(equipe, nome, idAtleta) {
            pontosAtletas[idAtleta] = 0;
            faltasAtletas[idAtleta] = 0;
            let classeCard = equipe === 'A' ? 'eq-a' : 'eq-b';
            
            let corEq = equipe === 'A' ? '00f2fe' : 'ff00de';
            let imgUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(nome)}&background=222&color=${corEq}&bold=true&size=128`;
            
            let clickAction = modoLeitura ? '' : `onclick="abrirModalAcoes('${idAtleta}', '${equipe}', '${nome.replace(/'/g, "\\'")}', '${imgUrl}')"`;

            return `
                <div class="jogador-card ${classeCard}" ${clickAction}>
                    <div class="jog-img-wrapper">
                        <img src="${imgUrl}" class="jog-img" alt="Foto">
                    </div>
                    
                    <div class="jog-detalhes">
                        <div class="jog-nome" title="${nome}">${nome}</div>
                        <div class="jog-stats">
                            <span class="stat-badge">🟨 <span id="falta-${idAtleta}">0</span></span>
                        </div>
                    </div>
                    
                    <div class="gols-destaque" id="stats-${idAtleta}">0</div>
                </div>
            `;
        }

        function abrirModalAcoes(idAtleta, equipe, nome, imgUrl) {
            jogadorSelecionado = { id: idAtleta, equipe: equipe, nome: nome };
            document.getElementById('modal-img-jogador').src = imgUrl;
            document.getElementById('modal-nome-jogador').innerText = nome;
            document.getElementById('modal-equipe-jogador').innerText = `Atleta da Equipe ${equipe}`;
            document.getElementById('modal-acoes').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modal-acoes').style.display = 'none';
            jogadorSelecionado = null;
        }

        function registrarAcao(tipo, valor, icone) {
            if(!jogadorSelecionado) return;
            
            let eq = jogadorSelecionado.equipe;
            let id = jogadorSelecionado.id;
            let nome = jogadorSelecionado.nome;
            let tempoStr = formatarTempo(timerSegundos);

            if (tipo.includes('Ponto')) {
                placarGlobal[eq] += valor;
                if(placarGlobal[eq] < 0) placarGlobal[eq] = 0;

                pontosAtletas[id] += valor;
                if(pontosAtletas[id] < 0) pontosAtletas[id] = 0;

                document.getElementById(`stats-${id}`).innerText = pontosAtletas[id];
                atualizarPlacarHTML();
            } else if (tipo.includes('Cartão')) {
                faltasAtletas[id] += 1;
                document.getElementById(`falta-${id}`).innerText = faltasAtletas[id];
            }

            if(valor >= 0) {
                timelineEventos.unshift({
                    tempo: tempoStr,
                    equipe: eq,
                    icone: icone,
                    texto: `${tipo} de ${nome}`
                });
                atualizarTimelineDOM();
            }

            fecharModal();
        }

        function atualizarPlacarHTML() {
            document.getElementById('val-placar-a').innerText = placarGlobal.A;
            document.getElementById('val-placar-b').innerText = placarGlobal.B;
        }

        function atualizarTimelineDOM() {
            const list = document.getElementById('timeline-list');
            if(timelineEventos.length === 0) return;
            
            list.innerHTML = '';
            timelineEventos.forEach(evt => {
                let classeEvt = evt.equipe === 'A' ? 'evt-a' : 'evt-b';
                list.innerHTML += `
                    <div class="timeline-item ${classeEvt}">
                        <div class="time-stamp">${evt.tempo}</div>
                        <div style="font-size: 1.2rem;">${evt.icone}</div>
                        <div style="flex-grow: 1; word-break: break-word;">${evt.texto}</div>
                    </div>
                `;
            });
        }

        async function enviarSumulaParaBanco() {
            if (!confirm(`Encerrar a partida com o placar final de ${placarGlobal.A} x ${placarGlobal.B}?`)) return;

            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            btn.innerText = "Processando no Servidor...";

            if (isTimerRunning) toggleTimer(); 

            try {
                const token = localStorage.getItem('interclassToken');
                const resposta = await fetch(`/api/sumulas/${jogoId}/finalizar`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ placarA: placarGlobal.A, placarB: placarGlobal.B })
                });

                if (resposta.ok) {
                    let relatorios = JSON.parse(localStorage.getItem('relatoriosPartidas')) || {};
                    relatorios[jogoId] = { placar: { A: placarGlobal.A, B: placarGlobal.B }, timeline: timelineEventos };
                    localStorage.setItem('relatoriosPartidas', JSON.stringify(relatorios));

                    // 🔥 ATUALIZA O STATUS DO JOGO LOCALMENTE PARA AVANÇAR AUTOMATICAMENTE O TORNEIO
                    let calOffline = JSON.parse(localStorage.getItem('calendariosOficiais')) || {};
                    if (calOffline[lote] && calOffline[lote].jogos) {
                        let jg = calOffline[lote].jogos.find(j => j.id === jogoId);
                        if (jg) {
                            jg.status = 'FINALIZADO';
                            jg.placarA = placarGlobal.A;
                            jg.placarB = placarGlobal.B;
                            localStorage.setItem('calendariosOficiais', JSON.stringify(calOffline));
                        }
                    }

                    alert("🏆 Súmula processada e gravada com sucesso no Servidor Oficial!");
                    window.location.href = '/tabelas.html';
                } else {
                    throw new Error("Erro no servidor Java.");
                }
            } catch (erro) {
                alert("Falha de conexão com o banco. Verifique o console do Spring Tools Suite.");
                btn.disabled = false;
                btn.innerText = "Tentar Novamente";
            }
        }
    </script>
</body>
</html>
