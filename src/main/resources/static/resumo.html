<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal do Atleta - InterclassApp</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a16">
    <style>
        :root { 
            --theme-primary: #00f2fe; 
            --theme-glow: rgba(0, 242, 254, 0.6); 
            --bg-deep: #05050f;
            --panel-bg: rgba(15, 15, 30, 0.7);
            --win-color: #00ff55;
            --danger-color: #ff0055;
            --gold: #ffd700;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent;}
        
        body { 
            background: var(--bg-deep) url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed !important;
            background-size: cover !important; color: #ffffff; min-height: 100vh; padding-bottom: 80px;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(5,5,15,0.8) 0%, rgba(5,5,15,0.95) 100%); z-index: -1;}

        .glass { background: var(--panel-bg); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); border-radius: 16px;}
        
        /* HEADER DO ALUNO (PUBLICO) */
        #header-aluno { display: none; position: sticky; top: 0; z-index: 100; background: rgba(5, 5, 15, 0.9); backdrop-filter: blur(10px); padding: 15px; border-bottom: 2px solid var(--theme-primary); text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.8);}
        .live-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,0,85,0.15); border: 1px solid var(--danger-color); color: var(--danger-color); padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; letter-spacing: 1px; animation: pulse 2s infinite;}
        .live-dot { width: 8px; height: 8px; background: var(--danger-color); border-radius: 50%; box-shadow: 0 0 8px var(--danger-color);}
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,0,85,0.4); } 70% { box-shadow: 0 0 0 10px rgba(255,0,85,0); } 100% { box-shadow: 0 0 0 0 rgba(255,0,85,0); } }

        /* PAINEL DO PROFESSOR */
        #painel-professor { display: none; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 15px; border-left: 5px solid #00ff55; margin: 20px 15px; border: 1px solid rgba(0,255,85,0.2); }
        .btn-master-share { background: linear-gradient(90deg, #00ff55, #00cc44); color: #000; border: none; padding: 15px 20px; border-radius: 30px; font-family: 'Orbitron'; font-weight: bold; font-size: 1rem; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 0 20px rgba(0,255,85,0.4); transition: 0.3s; margin-top: 15px;}
        .btn-master-share:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(0,255,85,0.6); }

        /* NAVEGAÇÃO SUPERIOR (LOTES) */
        .filtros-lote { display: flex; gap: 10px; padding: 15px; overflow-x: auto; scrollbar-width: none;}
        .filtros-lote::-webkit-scrollbar { display: none; }
        .btn-lote { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #aaa; padding: 10px 20px; border-radius: 30px; font-family: 'Orbitron'; font-size: 0.85rem; cursor: pointer; text-transform: uppercase; white-space: nowrap;}
        .btn-lote.active { color: #fff; background: rgba(255,255,255,0.1); border-color: var(--theme-primary); box-shadow: 0 0 15px var(--theme-glow);}

        /* CARROSSEL DE ESPORTES */
        .esportes-carousel { display: flex; gap: 15px; padding: 0 15px 15px 15px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 15px;}
        .esportes-carousel::-webkit-scrollbar { display: none; }
        .btn-esporte { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-width: 80px; padding: 10px; background: transparent; border: 2px solid transparent; border-radius: 12px; cursor: pointer; transition: 0.3s; opacity: 0.6; color: #fff;}
        .btn-esporte.active { opacity: 1; border-color: var(--theme-primary); background: rgba(0,242,254,0.1); box-shadow: inset 0 0 15px var(--theme-glow);}
        .esporte-icon { font-size: 1.8rem; }
        .esporte-name { font-family: 'Segoe UI'; font-size: 0.75rem; font-weight: bold; text-align: center;}

        /* NAVEGAÇÃO DE ABAS */
        .app-nav { display: flex; justify-content: space-between; gap: 5px; padding: 0 15px 15px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 15px;}
        .nav-btn { flex: 1; background: transparent; border: none; color: #888; padding: 10px 5px; font-family: 'Orbitron'; font-size: 0.8rem; font-weight: bold; transition: 0.3s; cursor: pointer; border-bottom: 3px solid transparent; text-transform: uppercase; text-align: center;}
        .nav-btn.active { color: var(--theme-primary); border-bottom-color: var(--theme-primary); text-shadow: 0 0 10px var(--theme-glow);}
        
        .tab-content { display: none; padding: 0 15px; animation: fadeIn 0.3s ease;}
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ESTILOS DE PARTIDAS E ACORDEÃO */
        .match-card { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 15px; overflow: hidden; position: relative;}
        .match-header { background: rgba(255,255,255,0.03); padding: 8px 15px; font-size: 0.75rem; color: #aaa; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.02);}
        .match-body { padding: 15px; display: flex; align-items: center; justify-content: space-between;}
        .team-info { display: flex; flex-direction: column; gap: 10px; flex-grow: 1;}
        .team-row { display: flex; align-items: center; justify-content: space-between;}
        .team-name { font-family: 'Segoe UI'; font-weight: bold; font-size: 1rem; color: #ddd; display: flex; align-items: center; gap: 10px;}
        .team-score { font-family: 'Orbitron'; font-size: 1.2rem; font-weight: bold; color: #fff; background: rgba(255,255,255,0.1); padding: 2px 10px; border-radius: 6px;}
        .winner .team-name { color: #fff; }
        .winner .team-score { color: var(--win-color); background: rgba(0,255,85,0.1); border: 1px solid var(--win-color); box-shadow: 0 0 10px rgba(0,255,85,0.3);}
        
        .btn-toggle-partidas { background: rgba(0, 242, 254, 0.1); border: 1px solid var(--theme-primary); color: var(--theme-primary); width: 100%; padding: 15px; border-radius: 12px; font-family: 'Orbitron'; cursor: pointer; transition: 0.3s; font-weight: bold; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); margin-top: 5px; margin-bottom: 20px;}
        .btn-toggle-partidas:hover { background: var(--theme-primary); color: #000; box-shadow: 0 0 20px var(--theme-glow);}

        /* TABELA BRASILEIRÃO */
        .table-wrapper { overflow-x: auto; background: rgba(0,0,0,0.5); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px;}
        table { width: 100%; border-collapse: collapse; min-width: 500px;}
        th { background: rgba(255,255,255,0.05); padding: 12px 10px; color: #888; font-family: 'Orbitron'; font-size: 0.7rem; text-transform: uppercase; border-bottom: 2px solid rgba(255,255,255,0.1);}
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.02); font-family: 'Segoe UI'; font-size: 0.9rem; text-align: center; color: #ccc;}
        .col-left { text-align: left !important;}
        tr:nth-child(1) td, tr:nth-child(2) td { background: linear-gradient(90deg, rgba(0, 255, 85, 0.05), transparent); border-left: 3px solid var(--win-color); color: #fff; font-weight: bold;}

        /* CHAVEAMENTOS (MATA-MATA) - ULTRA COMPACTO */
        .bracket-scroll-area { display: flex; align-items: center; gap: 15px; padding: 15px 5px; overflow-x: auto; scrollbar-width: none; background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 100%); border-radius: 12px; margin-top: 15px; -webkit-overflow-scrolling: touch;}
        .bracket-scroll-area::-webkit-scrollbar { display: none; }
        .bracket-col { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; justify-content: space-around; position: relative;}
        
        .mini-match { background: rgba(10, 10, 20, 0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; width: 115px; position: relative; z-index: 2; box-shadow: 0 4px 8px rgba(0,0,0,0.6); overflow: hidden; }
        .mini-match-header { background: rgba(255,255,255,0.05); font-size: 0.5rem; text-align: center; padding: 4px 2px; color: #aaa; font-family: 'Orbitron'; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.05); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        .mini-team-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .mini-team-row:last-child { border-bottom: none; }
        
        .gamer-avatar { width: 14px; height: 14px; border-radius: 50%; object-fit: cover; margin-right: 4px; }
        .mini-team-name { font-family: 'Segoe UI'; font-size: 0.6rem; font-weight: bold; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1;}
        .mini-team-score { font-family: 'Orbitron'; font-size: 0.65rem; font-weight: bold; color: #888; background: rgba(255,255,255,0.05); padding: 1px 4px; border-radius: 4px; text-align: center; margin-left: 4px;}
        
        .mini-match .vencedor { background: linear-gradient(90deg, rgba(0, 255, 85, 0.1), transparent); border-left: 2px solid var(--win-color); }
        .mini-match .vencedor .mini-team-name { color: #fff; }
        .mini-match .vencedor .mini-team-score { color: #000; background: var(--win-color); box-shadow: 0 0 8px var(--win-color); }
        
        .mini-match.final { border: 1px solid var(--gold); transform: scale(1.05); box-shadow: 0 0 15px rgba(255,215,0,0.3); margin: 0 5px;}
        .mini-match.final .mini-match-header { background: rgba(255,215,0,0.15); color: var(--gold); font-weight: bold;}
        .mini-match.final .vencedor { border-left-color: var(--gold); background: linear-gradient(90deg, rgba(255, 215, 0, 0.15), transparent);}
        .mini-match.final .vencedor .mini-team-score { background: var(--gold); box-shadow: 0 0 10px var(--gold); }

        .bracket-col:not(:last-child) .mini-match::after { content: ''; position: absolute; right: -10px; top: 50%; width: 10px; height: 2px; background: rgba(255,255,255,0.15); z-index: 1;}
        .bracket-col:not(:first-child) .mini-match::before { content: ''; position: absolute; left: -10px; top: 50%; width: 10px; height: 2px; background: rgba(255,255,255,0.15); z-index: 1;}

        /* CARDS GAMER */
        .player-card { display: flex; align-items: center; background: rgba(0,0,0,0.5); padding: 10px 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05);}
        .player-rank { font-family: 'Orbitron'; font-size: 1.2rem; font-weight: bold; color: #555; width: 30px;}
        .player-photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #555; margin-right: 15px;}
        .player-details { flex-grow: 1;}
        .player-name { font-family: 'Segoe UI'; font-weight: bold; font-size: 1rem; color: #fff;}
        .player-team { font-size: 0.75rem; color: var(--theme-primary); text-transform: uppercase;}
        .player-stat { font-family: 'Orbitron'; font-size: 1.4rem; font-weight: bold;}
        .rank-1 { background: linear-gradient(90deg, rgba(255, 215, 0, 0.15), rgba(0,0,0,0.5)); border-color: var(--gold);}
        .rank-1 .player-rank { color: var(--gold); text-shadow: 0 0 10px var(--gold);}
        .rank-1 .player-photo { border-color: var(--gold); box-shadow: 0 0 15px var(--gold);}
        .rank-1 .player-stat { color: var(--gold); }
        .card-danger .player-stat { color: var(--danger-color); }
        .card-danger.rank-1 { background: linear-gradient(90deg, rgba(255, 0, 85, 0.15), rgba(0,0,0,0.5)); border-color: var(--danger-color);}
        .card-danger.rank-1 .player-rank, .card-danger.rank-1 .player-photo { color: var(--danger-color); border-color: var(--danger-color); text-shadow: 0 0 10px var(--danger-color); box-shadow: 0 0 15px var(--danger-color);}

        .btn-share-section { background: rgba(37, 211, 102, 0.1); border: 1px solid #25D366; color: #25D366; width: 100%; padding: 12px; border-radius: 8px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 15px; margin-bottom: 30px;}

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    </style>
</head>
<body>

    <div id="topbar-placeholder"></div>

    <!-- HEADER PÚBLICO -->
    <header id="header-aluno">
        <h1 style="color: #fff; font-family: 'Orbitron'; font-size: 1.2rem; margin-bottom: 5px;" id="escola-nome">Interclass Arena</h1>
        <div style="display: flex; justify-content: center; align-items: center; gap: 15px;">
            <div class="live-badge"><div class="live-dot"></div> AO VIVO</div>
            <span style="font-family: 'Segoe UI'; font-size: 0.75rem; color: #aaa;" id="last-update">Atualizado agora</span>
        </div>
    </header>

    <div style="max-width: 800px; margin: 0 auto; position: relative;">
        
        <!-- PAINEL DO PROFESSOR (COMPARTILHAMENTO) -->
        <div id="painel-professor">
            <h2 style="font-family: 'Orbitron'; color: #00ff55; font-size: 1.2rem; display: flex; align-items: center; gap: 10px;">📡 Central de Transmissão</h2>
            <p style="font-family: 'Segoe UI'; font-size: 0.85rem; color: #ccc; margin-top: 5px;">Compartilhe o link deste painel com os alunos. Eles verão a interface interativa e atualizada em tempo real.</p>
            <button class="btn-master-share" onclick="compartilharPainelGeral()">📲 ENVIAR LINK PARA OS ALUNOS</button>
        </div>

        <!-- SELETOR DE LOTE -->
        <div class="filtros-lote" id="filtros-lote"></div>

        <!-- SELETOR DE ESPORTE -->
        <div class="esportes-carousel" id="esportes-carousel">
            <p style="color:#888; font-size: 0.85rem; text-align: center; width: 100%;">Carregando esportes...</p>
        </div>

        <!-- NAVEGAÇÃO DE ABAS -->
        <div class="app-nav" id="app-nav"></div>

        <!-- CONTEÚDO: PARTIDAS -->
        <div id="tab-partidas" class="tab-content">
            <div id="container-partidas"><p style="text-align:center; color:#888;">Carregando partidas...</p></div>
        </div>

        <!-- CONTEÚDO: CLASSIFICAÇÃO / CHAVES -->
        <div id="tab-tabela" class="tab-content">
            <button class="btn-share-section" onclick="compartilharAba('Tabela / Chaveamento')">📲 Compartilhar no WhatsApp</button>
            <div id="container-tabela"></div>
        </div>

        <!-- CONTEÚDO: ESTATÍSTICAS (MVP/ARTILHARIA/VITÓRIAS) -->
        <div id="tab-stats" class="tab-content">
            <h3 id="titulo-stats" style="font-family: 'Orbitron'; color: var(--gold); font-size: 1.1rem; margin-bottom: 15px; text-shadow: 0 0 10px rgba(255,215,0,0.5);">⭐ Destaques</h3>
            <button class="btn-share-section" onclick="compartilharAba('Destaques do Campeonato')">📲 Compartilhar Top Players</button>
            <div id="container-stats" class="glass" style="padding: 15px;"></div>
        </div>

        <!-- CONTEÚDO: CARTÕES -->
        <div id="tab-cartoes" class="tab-content">
            <h3 style="font-family: 'Orbitron'; color: var(--danger-color); font-size: 1.1rem; margin-bottom: 15px; text-shadow: 0 0 10px rgba(255,0,85,0.5);">🟥 Quadro Disciplinar</h3>
            <div id="container-cartoes" class="glass" style="padding: 15px; border-color: rgba(255,0,85,0.2);"></div>
        </div>

    </div>

    <div id="footbar-placeholder"></div>

    <script>
        // ==========================================
        // CONFIGURAÇÕES GLOBAIS
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        let professorIdPublico = urlParams.get('ref');
        let isModoPublico = !!professorIdPublico;
        if (!isModoPublico) professorIdPublico = localStorage.getItem('profId') || localStorage.getItem('userId') || '1';
        
        let todosJogosGlobais = [];
        let relatoriosSalvos = {}; 
        let listaAlunosGlobais = [];
        
        let loteAtual = 'masculino';
        let esporteAtual = null;
        let isEsporteAtualIndividual = false;

        const iconesPontos = ['⚽', '🏀', '🏐', '🤾', '🎯', '🔥', '☄️', '🏓', '✅', '🥇', '🥈', '🥉', '🎮', '🧱'];
        const iconesFaltas = ['🛑', '🟨', '🟥', '✌️', '❌', '🕸️', '⚠️'];
        const esportesIndividuaisNomes = ['Xadrez', 'Tênis de Mesa', 'Dama', 'E-Sports', 'Natação', 'Atletismo'];
        const modalidadeDefs = [
            { id: 1, nome: 'Futsal', icone: '⚽' }, { id: 2, nome: 'Vôlei', icone: '🏐' }, { id: 3, nome: 'Basquete', icone: '🏀' }, 
            { id: 4, nome: 'Handebol', icone: '🤾' }, { id: 5, nome: 'Queimada', icone: '☄️' }, { id: 6, nome: 'Vôlei de Areia', icone: '🏖️' },
            { id: 7, nome: 'Natação', icone: '🏊' }, { id: 8, nome: 'Atletismo', icone: '🏃' }, { id: 9, nome: 'Tênis de Mesa', icone: '🏓' }, 
            { id: 10, nome: 'Xadrez', icone: '♟️' }, { id: 11, nome: 'Dama', icone: '🏁' }, { id: 12, nome: 'E-Sports', icone: '🎮' }
        ];

        window.onload = async () => {
            if (!isModoPublico) {
                fetch('/topbar.html').then(r => r.text()).then(h => document.getElementById('topbar-placeholder').innerHTML = h).catch(()=>{});
                fetch('/footbar.html').then(r => r.text()).then(h => document.getElementById('footbar-placeholder').innerHTML = h).catch(()=>{});
                document.getElementById('painel-professor').style.display = 'block';
                let storageRel = JSON.parse(localStorage.getItem('relatoriosPartidas')) || {};
                Object.assign(relatoriosSalvos, storageRel);
            } else {
                document.getElementById('header-aluno').style.display = 'block';
                let eNome = urlParams.get('e') || "Interclass Arena";
                document.getElementById('escola-nome').innerText = eNome.toUpperCase();

                setInterval(() => {
                    let data = new Date();
                    document.getElementById('last-update').innerText = `Atualizado às ${data.getHours().toString().padStart(2,'0')}:${data.getMinutes().toString().padStart(2,'0')}:${data.getSeconds().toString().padStart(2,'0')}`;
                }, 1000);
            }

            try {
                let urlAlunos = isModoPublico ? `/api/alunos/public/${professorIdPublico}` : '/api/alunos';
                let headers = isModoPublico ? {} : { 'Authorization': `Bearer ${localStorage.getItem('interclassToken')}` };
                const resAlunos = await fetch(urlAlunos, { headers });
                if (resAlunos.ok) listaAlunosGlobais = await resAlunos.json();
            } catch (error) { console.warn("Falha ao buscar alunos."); }

            montarFiltrosLote();
        };

        // ==========================================
        // EXTRAÇÃO DE ESPORTE E INTELIGÊNCIA
        // ==========================================
        function extrairEsporteNome(j) {
            if (!j) return "Geral";
            let valor = j.esporte || j.nomeEsporte;
            if (typeof valor === 'object' && valor !== null) valor = valor.nomeEsporte || valor.esporte || valor.nome;
            if (valor && typeof valor === 'string' && valor.trim() !== '' && valor !== '[object Object]' && valor !== 'undefined' && valor !== 'null') {
                return valor.trim();
            }
            if (j.modalidade && j.modalidade.nomeEsporte) return j.modalidade.nomeEsporte.trim();
            if (j.titulo) {
                for (let mod of modalidadeDefs) {
                    if (j.titulo.includes(mod.nome)) return mod.nome;
                }
            }
            return "Geral";
        }

        function obterPlacarSeguro(rel, jogo) {
            let pA = 0, pB = 0;
            if (rel) {
                if (rel.placar && typeof rel.placar.A !== 'undefined') { pA = rel.placar.A; pB = rel.placar.B; }
                else if (typeof rel.setsA !== 'undefined') { pA = rel.setsA; pB = rel.setsB; }
                else if (rel.placarFinal && typeof rel.placarFinal.A !== 'undefined') { pA = rel.placarFinal.A; pB = rel.placarFinal.B; }
                else if (rel.equipeA && typeof rel.equipeA.sets !== 'undefined') { pA = rel.equipeA.sets; pB = rel.equipeB.sets; }
                else { pA = jogo.placarA || 0; pB = jogo.placarB || 0; }
            } else { pA = jogo.placarA || 0; pB = jogo.placarB || 0; }
            return { A: parseInt(pA) || 0, B: parseInt(pB) || 0 };
        }

        // 🔥 CORREÇÃO: ISOLAMENTO TOTAL POR MODALIDADE (SEM VAZAMENTOS) 🔥
        function resolverNomesDinamicos(jogos) {
            let mapVencedores = {};
            
            jogos.forEach(j => {
                let espNome = extrairEsporteNome(j).toLowerCase();
                let numMatch = (j.titulo || "").match(/\(Jogo (\d+)\)/i);
                if (numMatch) {
                    let idJogoStr = numMatch[1];
                    let chaveVencedor = `${espNome}_${idJogoStr}`; // Ex: "xadrez_1", "futsal_1"
                    let rel = relatoriosSalvos[String(j.id)];
                    
                    if (rel || j.status === 'FINALIZADO') {
                        let p = obterPlacarSeguro(rel, j);
                        let c = (j.titulo || "").split(' | '); 
                        let idx = c.length >= 3 ? 2 : 1;
                        let pts = c[idx] ? c[idx].split(' x ') : [];
                        let eqA = j.equipeANome || (pts[0] ? pts[0].trim() : "Equipe A");
                        let eqB = j.equipeBNome || (pts[1] ? pts[1].trim() : "Equipe B");
                        eqA = eqA.replace(' (Série de Partidas)', '').trim();
                        eqB = eqB.replace(' (Série de Partidas)', '').trim();
                        
                        if (p.A > p.B) mapVencedores[chaveVencedor] = { nome: eqA, id: j.equipeAId };
                        else if (p.B > p.A) mapVencedores[chaveVencedor] = { nome: eqB, id: j.equipeBId };
                    }
                }
            });

            jogos.forEach(j => {
                let espNome = extrairEsporteNome(j).toLowerCase();
                let pts = (j.titulo || "").split(' | ');
                if (pts.length < 2) return;
                let idx = pts.length >= 3 ? 2 : 1;
                let c = pts[idx].split(' x ');
                let nA = j.equipeANome || c[0]?.trim();
                let nB = j.equipeBNome || c[1]?.trim();
                const regex = /(?:Vencedor do Jogo|Venc\.? Jogo) (\d+)/i;
                
                let mA = nA.match(regex);
                if (mA) {
                    let chaveA = `${espNome}_${mA[1]}`;
                    if (mapVencedores[chaveA]) {
                        nA = j.equipeANome = mapVencedores[chaveA].nome;
                        j.equipeAId = mapVencedores[chaveA].id;
                    }
                }
                let mB = nB.match(regex);
                if (mB) {
                    let chaveB = `${espNome}_${mB[1]}`;
                    if (mapVencedores[chaveB]) {
                        nB = j.equipeBNome = mapVencedores[chaveB].nome;
                        j.equipeBId = mapVencedores[chaveB].id;
                    }
                }
                
                let sufixo = pts[idx].includes('(Série de Partidas)') ? ' (Série de Partidas)' : '';
                pts[idx] = `${nA} x ${nB}${sufixo}`;
                j.titulo = pts.join(' | ');
            });
            return jogos;
        }

        function buscarAvatarGamer(nomeEquipe) {
            if (!listaAlunosGlobais || listaAlunosGlobais.length === 0) return '';
            if (!nomeEquipe || nomeEquipe.includes('Vencedor') || nomeEquipe.includes('A Definir') || nomeEquipe.includes('Colocado') || nomeEquipe.includes('Grupo')) return '';
            
            let aluno = listaAlunosGlobais.find(a => nomeEquipe.includes(a.nome.split(' ')[0]) || a.nome.includes(nomeEquipe.split(' (')[0]));
            if (aluno && aluno.fotoUrl) return `<img src="${aluno.fotoUrl}" class="gamer-avatar">`;
            return `<img src="https://ui-avatars.com/api/?name=${encodeURIComponent(nomeEquipe)}&background=333&color=fff&bold=true" class="gamer-avatar">`;
        }

        function extrairNomeLimpo(str) { return (str || "").replace(' (Série de Partidas)', '').trim(); }

        // ==========================================
        // FLUXO DE REQUISIÇÕES
        // ==========================================
        function montarFiltrosLote() {
            const container = document.getElementById('filtros-lote');
            ['masculino', 'feminino', 'misto'].forEach((gen, idx) => {
                let active = idx === 0 ? 'active' : '';
                container.innerHTML += `<button class="btn-lote ${active}" onclick="mudarLote('${gen}', this)">${gen}</button>`;
            });
            mudarLote('masculino', container.children[0]);
        }

        function mudarLote(genero, btnElement) {
            loteAtual = genero;
            document.querySelectorAll('.btn-lote').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            if(genero === 'feminino') document.documentElement.style.setProperty('--theme-primary', '#ff00de');
            else if(genero === 'misto') document.documentElement.style.setProperty('--theme-primary', '#b200ff');
            else document.documentElement.style.setProperty('--theme-primary', '#00f2fe');

            buscarDadosDaAPI();
        }

        async function buscarDadosDaAPI() {
            let jogos = [];
            try {
                let url = isModoPublico ? `/api/jogos/public/${professorIdPublico}/lote/${loteAtual}` : `/api/jogos/lote/${loteAtual}`;
                let headers = isModoPublico ? {} : { 'Authorization': `Bearer ${localStorage.getItem('interclassToken')}` };
                let res = await fetch(url, { headers });
                
                if (res.ok) jogos = await res.json(); 
                if (!jogos || jogos.length === 0) throw new Error('Vazio');
            } catch (error) {
                if (!isModoPublico) {
                    let calOffline = JSON.parse(localStorage.getItem('calendariosOficiais')) || {};
                    if (calOffline[loteAtual] && calOffline[loteAtual].jogos) jogos = calOffline[loteAtual].jogos;
                }
            }

            jogos.forEach(j => {
                if (j.status === 'FINALIZADO') {
                    if (!relatoriosSalvos[String(j.id)] || isModoPublico) relatoriosSalvos[String(j.id)] = { placar: { A: j.placarA||0, B: j.placarB||0 }, timeline: [] };
                } else { if (isModoPublico && relatoriosSalvos[String(j.id)]) delete relatoriosSalvos[String(j.id)]; }
            });

            todosJogosGlobais = resolverNomesDinamicos(jogos);
            montarCarrosselDeEsportes();
        }

        function montarCarrosselDeEsportes() {
            const container = document.getElementById('esportes-carousel');
            container.innerHTML = '';
            
            let esportesUnicos = [...new Set(todosJogosGlobais.map(j => extrairEsporteNome(j)))];
            
            if(esportesUnicos.length === 0) {
                container.innerHTML = `<p style="color:#888; font-size: 0.85rem; text-align: center; width: 100%;">Nenhum esporte programado nesta categoria.</p>`;
                document.getElementById('app-nav').innerHTML = '';
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                return;
            }

            esportesUnicos.forEach((nomeEsp, idx) => {
                let def = modalidadeDefs.find(m => m.nome.toLowerCase() === nomeEsp.toLowerCase()) || { icone: '🏅' };
                let active = idx === 0 ? 'active' : '';
                if(idx === 0) esporteAtual = nomeEsp;

                container.innerHTML += `
                    <button class="btn-esporte ${active}" onclick="mudarEsporte('${nomeEsp}', this)">
                        <div class="esporte-icon">${def.icone}</div>
                        <div class="esporte-name">${nomeEsp.toUpperCase()}</div>
                    </button>
                `;
            });
            mudarEsporte(esporteAtual, container.children[0]);
        }

        function mudarEsporte(nomeEsp, btnElement) {
            esporteAtual = nomeEsp;
            isEsporteAtualIndividual = esportesIndividuaisNomes.some(ei => ei.toLowerCase() === nomeEsp.toLowerCase());
            
            document.querySelectorAll('.btn-esporte').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            montarNavegacaoDeAbas();
            renderizarTodasAsAbas();
        }

        function montarNavegacaoDeAbas() {
            const nav = document.getElementById('app-nav');
            let html = `
                <button class="nav-btn active" onclick="switchTab('tab-partidas', this)">Partidas</button>
                <button class="nav-btn" onclick="switchTab('tab-tabela', this)">${isEsporteAtualIndividual ? 'Chaves' : 'Classificação'}</button>
                <button class="nav-btn" onclick="switchTab('tab-stats', this)">${isEsporteAtualIndividual ? '👑 Ranking' : '⚽ Artilharia'}</button>
            `;
            if(!isEsporteAtualIndividual) {
                html += `<button class="nav-btn" onclick="switchTab('tab-cartoes', this)">🟥 Punições</button>`;
            }
            nav.innerHTML = html;
            
            document.getElementById('titulo-stats').innerText = isEsporteAtualIndividual ? '👑 MVP / Histórico de Vitórias' : '⭐ Artilharia / Pontuadores';
            switchTab('tab-partidas', nav.children[0]);
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // ==========================================
        // RENDERIZAÇÃO ESPECÍFICA DO ESPORTE
        // ==========================================
        function renderizarTodasAsAbas() {
            let jogosDoEsporte = todosJogosGlobais.filter(j => extrairEsporteNome(j).toLowerCase() === esporteAtual.toLowerCase());
            
            // ------------------------------------------
            // ABA 1: PARTIDAS (ORDEM CRONOLÓGICA + ACORDEÃO)
            // ------------------------------------------
            const cPartidas = document.getElementById('container-partidas');
            
            jogosDoEsporte.sort((a,b) => {
                let dataA = a.diaId || a.dataJogo || "9999-99-99";
                let dataB = b.diaId || b.dataJogo || "9999-99-99";
                if (dataA !== dataB) return dataA.localeCompare(dataB);
                
                let horaA = a.hora || "99:99";
                let horaB = b.hora || "99:99";
                if (horaA !== horaB) return horaA.localeCompare(horaB);
                
                let numA = (a.titulo || '').match(/\(Jogo (\d+)\)/i);
                let numB = (b.titulo || '').match(/\(Jogo (\d+)\)/i);
                if(numA && numB) return parseInt(numA[1]) - parseInt(numB[1]);
                
                return a.id - b.id; 
            });

            let htmlVisiveis = '';
            let htmlOcultos = '';

            jogosDoEsporte.forEach((j, index) => {
                let rel = relatoriosSalvos[String(j.id)];
                let p = obterPlacarSeguro(rel, j);
                let isEncerrado = j.status === 'FINALIZADO' || rel;
                let winA = (isEncerrado && p.A > p.B) ? "winner" : "";
                let winB = (isEncerrado && p.B > p.A) ? "winner" : "";
                
                let tL = (j.titulo || "").split(' | ');
                let eqA = j.equipeANome || "Equipe A"; let eqB = j.equipeBNome || "Equipe B";
                let dataExibicao = (j.diaId || j.dataJogo || "").split('-').reverse().slice(0,2).join('/');

                let cardHtml = `
                    <div class="match-card">
                        <div class="match-header">
                            <span>📅 ${dataExibicao} ${j.hora ? 'às '+j.hora : ''} | ${tL[0]}</span> 
                            <span style="color:${isEncerrado?'#888':'var(--theme-primary)'}; font-weight: bold;">${isEncerrado?'ENCERRADO':'AGUARDANDO'}</span>
                        </div>
                        <div class="match-body">
                            <div class="team-info">
                                <div class="team-row ${winA}"><span class="team-name">${extrairNomeLimpo(eqA)}</span><span class="team-score">${isEncerrado?p.A:'-'}</span></div>
                                <div class="team-row ${winB}"><span class="team-name">${extrairNomeLimpo(eqB)}</span><span class="team-score">${isEncerrado?p.B:'-'}</span></div>
                            </div>
                        </div>
                    </div>
                `;
                
                if (index < 3) htmlVisiveis += cardHtml;
                else htmlOcultos += cardHtml;
            });

            if (htmlOcultos !== '') {
                cPartidas.innerHTML = `
                    ${htmlVisiveis}
                    <div id="partidas-ocultas" style="display: none;">${htmlOcultos}</div>
                    <button id="btn-toggle-partidas" class="btn-toggle-partidas" onclick="togglePartidas()">
                        <span>📅 VER TODAS AS ${jogosDoEsporte.length} PARTIDAS</span>
                        <span id="seta-partidas">▼</span>
                    </button>
                `;
            } else {
                cPartidas.innerHTML = htmlVisiveis || `<p style="text-align:center; color:#888;">Nenhuma partida encontrada.</p>`;
            }

            // ------------------------------------------
            // ABA 2: TABELA E CHAVES COMPACTAS
            // ------------------------------------------
            const cTabela = document.getElementById('container-tabela');
            cTabela.innerHTML = '';
            
            let isGruposLiga = jogosDoEsporte.some(j => { let t = (j.titulo||'').toUpperCase(); return t.includes('GRUPO') || t.includes('CLASSIFICAÇÃO') || t.includes('LIGA'); });
            
            if (isGruposLiga && !isEsporteAtualIndividual) {
                let tabela = {};
                jogosDoEsporte.forEach(j => {
                    let pts = (j.titulo || "").split(' | '); if(pts.length < 2) return;
                    let c = pts[pts.length-1].split(' x '); if(c.length < 2) return;
                    let tA = extrairNomeLimpo(c[0]); let tB = extrairNomeLimpo(c[1]);

                    if(!tA.includes('Vencedor') && !tA.includes('Definir')) { if(!tabela[tA]) tabela[tA] = {n: tA, pts:0, j:0, v:0, e:0, d:0, gp:0, gc:0}; }
                    if(!tB.includes('Vencedor') && !tB.includes('Definir')) { if(!tabela[tB]) tabela[tB] = {n: tB, pts:0, j:0, v:0, e:0, d:0, gp:0, gc:0}; }

                    let rel = relatoriosSalvos[String(j.id)];
                    if((j.status === 'FINALIZADO' || rel) && tabela[tA] && tabela[tB]) {
                        let p = obterPlacarSeguro(rel, j);
                        tabela[tA].j++; tabela[tB].j++;
                        tabela[tA].gp += p.A; tabela[tA].gc += p.B;
                        tabela[tB].gp += p.B; tabela[tB].gc += p.A;
                        if(p.A > p.B) { tabela[tA].v++; tabela[tB].d++; tabela[tA].pts+=3; }
                        else if(p.B > p.A) { tabela[tB].v++; tabela[tA].d++; tabela[tB].pts+=3; }
                        else { tabela[tA].e++; tabela[tB].e++; tabela[tA].pts++; tabela[tB].pts++; }
                    }
                });

                let ord = Object.values(tabela).sort((a,b) => b.pts !== a.pts ? b.pts - a.pts : (b.gp-b.gc) - (a.gp-a.gc));
                if(ord.length > 0) {
                    let linhas = ord.map((t, i) => `
                        <tr class="${i<2 ? 'linha-campeao' : ''}">
                            <td style="font-family:'Orbitron';">${i+1}º</td>
                            <td class="col-left">${t.n}</td>
                            <td style="color:var(--theme-primary); font-family:'Orbitron'; font-size:1.1rem;">${t.pts}</td>
                            <td>${t.j}</td><td>${t.v}</td><td>${t.e}</td><td>${t.d}</td><td>${t.gp}</td><td>${t.gc}</td>
                            <td style="color:${(t.gp-t.gc)>0?'#00ff55':((t.gp-t.gc)<0?'#ff0055':'#fff')}; font-weight:bold;">${(t.gp-t.gc)>0?'+'+(t.gp-t.gc):(t.gp-t.gc)}</td>
                        </tr>
                    `).join('');
                    cTabela.innerHTML = `<div class="table-wrapper"><table class="tabela-brasileirao"><thead><tr><th style="width:30px;">#</th><th class="col-left">Equipe</th><th>Pts</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th></tr></thead><tbody>${linhas}</tbody></table></div>`;
                }
            } 
            
            // CHAVEAMENTO ULTRA COMPACTO
            let fases = { 'OITAVAS': [], 'QUARTAS': [], 'SEMIFINAL': [], 'FINAL': [] };
            jogosDoEsporte.forEach(j => {
                let t = (j.titulo || '').toUpperCase();
                if(t.includes('OITAVAS')) fases['OITAVAS'].push(j);
                else if(t.includes('QUARTAS')) fases['QUARTAS'].push(j);
                else if(t.includes('SEMI')) fases['SEMIFINAL'].push(j);
                else if(t.includes('FINAL') && !t.includes('SEMI') && !t.includes('QUARTAS')) fases['FINAL'].push(j);
            });

            if (fases['FINAL'].length > 0 || fases['SEMIFINAL'].length > 0 || fases['QUARTAS'].length > 0) {
                let ext = (j) => {
                    if(!j) return {a:"A Definir", b:"A Definir", pA:"-", pB:"-", cA:"", cB:"", fA:"", fB:""};
                    let rel = relatoriosSalvos[String(j.id)]; 
                    let p = obterPlacarSeguro(rel, j);
                    let pts = (j.titulo||'').split(' | '); 
                    let c = pts[pts.length-1].split(' x ');
                    let eqA = extrairNomeLimpo(j.equipeANome || c[0] || "A Definir"); 
                    let eqB = extrairNomeLimpo(j.equipeBNome || c[1] || "A Definir");
                    let isE = j.status==='FINALIZADO' || rel;
                    return {
                        a: eqA, b: eqB,
                        pA: isE ? p.A : "-", pB: isE ? p.B : "-",
                        cA: (isE && p.A>p.B) ? "vencedor" : "", cB: (isE && p.B>p.A) ? "vencedor" : "",
                        fA: buscarAvatarGamer(eqA), fB: buscarAvatarGamer(eqB)
                    };
                };

                const renderFase = (listaJogos, isFinal = false) => {
                    if(listaJogos.length === 0) return '';
                    let html = `<div class="bracket-col">`;
                    listaJogos.forEach(j => {
                        let d = ext(j);
                        let tStr = (j.titulo||'').split(' | ')[0];
                        html += `
                            <div class="mini-match ${isFinal ? 'final' : ''}">
                                <div class="mini-match-header" title="${tStr}">${tStr}</div>
                                <div class="mini-team-row ${d.cA}">${d.fA}<span class="mini-team-name">${d.a}</span><span class="mini-team-score">${d.pA}</span></div>
                                <div class="mini-team-row ${d.cB}">${d.fB}<span class="mini-team-name">${d.b}</span><span class="mini-team-score">${d.pB}</span></div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                    return html;
                };

                cTabela.innerHTML += `
                    <div style="font-family: 'Orbitron'; color: var(--gold); margin-top: 10px; font-size: 0.9rem; text-shadow: 0 0 10px rgba(255,215,0,0.5); text-align: center;">⚔️ Caminho do Título</div>
                    <div class="bracket-scroll-area">
                        ${renderFase(fases['OITAVAS'])}
                        ${renderFase(fases['QUARTAS'])}
                        ${renderFase(fases['SEMIFINAL'])}
                        ${renderFase(fases['FINAL'], true)}
                    </div>
                `;
            }

            // ------------------------------------------
            // ABA 3: ESTATÍSTICAS E ABA 4: CARTÕES
            // ------------------------------------------
            let objPts = {}; let objFaltas = {};

            if(isEsporteAtualIndividual) {
                jogosDoEsporte.forEach(j => {
                    let rel = relatoriosSalvos[String(j.id)];
                    if(j.status === 'FINALIZADO' || rel) {
                        let p = obterPlacarSeguro(rel, j);
                        let c = (j.titulo||'').split(' | '); let pts = c[c.length-1].split(' x ');
                        let eqA = extrairNomeLimpo(j.equipeANome || pts[0]);
                        let eqB = extrairNomeLimpo(j.equipeBNome || pts[1]);
                        
                        if(!objPts[eqA]) objPts[eqA] = {n: eqA, e: esporteAtual, v: 0};
                        if(!objPts[eqB]) objPts[eqB] = {n: eqB, e: esporteAtual, v: 0};

                        if(p.A > p.B) objPts[eqA].v++;
                        else if(p.B > p.A) objPts[eqB].v++;
                    }
                });
            } else {
                jogosDoEsporte.forEach(j => {
                    let rel = relatoriosSalvos[String(j.id)];
                    if (rel && rel.timeline) {
                        rel.timeline.forEach(evt => {
                            if (!evt) return;
                            let txt = evt.txt || evt.texto || evt.descricao || "";
                            let nome = null;
                            if (txt.includes(': ')) nome = txt.split(': ')[1].trim(); 
                            else if (txt.includes('por ')) nome = txt.split('por ')[1].trim(); 
                            
                            if (nome) {
                                let ic = evt.icone || "";
                                let isP = iconesPontos.includes(ic) || iconesPontos.some(p => txt.includes(p));
                                let isF = iconesFaltas.includes(ic) || iconesFaltas.some(f => txt.includes(f));
                                
                                if (isP) { if(!objPts[nome]) objPts[nome] = {n:nome, v:0, e:j.esporte}; objPts[nome].v++; }
                                if (isF) { if(!objFaltas[nome]) objFaltas[nome] = {n:nome, v:0, e:j.esporte}; objFaltas[nome].v++; }
                            }
                        });
                    }
                });
            }

            const renderLista = (objMap, containerId, isDanger, isWinText) => {
                let arr = Object.values(objMap).filter(a => a.v > 0).sort((a,b) => b.v - a.v).slice(0, 10);
                let html = '';
                if(arr.length === 0) html = `<p style="text-align:center; color:#aaa; font-size:0.85rem;">Nenhum dado registrado na súmula.</p>`;
                
                arr.forEach((p, i) => {
                    let rClass = i === 0 ? 'rank-1' : '';
                    let cClass = isDanger ? 'card-danger' : '';
                    let vTxt = isWinText ? (p.v === 1 ? 'Vitória' : 'Vitórias') : '';
                    html += `
                        <div class="player-card ${rClass} ${cClass}">
                            <div class="player-rank">${i+1}º</div>
                            <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(p.n)}&background=222&color=fff&bold=true" class="player-photo">
                            <div class="player-details">
                                <div class="player-name">${p.n}</div>
                                <div class="player-team">${p.e}</div>
                            </div>
                            <div class="player-stat">${p.v} <span style="font-size:0.5rem;">${vTxt}</span></div>
                        </div>
                    `;
                });
                document.getElementById(containerId).innerHTML = html;
            };

            renderLista(objPts, 'container-stats', false, isEsporteAtualIndividual);
            if(!isEsporteAtualIndividual) renderLista(objFaltas, 'container-cartoes', true, false);
        }

        // ==========================================
        // ACORDEÃO E COMPARTILHAMENTO
        // ==========================================
        window.togglePartidas = function() {
            const divOculta = document.getElementById('partidas-ocultas');
            const btn = document.getElementById('btn-toggle-partidas');
            const seta = document.getElementById('seta-partidas');
            
            if(divOculta.style.display === 'none') {
                divOculta.style.display = 'block';
                btn.style.background = 'var(--theme-primary)';
                btn.style.color = '#000';
                if(seta) seta.innerText = '▲';
            } else {
                divOculta.style.display = 'none';
                btn.style.background = 'rgba(0, 242, 254, 0.1)';
                btn.style.color = 'var(--theme-primary)';
                if(seta) seta.innerText = '▼';
            }
        };

        function compartilharPainelGeral() {
            let pNome = localStorage.getItem('profNome') || "Professor";
            let pEscola = localStorage.getItem('profEscola') || "Escola";
            let link = `${window.location.origin}/resumo.html?ref=${professorIdPublico}&p=${encodeURIComponent(pNome)}&e=${encodeURIComponent(pEscola)}`;
            let txt = `🏆 *INTERCLASS ARENA AO VIVO* 🏆\n\nFala galera! Acompanhem os resultados, chaves e artilharia do campeonato em tempo real no nosso aplicativo web:\n\n👉 ${link}`;
            
            navigator.clipboard.writeText(txt).then(() => alert("✅ Link Copiado com Sucesso!\n\nCole no grupo do WhatsApp dos alunos:\n" + link));
        }

        function compartilharAba(tituloSecao) {
            let pNome = localStorage.getItem('profNome') || "Professor";
            let pEscola = localStorage.getItem('profEscola') || "Escola";
            let link = `${window.location.origin}/resumo.html?ref=${professorIdPublico}&p=${encodeURIComponent(pNome)}&e=${encodeURIComponent(pEscola)}`;
            let txt = `🏆 *INTERCLASS - ${esporteAtual.toUpperCase()}* 🏆\n\nAcompanhe a *${tituloSecao}* em tempo real:\n👉 ${link}`;
            
            if (navigator.share) {
                navigator.share({ title: `Interclass Arena`, text: txt, url: link }).catch(console.error);
            } else {
                navigator.clipboard.writeText(txt).then(() => alert("✅ Texto copiado! Cole no WhatsApp para enviar aos alunos."));
            }
        }
    </script>
</body>
</html>
