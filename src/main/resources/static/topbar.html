<!-- 🔥 CABEÇALHO OTIMIZADO PARA CELULARES COMPRIMIDOS 🔥 -->
<header class="game-header glass" style="border-radius: 15px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-left: 4px solid #00f2fe; position: relative; z-index: 9999;">
    
    <div style="flex: 1; min-width: 0; padding-right: 10px;"> <!-- min-width: 0 permite que o texto encolha sem quebrar a tela -->
        <h1 style="font-weight: 700; font-size: 1.15rem; text-transform: uppercase; letter-spacing: 1px; color: #00f2fe; text-shadow: 0 0 10px #00f2fe; margin:0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Interclass Arena</h1>
        <p class="escola-nome" id="escola-nome-top" style="font-size: 0.75rem; font-family: 'Segoe UI'; opacity: 0.7; margin:0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Carregando Instituição...</p>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
        
        <div id="header-stats" class="hide-on-mobile">
            <span style="color: #ff00de; font-weight: bold; font-family: 'Orbitron'; font-size: 0.75rem;">● AO VIVO</span>
        </div>

        <div style="position: relative;">
            
            <!-- Botão de perfil reduzido de 6px 16px para 4px 10px -->
            <div class="user-profile-btn" onclick="const d = document.getElementById('user-dropdown'); d.style.display = d.style.display === 'none' || d.style.display === '' ? 'block' : 'none'; event.stopPropagation();" style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 242, 254, 0.3); border-radius: 30px; transition: all 0.3s ease;">
                
                <!-- O nome do professor agora corta com "..." se for muito longo -->
                <span id="nome-professor-top" style="font-family: 'Segoe UI'; font-size: 0.85rem; font-weight: 600; color: #fff; max-width: 70px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Carregando...</span>
                
                <!-- Avatar reduzido de 38px para 30px -->
                <div style="width: 30px; height: 30px; border-radius: 50%; background: #00f2fe; display: flex; justify-content: center; align-items: center; font-size: 1rem; box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);">
                    👤
                </div>
            </div>

            <!-- O Dropdown do usuário continua idêntico aqui... -->
            <div id="user-dropdown" class="glass-dropdown" style="display: none;">
                <ul>
                    <li onclick="document.getElementById('user-dropdown').style.display='none'; document.getElementById('modal-pix-assinatura').style.display='flex';" style="flex-direction: column; align-items: flex-start; gap: 4px; padding-top: 15px; padding-bottom: 15px;">
                        <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                            <div style="display: flex; gap: 12px; align-items: center;"><span>💳</span> Assinatura</div>
                            <span class="badge-status status-ativo" id="badge-assinatura">ATIVO</span>
                        </div>
                        <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-left: 28px; font-family: 'Segoe UI';">Termina em: <span id="data-termino" style="color: #fff; font-weight: bold;">15/12/2026</span></div>
                    </li>
                    <li class="suporte-item" style="flex-direction: column; align-items: flex-start; cursor: default; gap: 10px;">
                        <div style="display: flex; gap: 12px; align-items: center; width: 100%;">
                            <span>❓</span> Suporte Técnico
                        </div>
                        <div style="display: flex; gap: 18px; margin-left: 28px;">
                            <a href="https://wa.me/5588996312358" target="_blank" title="Falar no WhatsApp" class="social-icon">💬</a>
                            <a href="https://instagram.com/FutSumulaPro" target="_blank" title="Siga no Instagram" class="social-icon">📸</a>
                            <a href="mailto:fut_sumula_pro@hotmail.com" title="Enviar E-mail" class="social-icon">📧</a>
                        </div>
                    </li>
                    <li onclick="document.getElementById('user-dropdown').style.display='none'; document.getElementById('modal-reset-sistema').style.display='flex';">
                        <span style="color: #ff0055;">⚠️</span> <span style="color: #ffccdd;">Zerar Temporada</span>
                    </li>
                    <li onclick="if(confirm('Deseja realmente sair da plataforma?')) { localStorage.clear(); window.location.href = '/index.html'; }" class="logout-btn">
                        <span>🚪</span> Sair
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Script de dados e reset mantido intacto -->
    <img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" style="display:none;" onload="
        try {
            let nomeProf = localStorage.getItem('profNome');
            let nomeEscola = localStorage.getItem('profEscola');
            if(nomeProf) {
                document.getElementById('escola-nome-top').textContent = nomeEscola;
                document.getElementById('nome-professor-top').textContent = 'Prof. ' + nomeProf.split(' ')[0];
            } else {
                document.getElementById('escola-nome-top').textContent = 'Colégio Interclass';
                document.getElementById('nome-professor-top').textContent = 'Sessão Expirada';
            }
            window.executarResetDeTemporada = async function() {
                let confirmacao = prompt('Tem certeza absoluta?\\nDigite ZERAR na caixa abaixo para confirmar a destruição de todos os dados do torneio:');
                if(confirmacao !== 'ZERAR' && confirmacao !== 'zerar') {
                    alert('Ação cancelada de forma segura.'); return;
                }
                const btn = document.getElementById('btn-executar-reset');
                btn.innerHTML = '⏳ Varrendo Banco...'; btn.disabled = true;
                const token = localStorage.getItem('interclassToken');
                try {
                    const resposta = await fetch('/api/setup/reset', { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                    if(resposta.ok) {
                        const t = localStorage.getItem('interclassToken');
                        const pid = localStorage.getItem('profId');
                        const pNome = localStorage.getItem('profNome');
                        const pEscola = localStorage.getItem('profEscola');
                        const isM = localStorage.getItem('isMasterAdmin');
                        localStorage.clear();
                        localStorage.setItem('interclassToken', t);
                        localStorage.setItem('profId', pid);
                        localStorage.setItem('profNome', pNome);
                        localStorage.setItem('profEscola', pEscola);
                        if(isM) localStorage.setItem('isMasterAdmin', isM);
                        alert('♻️ RECOMEÇO PRONTO! O seu aplicativo foi completamente zerado. Bem-vindo à nova Temporada Interclass!');
                        window.location.href = '/dashboard.html';
                    } else {
                        alert('Erro ao tentar limpar a base de dados. Tente novamente mais tarde.');
                        btn.innerHTML = 'Sim, Apagar Tudo'; btn.disabled = false;
                    }
                } catch(e) {
                    alert('Erro de conexão. Verifique o servidor.');
                    btn.innerHTML = 'Sim, Apagar Tudo'; btn.disabled = false;
                }
            };
        } catch(e) { console.error('Erro na barra superior:', e); }
    ">
</header>
