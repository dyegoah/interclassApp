<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestão de Alunos - InterclassApp</title>
    
	<link rel="stylesheet" href="/estilo-global.css">
	<script src="/seguranca.js"></script>

	<link rel="manifest" href="/manifest.json">
	<meta name="theme-color" content="#05050f">
	<link rel="apple-touch-icon" href="/img/icon-192x192.png">
    <style>
        :root { --theme-primary: #00f2fe; --theme-glow: rgba(0, 242, 254, 0.5); --bg-gradient: linear-gradient(-45deg, #020111, #191970, #000000, #4b0082); }
        body.theme-fem { --theme-primary: #ff00de; --theme-glow: rgba(255, 0, 222, 0.5); }
        body.theme-misto { --theme-primary: #b200ff; --theme-glow: rgba(178, 0, 255, 0.5); }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', 'Segoe UI', sans-serif; }
        
        body { 
            background: 
                radial-gradient(circle at 50% 0%, var(--theme-glow, rgba(0, 242, 254, 0.15)) 0%, transparent 60%),
                linear-gradient(to bottom, rgba(2, 1, 15, 0.85), rgba(2, 1, 15, 0.98)), 
                url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed !important;
            background-size: cover !important; color: #ffffff; min-height: 100vh; margin: 0; padding-bottom: 100px; overflow-x: hidden; transition: background 0.5s ease;
        }

        .arena-container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); padding: 2rem; border-top: 4px solid var(--theme-primary); transition: border-color 0.5s ease; }
        
        .section-title { text-transform: uppercase; font-size: 1.5rem; margin-bottom: 5px; color: var(--theme-primary); text-shadow: 0 0 10px var(--theme-glow); display: flex; align-items: center; gap: 10px; transition: color 0.5s ease, text-shadow 0.5s ease; }
        .subtitle { font-family: 'Segoe UI'; color: rgba(255,255,255,0.7); margin-bottom: 1rem; font-size: 0.95rem; }

        .btn-acao { background: var(--theme-primary); color: #000; border: none; padding: 10px 20px; border-radius: 30px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; font-family: 'Orbitron'; font-size: 0.8rem; }
        .btn-acao:hover { box-shadow: 0 0 20px var(--theme-glow); background: #fff; color: #000; }
        
        /* 🔥 BOTÕES DE EXCLUSÃO 🔥 */
        .btn-excluir { background: transparent; border: 1px solid #ff0055; color: #ff0055; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .btn-excluir:hover { background: rgba(255,0,85,0.2); box-shadow: 0 0 10px rgba(255,0,85,0.5); transform: scale(1.05); }

        .total-geral-badge { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--theme-primary); color: #fff; padding: 10px 20px; border-radius: 30px; font-family: 'Orbitron'; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; box-shadow: 0 0 15px var(--theme-glow); transition: all 0.3s ease; }
        .input-dark { width: 100%; padding: 15px 20px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 30px; color: white; font-family: 'Segoe UI'; font-size: 1rem; outline: none; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .input-dark:focus { border-color: var(--theme-primary); box-shadow: 0 0 15px var(--theme-glow); background: rgba(0,0,0,0.8); }

        .tabs-container { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; -webkit-overflow-scrolling: touch; }
        .tab-btn { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); padding: 0 20px; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-family: 'Orbitron'; font-size: 0.85rem; transition: 0.3s; white-space: nowrap; flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 40px; }
        #tab-masculino { color: #00f2fe; }
        #tab-feminino { color: #ff00de; }
        #tab-misto { color: #b200ff; }
        .tab-count { font-size: 0.75rem; opacity: 0.8; font-family: 'Segoe UI'; font-weight: normal; margin-left: 5px; }

        .resumo-esportes { margin-bottom: 1rem; background: rgba(0,0,0,0.3); padding: 1.5rem; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .badge-sport-summary { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); padding: 8px 18px; border-radius: 25px; font-size: 0.9rem; font-family: 'Segoe UI'; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.8); }
        .badge-sport-summary:hover { border-color: var(--theme-primary); background: rgba(255, 255, 255, 0.1); color: #fff; }
        .badge-sport-summary.active { border-color: var(--theme-primary); background: rgba(0, 242, 254, 0.1); color: #fff; box-shadow: 0 0 15px var(--theme-glow); }

        .sport-details-box { background: rgba(0,0,0,0.4); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); border-left: 4px solid var(--theme-primary); padding: 1.5rem; margin-bottom: 2rem; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .sub-section-title { font-family: 'Orbitron'; font-size: 1.1rem; color: var(--theme-primary); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; text-shadow: 0 0 8px var(--theme-glow);}
        
        .equipes-scroll-container { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .equipes-scroll-container::-webkit-scrollbar { height: 8px; }
        .equipes-scroll-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 4px; }
        .equipes-scroll-container::-webkit-scrollbar-thumb { background: var(--theme-primary); border-radius: 4px; }

        .equipe-summary-card { min-width: 140px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px 10px; text-align: center; display: flex; flex-direction: column; align-items: center; border-top: 4px solid #555; transition: 0.3s; }
        .equipe-summary-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.05); box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        .eq-turma { font-family: 'Segoe UI'; font-size: 1.2rem; font-weight: bold; color: #fff; margin-bottom: 10px; white-space: nowrap;}
        .eq-count-badge { font-family: 'Orbitron'; font-weight: bold; font-size: 1.1rem; border: 1px solid; border-radius: 20px; padding: 4px 15px; background: rgba(0,0,0,0.4); display: inline-block; }

        /* 🔥 AJUSTES DO CARD DE ATLETAS PARA CABER O CHECKBOX 🔥 */
        .grid-alunos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 2rem;}
        .aluno-card { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 15px; padding-left: 45px; display: flex; align-items: center; gap: 15px; transition: 0.3s; position: relative; overflow: hidden; }
        .aluno-card:hover { border-color: var(--theme-primary); background: rgba(255, 255, 255, 0.05); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        .aluno-checkbox { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; cursor: pointer; accent-color: #ff0055; z-index: 10; }

        .insta-foto { width: 60px; height: 60px; border-radius: 50%; padding: 3px; object-fit: cover; background-color: #222; }
        .insta-masculino { background: linear-gradient(45deg, #00f2fe, #4facfe); }
        .insta-feminino { background: linear-gradient(45deg, #ff00de, #ff73ea); }
        .insta-misto { background: linear-gradient(45deg, #00f2fe, #ff00de); }
        
        .aluno-info { flex-grow: 1; overflow: hidden; }
        .aluno-nome { font-weight: bold; color: #fff; font-size: 1rem; margin-bottom: 3px; font-family: 'Segoe UI'; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .aluno-detalhes { font-size: 0.8rem; color: rgba(255,255,255,0.6); font-family: 'Segoe UI'; line-height: 1.4; }
        .badge-esporte { background: rgba(255, 255, 255, 0.05); color: var(--theme-primary); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.2); display: inline-block; margin-top: 5px; }

        .paginacao-container { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem; }
        .btn-page { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-family: 'Orbitron'; font-weight: bold;}
        .btn-page:hover:not(:disabled) { background: rgba(255,255,255,0.15); border-color: var(--theme-primary); }
        .btn-page.active { background: var(--theme-primary); color: #000; border-color: var(--theme-primary); box-shadow: 0 0 15px var(--theme-glow); }
        .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }

        /* 🔥 BARRA DE AÇÃO EM MASSA 🔥 */
        .barra-acao-massa { display: none; justify-content: space-between; align-items: center; background: rgba(255, 0, 85, 0.15); border: 1px solid #ff0055; border-radius: 10px; padding: 15px 20px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(255,0,85,0.3); animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 900px) {
            .grid-alunos { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .aluno-card { flex-direction: column; text-align: center; padding: 15px 10px 10px 10px; }
            .aluno-checkbox { top: 10px; left: 10px; transform: none; }
            .btn-excluir { position: absolute; top: 5px; right: 5px; padding: 5px; }
            .insta-foto { width: 50px; height: 50px; margin: 0 auto; }
            .aluno-info { width: 100%; }
        }

        @media (max-width: 600px) {
            .arena-container { padding: 10px; }
            .glass { padding: 15px; } 
            .section-title { font-size: 1.1rem; }
            .subtitle { font-size: 0.8rem; }
            .btn-acao { width: 100%; text-align: center; margin-top: 10px; }
            .grid-alunos { grid-template-columns: repeat(2, 1fr); }
            .barra-acao-massa { flex-direction: column; gap: 15px; text-align: center; }
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    </style>
</head>
<body>
    <div class="arena-container">
        <div id="topbar-placeholder"></div>

        <div class="glass">
            <!-- 🔥 TOPO COM O BOTÃO DE GERAR PDF ADICIONADO AQUI 🔥 -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 15px; margin-bottom: 1.5rem;">
                <div>
                    <h2 class="section-title">👥 Gestão de Atletas</h2>
                    <p class="subtitle">Acompanhe as inscrições e gere torneios rapidamente.</p>
                </div>
                
                <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                    <div id="badge-total-geral" class="total-geral-badge" style="display: none;">
                        🏆 Total Geral: <b id="valor-total-geral" style="color: var(--theme-primary);">0</b>
                    </div>
                    
                    <button class="btn-acao" style="background: #fff; color: #000; padding: 10px 15px; box-shadow: 0 0 15px rgba(255,255,255,0.3);" onclick="gerarPDFAlunos()">📄 Gerar PDF</button>

                    <button class="btn-acao" onclick="window.location.href='/dashboard.html'">🡨 Voltar ao Painel</button>
                </div>
            </div>

            <div class="tabs-container">
                <button class="tab-btn active" id="tab-masculino" onclick="mudarAba('masculino')">
                    LOTE: MASCULINO <span class="tab-count" id="count-masc">(0)</span>
                </button>
                <button class="tab-btn" id="tab-feminino" onclick="mudarAba('feminino')">
                    LOTE: FEMININO <span class="tab-count" id="count-fem">(0)</span>
                </button>
                <button class="tab-btn" id="tab-misto" onclick="mudarAba('misto')">
                    LOTE: MISTO <span class="tab-count" id="count-misto">(0)</span>
                </button>
            </div>

            <div id="resumo-container" class="resumo-esportes" style="display: none;"></div>
            <div id="sport-details-container" style="display: none;"></div>

			<div style="margin-bottom: 1.5rem; position: relative; display: flex; align-items: center;">
                <input type="text" id="input-busca" class="input-dark" placeholder="🔍 Buscar por Nome do Aluno, Turma ou Modalidade..." onkeyup="realizarBusca()" style="padding-right: 45px;">
                <button id="btn-limpar-busca" onclick="limparBusca()" style="display: none; position: absolute; right: 15px; background: transparent; border: none; color: var(--theme-primary); font-size: 1.5rem; cursor: pointer; transition: 0.3s; font-weight: bold;" title="Limpar Seleção">&times;</button>
            </div>
			
            <div id="loading-alunos" style="text-align: center; padding: 2rem; color: var(--theme-primary);">
                ⏳ Conectando ao Banco de Dados Seguro...
            </div>

            <!-- 🔥 BARRA FLUTUANTE DE EXCLUSÃO EM MASSA 🔥 -->
            <div id="barra-acao-massa" class="barra-acao-massa">
                <div style="font-family: 'Orbitron'; font-weight: bold; color: #ffccdd;">
                    🗑️ <span id="texto-qtd-selecionados">0</span> Atleta(s) Selecionado(s)
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-page" onclick="limparSelecoesGlobais()">Cancelar</button>
                    <button class="btn-acao" style="background: #ff0055; color: #fff; box-shadow: 0 0 15px rgba(255,0,85,0.5);" onclick="excluirAlunosEmMassa()">Excluir Selecionados</button>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; margin-bottom: 15px;">
                <h4 class="sub-section-title" id="titulo-lista-alunos" style="display: none; margin: 0; border: none; font-family: 'Segoe UI'; font-size: 1rem; color: rgba(255,255,255,0.7);">📋 Lista de Inscrições Individuais</h4>
            </div>

            <div class="grid-alunos" id="grid-alunos" style="display: none;"></div>
            <div id="paginacao-container" class="paginacao-container"></div>
        </div>
    </div>
    
    <script>
        const modalidadeDefs = [
            { id: 1, nome: 'Futsal', icone: '⚽' }, { id: 2, nome: 'Vôlei', icone: '🏐' },
            { id: 3, nome: 'Basquete', icone: '🏀' }, { id: 4, nome: 'Handebol', icone: '🤾' },
            { id: 5, nome: 'Queimada', icone: '☄️' }, { id: 6, nome: 'Vôlei de Areia', icone: '🏖️' },
            { id: 7, nome: 'Natação', icone: '🏊' }, { id: 8, nome: 'Atletismo', icone: '🏃' },
            { id: 9, nome: 'Tênis de Mesa', icone: '🏓' }, { id: 10, nome: 'Xadrez', icone: '♟️' },
            { id: 11, nome: 'Dama', icone: '🏁' }, { id: 12, nome: 'E-Sports', icone: '🎮' }
        ];

		const minJogadoresPorEsporte = { 
            'Futsal': 5, 'Vôlei': 6, 'Basquete': 5, 'Handebol': 7, 'Queimada': 6, 'Vôlei de Areia': 2,
            'Tênis de Mesa': 1, 'Xadrez': 1, 'Dama': 1, 'E-Sports': 1, 'Natação': 1, 'Atletismo': 1 
        };

        let listaAlunosBase = []; 
        let generoAtual = 'masculino';
        let alunosFiltradosGlobais = [];
        let paginaAtual = 1;
        const itensPorPagina = 9;
        let esporteAbaSelecionada = null;
        
        // 🔥 CONTROLE DE ALUNOS SELECIONADOS PARA EXCLUSÃO 🔥
        let alunosSelecionadosParaExclusao = new Set();

        window.onload = async () => {
            fetch('/topbar.html').then(r => r.text()).then(h => document.getElementById('topbar-placeholder').innerHTML = h).catch(()=>{});
            await buscarAlunosDoServidor();
        };

        async function buscarAlunosDoServidor() {
            try {
                const token = localStorage.getItem('interclassToken');
                const response = await fetch('/api/alunos', { method: 'GET', headers: { 'Authorization': `Bearer ${token}` } });
                if (response.ok) {
                    listaAlunosBase = await response.json();
                    document.getElementById('loading-alunos').style.display = 'none';
                    atualizarContadoresGerais(); mudarAba(generoAtual); 
                } else { document.getElementById('loading-alunos').innerHTML = `❌ Falha de Autenticação.`; }
            } catch (error) { document.getElementById('loading-alunos').innerHTML = `🚨 Erro de conexão com o servidor.`; }
        }

        function atualizarContadoresGerais() {
            document.getElementById('badge-total-geral').style.display = 'flex';
            document.getElementById('valor-total-geral').innerText = listaAlunosBase.length;
            document.getElementById('count-masc').innerText = `(${listaAlunosBase.filter(a => a.genero === 'masculino').length})`;
            document.getElementById('count-fem').innerText = `(${listaAlunosBase.filter(a => a.genero === 'feminino').length})`;
            document.getElementById('count-misto').innerText = `(${listaAlunosBase.filter(a => a.genero === 'misto').length})`;
        }

		function mudarAba(genero) {
            generoAtual = genero; 
            paginaAtual = 1; 
            esporteAbaSelecionada = null; 
            limparSelecoesGlobais(); // 🔥 Limpa a seleção ao trocar de lote
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.style.borderBottom = 'none';
                btn.style.fontWeight = 'normal';
                btn.style.background = 'rgba(0,0,0,0.5)';
            });

            let corTema = genero === 'masculino' ? '#00f2fe' : (genero === 'feminino' ? '#ff00de' : '#b200ff');
            
            const btnAtivo = document.getElementById(`tab-${genero}`);
            if(btnAtivo) {
                btnAtivo.classList.add('active');
                btnAtivo.style.borderBottom = `3px solid ${corTema}`;
                btnAtivo.style.fontWeight = 'bold';
                btnAtivo.style.background = 'rgba(255,255,255,0.1)';
            }

            const body = document.body;
            body.classList.remove('theme-fem', 'theme-misto');
            if (genero === 'feminino') body.classList.add('theme-fem');
            if (genero === 'misto') body.classList.add('theme-misto');
            
            aplicarFiltrosEPaginacao();
        }

        function realizarBusca() { 
            paginaAtual = 1; 
            const inputBusca = document.getElementById('input-busca');
            const btnLimpar = document.getElementById('btn-limpar-busca');
            btnLimpar.style.display = inputBusca.value.trim() !== "" ? 'block' : 'none';
            aplicarFiltrosEPaginacao(); 
        }

        function limparBusca() {
            document.getElementById('input-busca').value = "";
            realizarBusca();
        }

        function aplicarFiltrosEPaginacao() {
            let filtrados = listaAlunosBase.filter(a => a.genero === generoAtual);
            const tBusca = document.getElementById('input-busca') ? document.getElementById('input-busca').value.toLowerCase() : "";
            if (tBusca !== "") filtrados = filtrados.filter(a => a.nome.toLowerCase().includes(tBusca) || a.turma.toLowerCase().includes(tBusca) || (a.esporte && a.esporte.toLowerCase().includes(tBusca)));
            alunosFiltradosGlobais = filtrados;
            renderizarPainelEsportes(alunosFiltradosGlobais);
            renderizarGridPaginado();
        }

        function renderizarPainelEsportes(filtrados) {
            const container = document.getElementById('resumo-container');
            const detailsContainer = document.getElementById('sport-details-container');
            if (filtrados.length === 0) { container.style.display = 'none'; detailsContainer.style.display = 'none'; return; }
            container.style.display = 'block';
            let contagem = {};
            filtrados.forEach(a => {
                const chave = a.esporte;
                if(!contagem[chave]) contagem[chave] = { nome: a.esporte, icone: a.iconeEsporte || '🏅', count: 0, alunos: [] };
                contagem[chave].count++; contagem[chave].alunos.push(a);
            });
            if (!esporteAbaSelecionada || !contagem[esporteAbaSelecionada]) esporteAbaSelecionada = Object.keys(contagem)[0]; 

            let htmlTabs = `<p style="font-family: 'Segoe UI'; font-size: 0.95rem; color: rgba(255,255,255,0.7); margin-bottom: 15px;">💡 Selecione uma modalidade abaixo para ver as turmas formadas e iniciar a criação do torneio:</p><div style="display: flex; flex-wrap: wrap; gap: 10px;">`;
            for (let chave in contagem) {
                let esp = contagem[chave];
                htmlTabs += `<div class="badge-sport-summary ${esporteAbaSelecionada === esp.nome ? 'active' : ''}" onclick="clicarAbaEsporte('${esp.nome}')">${esp.icone} ${esp.nome} <b style="color: #fff; margin-left: 5px;">(${esp.count})</b></div>`;
            }
            container.innerHTML = htmlTabs + `</div>`;
            if (esporteAbaSelecionada && contagem[esporteAbaSelecionada]) renderizarGavetaDoEsporte(esporteAbaSelecionada, contagem[esporteAbaSelecionada].alunos);
        }

        function clicarAbaEsporte(nome) { esporteAbaSelecionada = nome; aplicarFiltrosEPaginacao(); }

        function renderizarGavetaDoEsporte(nomeEsporte, alunosDoEsporte) {
            const detailsContainer = document.getElementById('sport-details-container'); detailsContainer.style.display = 'block';
            let equipes = {};
            alunosDoEsporte.forEach(a => { if (!equipes[a.turma]) equipes[a.turma] = { turma: a.turma, count: 0 }; equipes[a.turma].count++; });
            let arrEq = Object.values(equipes).sort((a, b) => a.turma.localeCompare(b.turma));
            let minExigido = minJogadoresPorEsporte[nomeEsporte] || 2; 

            let htmlEq = '';
			arrEq.forEach(eq => {
                let corStatus = eq.count >= minExigido ? '#00ff00' : (eq.count >= (minExigido / 2) ? '#ffd700' : '#ff0055');
                htmlEq += `<div class="equipe-summary-card" style="border-top-color: ${corStatus}; cursor: pointer;" onclick="filtrarAlunosPorTurma('${eq.turma}')" title="Ver alunos desta turma">
                    <div class="eq-turma">${eq.turma}</div>
                    <div class="eq-count-badge" style="color: ${corStatus}; border-color: ${corStatus}; box-shadow: 0 0 10px rgba(${corStatus === '#00ff00' ? '0,255,0' : (corStatus === '#ffd700' ? '255,215,0' : '255,0,85')}, 0.2);">${eq.count} <span style="font-size:0.65rem; color:#ccc; font-weight:normal;">/ ${minExigido}</span></div>
                </div>`;
            });
            let ic = modalidadeDefs.find(m => m.nome === nomeEsporte)?.icone || '🏅';
            detailsContainer.innerHTML = `<div class="sport-details-box"><div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 1.5rem; gap: 15px;"><h4 class="sub-section-title" style="margin: 0; border: none;">${ic} Status das Turmas (${nomeEsporte})</h4><button class="btn-acao" onclick="iniciarSetupDoEsporte('${nomeEsporte}')" style="box-shadow: 0 0 15px var(--theme-glow);">⚙️ Criar Torneio ➔</button></div><div class="equipes-scroll-container">${htmlEq}</div></div>`;
        }
		
		function filtrarAlunosPorTurma(turma) {
            const inputBusca = document.getElementById('input-busca');
            inputBusca.value = turma;
            realizarBusca();
            document.getElementById('titulo-lista-alunos').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

		function iniciarSetupDoEsporte(nomeEsporte) {
		    const defEsporte = modalidadeDefs.find(m => m.nome === nomeEsporte);
		    
		    // 🔥 CORREÇÃO 1: Salvando o NOME do esporte explícito para evitar a "Modalidade Desconhecida"
		    localStorage.setItem('arenaSetup', JSON.stringify({ 
		        genero: generoAtual, 
		        nomeEsporte: nomeEsporte, // O segredo está aqui! O nome agora viaja junto.
		        esportes: [ { id: defEsporte ? defEsporte.id : 99, nome: nomeEsporte, configurado: false } ] 
		    }));
		    
		    window.location.href = '/torneios.html';
		}

        function renderizarGridPaginado() {
            const container = document.getElementById('grid-alunos');
            const tituloLista = document.getElementById('titulo-lista-alunos');
            container.innerHTML = '';
            
            if (alunosFiltradosGlobais.length === 0) {
                container.style.display = 'block'; tituloLista.style.display = 'none';
                container.innerHTML = `<p style="text-align: center; color: rgba(255,255,255,0.5); padding: 3rem 0;">Nenhum atleta na categoria ${generoAtual.toUpperCase()}.</p>`;
                document.getElementById('paginacao-container').innerHTML = ''; return;
            }

            container.style.display = 'grid'; tituloLista.style.display = 'block';
            const totalPaginas = Math.ceil(alunosFiltradosGlobais.length / itensPorPagina);
            const alunosPaginaAtual = alunosFiltradosGlobais.slice((paginaAtual - 1) * itensPorPagina, ((paginaAtual - 1) * itensPorPagina) + itensPorPagina);

            alunosPaginaAtual.forEach(aluno => {
                let fotoSegura = aluno.fotoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(aluno.nome)}&background=222&color=fff`;
                let instaColorClass = `insta-${aluno.genero}`;
                // Mantém a seleção (checkbox) marcada mesmo mudando de página
                let isChecked = alunosSelecionadosParaExclusao.has(aluno.hashPublico) ? 'checked' : '';

                container.innerHTML += `
                    <div class="aluno-card" id="card-aluno-${aluno.hashPublico}">
                        <input type="checkbox" class="aluno-checkbox" onchange="toggleSelecaoExclusao('${aluno.hashPublico}')" ${isChecked} title="Selecionar para exclusão">
                        <img src="${fotoSegura}" class="aluno-foto insta-foto ${instaColorClass}" alt="Foto Atleta">
                        <div class="aluno-info">
                            <div class="aluno-nome" title="${aluno.nome}">${aluno.nome}</div>
                            <div class="aluno-detalhes">Turma: ${aluno.turma}</div>
                            <div class="badge-esporte">${aluno.iconeEsporte || '🏅'} ${aluno.esporte}</div>
                        </div>
                        <button class="btn-excluir" onclick="excluirAlunoIndividual('${aluno.hashPublico}', '${aluno.nome}')" title="Excluir Atleta">🗑️</button>
                    </div>
                `;
            });

            renderizarControlesPaginacao(totalPaginas);
        }

        // 🔥 FUNÇÕES DE EXCLUSÃO 🔥

        // Adiciona ou remove da lista de selecionados
        function toggleSelecaoExclusao(hashPublico) {
            if (alunosSelecionadosParaExclusao.has(hashPublico)) {
                alunosSelecionadosParaExclusao.delete(hashPublico);
            } else {
                alunosSelecionadosParaExclusao.add(hashPublico);
            }
            atualizarBarraAcaoMassa();
        }

        function limparSelecoesGlobais() {
            alunosSelecionadosParaExclusao.clear();
            atualizarBarraAcaoMassa();
            renderizarGridPaginado(); // Desmarca todos visualmente
        }

        // Mostra a barra flutuante se houver atletas selecionados
        function atualizarBarraAcaoMassa() {
            const barra = document.getElementById('barra-acao-massa');
            const txtQtd = document.getElementById('texto-qtd-selecionados');
            if (alunosSelecionadosParaExclusao.size > 0) {
                barra.style.display = 'flex';
                txtQtd.innerText = alunosSelecionadosParaExclusao.size;
            } else {
                barra.style.display = 'none';
            }
        }

        // Exclusão Individual (Botão da Lixeira no Card)
        async function excluirAlunoIndividual(hashPublico, nome) {
            if (!confirm(`⚠️ Tem certeza que deseja EXCLUIR permanentemente o atleta: ${nome}?`)) return;
            
            const token = localStorage.getItem('interclassToken');
            try {
                const res = await fetch(`/api/alunos/${hashPublico}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    alunosSelecionadosParaExclusao.delete(hashPublico); // Limpa da lista se estivesse marcado
                    await buscarAlunosDoServidor(); // Atualiza tudo do banco
                } else {
                    alert("❌ Falha ao tentar excluir o atleta. Acesso negado.");
                }
            } catch(e) {
                alert("🚨 Erro de comunicação com o servidor.");
            }
        }

        // Exclusão em Massa (Botão Vermelho da Barra Flutuante)
        async function excluirAlunosEmMassa() {
            const qtd = alunosSelecionadosParaExclusao.size;
            if (!confirm(`⚠️ ATENÇÃO: Você está prestes a EXCLUIR PERMANENTEMENTE ${qtd} atleta(s) do seu banco de dados.\n\nDeseja continuar?`)) return;
            
            const token = localStorage.getItem('interclassToken');
            let sucessoCount = 0;
            
            document.body.style.cursor = 'wait';
            
            // Usamos Promise.all para excluir vários ao mesmo tempo, mantendo a velocidade
            const promessasExclusao = Array.from(alunosSelecionadosParaExclusao).map(hashPublico => 
                fetch(`/api/alunos/${hashPublico}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                }).then(res => {
                    if(res.ok) sucessoCount++;
                }).catch(e => console.error("Erro na exclusão de um atleta:", e))
            );
            
            await Promise.all(promessasExclusao);
            
            document.body.style.cursor = 'default';
            alert(`✅ Exclusão concluída! ${sucessoCount} atleta(s) removido(s) com sucesso.`);
            
            limparSelecoesGlobais(); // Limpa e esconde a barra
            await buscarAlunosDoServidor(); // Refaz a contagem e filtros na tela
        }

        function renderizarControlesPaginacao(totalPaginas) {
            const container = document.getElementById('paginacao-container');
            if (totalPaginas <= 1) { container.innerHTML = ''; return; }
            let html = `<button class="btn-page" ${paginaAtual === 1 ? 'disabled' : ''} onclick="paginaAtual--; renderizarGridPaginado();">« Ant</button>`;
            for (let i = 1; i <= totalPaginas; i++) html += `<button class="btn-page ${paginaAtual === i ? 'active' : ''}" onclick="paginaAtual=${i}; renderizarGridPaginado();">${i}</button>`;
            html += `<button class="btn-page" ${paginaAtual === totalPaginas ? 'disabled' : ''} onclick="paginaAtual++; renderizarGridPaginado();">Próx »</button>`;
            container.innerHTML = html;
        }

        // 🔥 FUNÇÃO DE GERAR PDF EXCEL-LIKE (CORRIGIDA) 🔥
        function gerarPDFAlunos() {
            if (listaAlunosBase.length === 0) {
                alert("Nenhum atleta inscrito para gerar o relatório.");
                return;
            }

            let alunosOrdenados = [...listaAlunosBase].sort((a, b) => {
                if(a.turma < b.turma) return -1;
                if(a.turma > b.turma) return 1;
                return a.nome.localeCompare(b.nome);
            });

            let inst = localStorage.getItem('profEscola') ? localStorage.getItem('profEscola').replace(/"/g, '') : 'Instituição Não Definida';
            let prof = localStorage.getItem('profNome') ? localStorage.getItem('profNome').replace(/"/g, '') : 'Professor';
            let dataAtual = new Date().toLocaleDateString('pt-BR');
            let horaAtual = new Date().toLocaleTimeString('pt-BR');

            let linhas = "";
            alunosOrdenados.forEach((a, idx) => {
                linhas += "<tr>" +
                    "<td style='text-align:center; padding: 3px;'>" + (idx + 1) + "</td>" +
                    "<td style='padding: 3px;'><b>" + a.turma + "</b></td>" +
                    "<td style='padding: 3px;'>" + a.nome + "</td>" +
                    "<td style='padding: 3px; text-transform: capitalize;'>" + a.genero + "</td>" +
                    "<td style='padding: 3px;'>" + a.esporte + "</td>" +
                "</tr>";
            });

            let html = "<!DOCTYPE html><html><head><title>Relatório de Alunos - InterclassApp</title>" +
            "<style>" +
                "body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; color: #000; font-size: 10px; }" +
                ".header { text-align: center; margin-bottom: 15px; border-bottom: 2px solid #000; padding-bottom: 10px; }" +
                ".app-name { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }" +
                ".inst-name { font-size: 24px; font-weight: bold; text-transform: uppercase; margin: 0; }" +
                ".prof-name { font-size: 13px; margin-top: 5px; color: #222; }" +
                "table { width: 100%; border-collapse: collapse; margin-top: 10px; }" +
                "th, td { border: 1px solid #000; text-align: left; vertical-align: middle; }" +
                "th { background-color: #ddd; font-weight: bold; font-size: 11px; padding: 4px; }" +
                "tbody tr:nth-child(even) { background-color: #f4f4f4; }" +
                ".no-print { text-align: center; margin-bottom: 20px; padding: 15px; background: #f0f0f0; border: 1px solid #ccc; border-radius: 8px; }" +
                ".btn-print { background: #00f2fe; color: #000; border: 1px solid #00a8b3; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 5px; cursor: pointer; text-transform: uppercase; font-family: sans-serif; }" +
                ".btn-print:hover { background: #00cce6; }" +
                "@media print {" +
                    "@page { margin: 15mm 10mm; }" +
                    "body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }" +
                    "thead { display: table-header-group; }" +
                    "tfoot { display: table-footer-group; }" +
                    ".no-print { display: none !important; }" +
                "}" +
                ".footer { text-align: right; font-size: 9px; margin-top: 15px; color: #555; }" +
            "</style></head><body>" +
            "<div class='no-print'>" +
                "<h3 style='margin-top: 0; font-size: 16px; color: #333;'>Confira a lista antes de imprimir</h3>" +
                "<button class='btn-print' onclick='window.print()'>🖨️ Imprimir Relatório</button>" +
            "</div>" +
            "<div class='header'>" +
                "<div class='app-name'>InterclassApp - Relatório Esportivo Oficial</div>" +
                "<h1 class='inst-name'>" + inst + "</h1>" +
                "<div class='prof-name'>Professor(a) Responsável: <b>" + prof + "</b></div>" +
            "</div>" +
            "<table>" +
                "<thead><tr>" +
                    "<th style='width: 30px; text-align:center;'>#</th>" +
                    "<th style='width: 100px;'>Turma</th>" +
                    "<th>Nome do Atleta</th>" +
                    "<th style='width: 80px;'>Gênero</th>" +
                    "<th style='width: 150px;'>Modalidade</th>" +
                "</tr></thead>" +
                "<tbody>" + linhas + "</tbody>" +
            "</table>" +
            "<div class='footer'>Gerado em " + dataAtual + " às " + horaAtual + " - A paginação é inserida automaticamente pelo navegador na impressão.</div>" +
            "</body></html>";

            let printWindow = window.open('', '_blank');
            printWindow.document.open();
            printWindow.document.write(html);
            printWindow.document.close();
        }
    </script>

	            document.getElementById('footbar-placeholder').innerHTML = h;
