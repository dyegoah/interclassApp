<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestão de Alunos - InterclassApp</title>
    
    <style>
        :root { --theme-primary: #00f2fe; --theme-glow: rgba(0, 242, 254, 0.5); --bg-gradient: linear-gradient(-45deg, #020111, #191970, #000000, #4b0082); }
        body.theme-fem { --theme-primary: #ff00de; --theme-glow: rgba(255, 0, 222, 0.5); }
        body.theme-misto { --theme-primary: #b200ff; --theme-glow: rgba(178, 0, 255, 0.5); }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', 'Segoe UI', sans-serif; }
        
        body { 
            background: 
                radial-gradient(circle at 50% 0%, var(--theme-glow, rgba(0, 242, 254, 0.15)) 0%, transparent 60%),
                linear-gradient(to bottom, rgba(2, 1, 15, 0.85), rgba(2, 1, 15, 0.98)), 
                url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed !important;
            
            background-size: cover !important; 
            color: #ffffff; 
            min-height: 100vh; 
            margin: 0;
            padding-bottom: 100px;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        .arena-container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); padding: 2rem; border-top: 4px solid var(--theme-primary); transition: border-color 0.5s ease; }
        
        .section-title { text-transform: uppercase; font-size: 1.5rem; margin-bottom: 5px; color: var(--theme-primary); text-shadow: 0 0 10px var(--theme-glow); display: flex; align-items: center; gap: 10px; transition: color 0.5s ease, text-shadow 0.5s ease; }
        .subtitle { font-family: 'Segoe UI'; color: rgba(255,255,255,0.7); margin-bottom: 1rem; font-size: 0.95rem; }

        .btn-acao { background: var(--theme-primary); color: #000; border: none; padding: 10px 20px; border-radius: 30px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; font-family: 'Orbitron'; font-size: 0.8rem; }
        .btn-acao:hover { box-shadow: 0 0 20px var(--theme-glow); background: #fff; }
        .btn-excluir { background: transparent; border: 1px solid #ff0055; color: #ff0055; padding: 6px 12px; border-radius: 5px; cursor: pointer; transition: 0.3s; font-family: 'Segoe UI'; font-size: 0.8rem; font-weight: bold; }
        .btn-excluir:hover { background: #ff0055; color: #fff; box-shadow: 0 0 10px rgba(255,0,85,0.5); }

        .total-geral-badge { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--theme-primary); color: #fff; padding: 10px 20px; border-radius: 30px; font-family: 'Orbitron'; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; box-shadow: 0 0 15px var(--theme-glow); transition: all 0.3s ease; }
        .input-dark { width: 100%; padding: 15px 20px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 30px; color: white; font-family: 'Segoe UI'; font-size: 1rem; outline: none; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .input-dark:focus { border-color: var(--theme-primary); box-shadow: 0 0 15px var(--theme-glow); background: rgba(0,0,0,0.8); }

        .tabs-container { display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 1.5rem; gap: 5px; }
        .tab-btn { background: rgba(0,0,0,0.4); border: 1px solid transparent; border-bottom: none; padding: 12px 25px; border-radius: 8px 8px 0 0; color: rgba(255,255,255,0.6); cursor: pointer; transition: 0.3s; font-family: 'Orbitron'; font-size: 0.95rem; }
        .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .tab-btn.active { background: rgba(255, 255, 255, 0.05); color: var(--theme-primary); border-bottom: 3px solid var(--theme-primary); text-shadow: 0 0 8px var(--theme-glow); }
        .tab-count { font-size: 0.8em; opacity: 0.7; font-family: 'Segoe UI'; margin-left: 5px; }

        .resumo-esportes { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 1.5rem; background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); align-items: center; }
        .badge-sport-summary { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); padding: 6px 15px; border-radius: 20px; font-size: 0.85rem; font-family: 'Segoe UI'; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .badge-sport-summary:hover { border-color: var(--theme-primary); background: rgba(255, 255, 255, 0.1); color: #fff; box-shadow: 0 0 10px var(--theme-glow); transform: translateY(-2px); }

        /* 🔥 GRID ADAPTADA: 3 Colunas como padrão */
        .grid-alunos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 2rem;}
        
        .aluno-card { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 15px; display: flex; align-items: center; gap: 15px; transition: 0.3s; position: relative;}
        .aluno-card:hover { border-color: var(--theme-primary); background: rgba(255, 255, 255, 0.05); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        .aluno-foto { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--theme-primary); transition: border-color 0.5s ease;}
        .aluno-info { flex-grow: 1; overflow: hidden; }
        .aluno-nome { font-weight: bold; color: #fff; font-size: 1rem; margin-bottom: 3px; font-family: 'Segoe UI'; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .aluno-detalhes { font-size: 0.8rem; color: rgba(255,255,255,0.6); font-family: 'Segoe UI'; line-height: 1.4; }
        .badge-esporte { background: rgba(255, 255, 255, 0.05); color: var(--theme-primary); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.2); display: inline-block; margin-top: 5px; }

        /* 🔥 PAGINAÇÃO ESTILOS */
        .paginacao-container { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem; }
        .btn-page { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-family: 'Orbitron'; font-weight: bold;}
        .btn-page:hover:not(:disabled) { background: rgba(255,255,255,0.15); border-color: var(--theme-primary); }
        .btn-page.active { background: var(--theme-primary); color: #000; border-color: var(--theme-primary); box-shadow: 0 0 15px var(--theme-glow); }
        .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }

        /* 🔥 RESPONSIVIDADE (TABLET E CELULAR) */
        @media (max-width: 900px) {
            /* Força o Card a virar uma "Coluninha" para caber 3 em Tablets/Celulares sem esmagar o texto */
            .grid-alunos { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .aluno-card { flex-direction: column; text-align: center; padding: 12px 10px; }
            .aluno-foto { width: 50px; height: 50px; margin: 0 auto; }
            .aluno-info { width: 100%; }
            .btn-excluir { width: 100%; margin-top: 8px; }
        }

        @media (max-width: 550px) {
            /* Em celulares muito pequenos, 3 colunas espremem demais o nome. Adaptamos para 2. */
            .grid-alunos { grid-template-columns: repeat(2, 1fr); }
        }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 2000; justify-content: center; align-items: center; }
        .modal-box { background: #05050f; border: 1px solid #ff0055; border-radius: 15px; padding: 2rem; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 0 30px rgba(255,0,85,0.4); }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    </style>
</head>
<body>
    <div class="arena-container">
        <div id="topbar-placeholder"></div>

        <div class="glass">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 15px; margin-bottom: 1.5rem;">
                <div>
                    <h2 class="section-title">👥 Gestão de Atletas</h2>
                    <p class="subtitle">Acompanhe as inscrições e gere torneios rapidamente.</p>
                </div>
                
                <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                    <div id="badge-total-geral" class="total-geral-badge" style="display: none;">
                        🏆 Total Geral: <b id="valor-total-geral" style="color: var(--theme-primary);">0</b>
                    </div>
                    <button class="btn-acao" onclick="window.location.href='/index.html'">🡨 Voltar ao Painel</button>
                </div>
            </div>

            <div style="margin-bottom: 1.5rem; position: relative;">
                <input type="text" id="input-busca" class="input-dark" placeholder="🔍 Buscar por Nome do Aluno, Turma ou Modalidade..." onkeyup="realizarBusca()">
            </div>

            <div class="tabs-container">
                <button class="tab-btn active" id="tab-masculino" onclick="mudarAba('masculino')">
                    🚹 Masculino <span class="tab-count" id="count-masc">(0)</span>
                </button>
                <button class="tab-btn" id="tab-feminino" onclick="mudarAba('feminino')">
                    🚺 Feminino <span class="tab-count" id="count-fem">(0)</span>
                </button>
                <button class="tab-btn" id="tab-misto" onclick="mudarAba('misto')">
                    🚻 Misto <span class="tab-count" id="count-misto">(0)</span>
                </button>
            </div>

            <div id="resumo-container" class="resumo-esportes" style="display: none;">
                </div>

            <div id="loading-alunos" style="text-align: center; padding: 2rem; color: var(--theme-primary);">
                ⏳ Conectando ao Banco de Dados Seguro...
            </div>

            <div class="grid-alunos" id="grid-alunos" style="display: none;"></div>
            
            <div id="paginacao-container" class="paginacao-container"></div>
        </div>
    </div>

    <div id="modal-exclusao" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color: #ff0055; font-family: 'Orbitron'; margin-bottom: 15px;">🚨 Atenção!</h3>
            <p style="font-family: 'Segoe UI'; color: rgba(255,255,255,0.8); margin-bottom: 20px;">
                Tem certeza que deseja remover a inscrição do atleta <br><b id="nome-exclusao" style="color: #fff;"></b>?
            </p>
            <input type="hidden" id="id-exclusao">
            
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-acao" style="background: transparent; border: 1px solid #fff; color: #fff;" onclick="fecharModal()">Cancelar</button>
                <button class="btn-acao" style="background: #ff0055; color: #fff;" onclick="confirmarExclusao()">Sim, Remover</button>
            </div>
        </div>
    </div>

    <div id="footbar-placeholder"></div>

    <script>
        const modalidadeDefs = [
            { id: 1, nome: 'Futsal', icone: '⚽' }, { id: 2, nome: 'Vôlei', icone: '🏐' },
            { id: 3, nome: 'Basquete', icone: '🏀' }, { id: 4, nome: 'Handebol', icone: '🤾' },
            { id: 5, nome: 'Queimada', icone: '☄️' }, { id: 6, nome: 'Vôlei de Areia', icone: '🏖️' },
            { id: 7, nome: 'Natação', icone: '🏊' }, { id: 8, nome: 'Atletismo', icone: '🏃' },
            { id: 9, nome: 'Tênis de Mesa', icone: '🏓' }, { id: 10, nome: 'Xadrez', icone: '♟️' },
            { id: 11, nome: 'Dama', icone: '🏁' }, { id: 12, nome: 'E-Sports', icone: '🎮' }
        ];

        let listaAlunosBase = []; 
        let generoAtual = 'masculino';
        
        // 🔥 VARIÁVEIS DA PAGINAÇÃO
        let alunosFiltradosGlobais = [];
        let paginaAtual = 1;
        const itensPorPagina = 9;

        window.onload = async () => {
            fetch('/topbar.html').then(r => r.text()).then(h => document.getElementById('topbar-placeholder').innerHTML = h).catch(()=>{});
            fetch('/footbar.html').then(r => r.text()).then(h => document.getElementById('footbar-placeholder').innerHTML = h).catch(()=>{});
            
            await buscarAlunosDoServidor();
        };

        async function buscarAlunosDoServidor() {
            try {
                const token = localStorage.getItem('interclassToken');
                if (!token) {
                    alert("Você precisa estar logado para ver os alunos.");
                    window.location.href = '/login.html'; return;
                }

                const response = await fetch('/api/alunos', {
                    method: 'GET', headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    listaAlunosBase = await response.json();
                    document.getElementById('loading-alunos').style.display = 'none';
                    atualizarContadoresGerais(); 
                    mudarAba(generoAtual); 
                } else {
                    document.getElementById('loading-alunos').innerHTML = `❌ Falha de Autenticação.`;
                }
            } catch (error) {
                document.getElementById('loading-alunos').innerHTML = `🚨 Erro de conexão com o servidor.`;
            }
        }

        function atualizarContadoresGerais() {
            const totalGeral = listaAlunosBase.length;
            const totalMasc = listaAlunosBase.filter(a => a.genero === 'masculino').length;
            const totalFem = listaAlunosBase.filter(a => a.genero === 'feminino').length;
            const totalMisto = listaAlunosBase.filter(a => a.genero === 'misto').length;

            document.getElementById('badge-total-geral').style.display = 'flex';
            document.getElementById('valor-total-geral').innerText = totalGeral;
            document.getElementById('count-masc').innerText = `(${totalMasc})`;
            document.getElementById('count-fem').innerText = `(${totalFem})`;
            document.getElementById('count-misto').innerText = `(${totalMisto})`;
        }

        function mudarAba(genero) {
            generoAtual = genero;
            paginaAtual = 1; // Reseta a paginação ao mudar a aba
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${genero}`).classList.add('active');

            const body = document.body;
            body.classList.remove('theme-fem', 'theme-misto');
            if (genero === 'feminino') body.classList.add('theme-fem');
            if (genero === 'misto') body.classList.add('theme-misto');

            aplicarFiltrosEPaginacao();
        }

        function realizarBusca() {
            paginaAtual = 1; // Reseta a paginação ao digitar
            aplicarFiltrosEPaginacao();
        }

        function aplicarFiltrosEPaginacao() {
            let filtrados = listaAlunosBase.filter(a => a.genero === generoAtual);
            const termoBusca = document.getElementById('input-busca') ? document.getElementById('input-busca').value.toLowerCase() : "";
            
            if (termoBusca !== "") {
                filtrados = filtrados.filter(a => 
                    a.nome.toLowerCase().includes(termoBusca) || 
                    a.turma.toLowerCase().includes(termoBusca) || 
                    (a.esporte && a.esporte.toLowerCase().includes(termoBusca))
                );
            }

            alunosFiltradosGlobais = filtrados;
            renderizarResumo(alunosFiltradosGlobais);
            
            // Tratamento contra "Página fantasma"
            const totalPaginas = Math.ceil(alunosFiltradosGlobais.length / itensPorPagina);
            if(paginaAtual > totalPaginas && totalPaginas > 0) paginaAtual = totalPaginas;
            if(paginaAtual === 0 && totalPaginas > 0) paginaAtual = 1;

            renderizarGridPaginado();
        }

        function renderizarResumo(filtrados) {
            const container = document.getElementById('resumo-container');
            if (filtrados.length === 0) { container.style.display = 'none'; return; }
            container.style.display = 'flex';
            
            let contagem = {};
            filtrados.forEach(a => {
                const chave = a.esporte;
                if(!contagem[chave]) contagem[chave] = { nome: a.esporte, icone: a.iconeEsporte || '🏅', count: 0 };
                contagem[chave].count++;
            });

            let html = `<span style="font-size: 0.85rem; color: rgba(255,255,255,0.7); margin-right: 10px;">Encontrados por Modalidade:</span>`;
            for (let chave in contagem) {
                let esporte = contagem[chave];
                html += `
                    <div class="badge-sport-summary" onclick="iniciarSetupDoEsporte('${esporte.nome}')" title="Configurar formato para ${esporte.nome}">
                        ${esporte.icone} ${esporte.nome} <b style="color: #fff;">(${esporte.count})</b>
                    </div>
                `;
            }
            
            const termoBusca = document.getElementById('input-busca') ? document.getElementById('input-busca').value : "";
            if (termoBusca === "") {
                html += `<button class="btn-acao" style="margin-left: auto; padding: 6px 15px; font-size: 0.75rem;" onclick="iniciarSetupGeral()">⚡ Múltiplos Torneios</button>`;
            }
            container.innerHTML = html;
        }

        function iniciarSetupDoEsporte(nomeEsporte) {
            const defEsporte = modalidadeDefs.find(m => m.nome === nomeEsporte);
            if (!defEsporte) return;
            const setupData = { genero: generoAtual, esportes: [ { id: defEsporte.id, configurado: false } ] };
            localStorage.setItem('arenaSetup', JSON.stringify(setupData));
            window.location.href = '/torneios.html';
        }

        function iniciarSetupGeral() {
            const setupData = { genero: generoAtual, esportes: [] };
            localStorage.setItem('arenaSetup', JSON.stringify(setupData));
            window.location.href = '/modalidades.html';
        }

        // 🔥 O MOTOR DE EXIBIÇÃO PAGINADA
        function renderizarGridPaginado() {
            const container = document.getElementById('grid-alunos');
            container.style.display = 'grid';
            container.innerHTML = '';

            const totalItens = alunosFiltradosGlobais.length;
            const totalPaginas = Math.ceil(totalItens / itensPorPagina);

            if (totalItens === 0) {
                const termoBusca = document.getElementById('input-busca') ? document.getElementById('input-busca').value : "";
                if (termoBusca !== "") {
                    container.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: #ff0055; padding: 3rem 0; font-weight: bold;">Nenhum atleta encontrado para "${termoBusca}".</p>`;
                } else {
                    container.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: rgba(255,255,255,0.5); padding: 3rem 0;">Nenhum atleta inscrito na categoria ${generoAtual.toUpperCase()}.</p>`;
                }
                document.getElementById('paginacao-container').innerHTML = '';
                return;
            }

            // Fatia o array para pegar só os 9 desta página
            const inicio = (paginaAtual - 1) * itensPorPagina;
            const fim = inicio + itensPorPagina;
            const alunosPaginaAtual = alunosFiltradosGlobais.slice(inicio, fim);

            alunosPaginaAtual.forEach(aluno => {
                let fotoSegura = aluno.fotoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(aluno.nome)}&background=222&color=fff`;
                container.innerHTML += `
                    <div class="aluno-card" id="card-aluno-${aluno.id}">
                        <img src="${fotoSegura}" class="aluno-foto" alt="Foto Atleta">
                        <div class="aluno-info">
                            <div class="aluno-nome" title="${aluno.nome}">${aluno.nome}</div>
                            <div class="aluno-detalhes">
                                Turma: ${aluno.turma}<br>
                                Nasc: ${formatarData(aluno.dataNascimento)}
                            </div>
                            <div class="badge-esporte">${aluno.iconeEsporte || '🏅'} ${aluno.esporte}</div>
                        </div>
                        <button class="btn-excluir" onclick="abrirModalExclusao(${aluno.id}, '${aluno.nome.replace(/'/g, "\\'")}')">X</button>
                    </div>
                `;
            });

            renderizarControlesPaginacao(totalPaginas);
        }

        // 🔥 RENDERIZA OS BOTÕES [1] [2] [3]
        function renderizarControlesPaginacao(totalPaginas) {
            const container = document.getElementById('paginacao-container');
            if (totalPaginas <= 1) { container.innerHTML = ''; return; }

            let html = `<button class="btn-page" ${paginaAtual === 1 ? 'disabled' : ''} onclick="mudarPagina(${paginaAtual - 1})">« Ant</button>`;
            
            for (let i = 1; i <= totalPaginas; i++) {
                html += `<button class="btn-page ${paginaAtual === i ? 'active' : ''}" onclick="mudarPagina(${i})">${i}</button>`;
            }
            
            html += `<button class="btn-page" ${paginaAtual === totalPaginas ? 'disabled' : ''} onclick="mudarPagina(${paginaAtual + 1})">Próx »</button>`;
            container.innerHTML = html;
        }

        function mudarPagina(novaPagina) {
            paginaAtual = novaPagina;
            renderizarGridPaginado();
        }

        function formatarData(dataIso) {
            if(!dataIso) return "N/A";
            const partes = dataIso.split('-');
            return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : dataIso;
        }

        function abrirModalExclusao(id, nome) { 
            document.getElementById('id-exclusao').value = id; 
            document.getElementById('nome-exclusao').textContent = nome; 
            document.getElementById('modal-exclusao').style.display = 'flex'; 
        }

        function fecharModal() { document.getElementById('modal-exclusao').style.display = 'none'; }

        async function confirmarExclusao() {
            const id = parseInt(document.getElementById('id-exclusao').value);
            const token = localStorage.getItem('interclassToken');
            try {
                const response = await fetch(`/api/alunos/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                if (response.ok) {
                    listaAlunosBase = listaAlunosBase.filter(a => a.id !== id);
                    fecharModal(); 
                    atualizarContadoresGerais();
                    aplicarFiltrosEPaginacao(); // Recalcula a página correta automaticamente
                } else { alert("⚠️ Servidor recusou a exclusão. Você tem permissão?"); }
            } catch (error) { alert("🚨 Erro ao tentar excluir no banco de dados."); }
        }
    </script>
</body>
</html>
